packages:
  receiver: !include
    file: "../projects/yamaha-receiver/esp32.yaml"
    vars:
      name: "bean-java"
      friendly_name: "Java"
      language: "de"
      receiver_device_id: "receiver_device"

  bluetooth_proxy: !include ../base/bluetooth_proxy.yaml

esphome:
  areas:
  - id: "area_stuebli"
    name: "Stübli"
  devices:
  - id: "receiver_device"
    name: "YAMAHA Receiver"
    area_id: "area_stuebli"
