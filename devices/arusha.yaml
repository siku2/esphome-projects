substitutions:
  api_encryption_key: !secret arusha_api_encryption_key
  language: "de"

packages:
  base: !include "../base/device.yaml"
  bluetooth_proxy: !include "../base/bluetooth_proxy.yaml"
  tank: !include
    file: "../projects/water-tank/tank.yaml"
    vars:
      tank_id: "rwt"
      device_id: "rwt_device"
      adc_pin: "GPIO35"
      attenuation: "12db"
      samples: 255
      sample_interval: "5s"
      window_size: 60
      send_every: 12
      voltage_max: 4.0
      fill_level_internal: true
      initial_voltage_empty: 0.63
      initial_voltage_full: 1.2
      initial_volume_full: 3800
  tank_level: !include
    file: "../projects/water-tank/level.yaml"
    vars:
      tank_id: "rwt"
      device_id: "rwt_device"
      full_pin: "GPIO23"
      full_supply_pin: "GPIO22"
      empty_entity_id: "binary_sensor.trinkwasserventil_input"
  ac: !include
    file: "../projects/coolix-ac/ac.yaml"
    vars:
      transmitter_pin: 14
      device_id: "ac_device"
      power_switch_entity_id: "switch.keller_klimaanlage"

esphome:
  name: "bean-arusha"
  friendly_name: "Arusha"
  areas:
  - id: "area_rain_water"
    name: "Regenwassernutzung"
  - id: "area_basement"
    name: "Keller"
  devices:
  - id: "rwt_device"
    name: "Regenwassertank 1 und 2"
    area_id: "area_rain_water"
  - id: "ac_device"
    name: "Keller Klimaanlage"
    area_id: "area_basement"

esp32:
  # See: <https://www.espboards.dev/esp32/esp32doit-devkit-v1/>
  # TODO: confirm this is the correct board
  board: "esp32doit-devkit-v1"
  framework:
    type: "esp-idf"
