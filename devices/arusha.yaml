substitutions:
  api_encryption_key: !secret arusha_api_encryption_key
  language: "de"

packages:
  base: !include "../base/device.yaml"
  bluetooth_proxy: !include "../base/bluetooth_proxy.yaml"
  tank: !include
    file: "../projects/water-tank/tank.yaml"
    vars:
      tank_id: "rwt"
      tank_name: "Regenwassertank"
      adc_pin: "GPIO35"
      attenuation: "12db"
      samples: 255
      sample_interval: "5s"
      window_size: 60
      send_every: 12
      voltage_max: 4.0
      initial_voltage_empty: 0.5
      initial_voltage_full: 1.5
      initial_volume_full: 3800
      name_voltage: "Rain water tank voltage"
      name_percentage: "Rain water tank fill percentage"
      name_volume: "Rain water tank fill volume"
      name_volume_full: "Regenwassertank Volumen Voll"
  tank_level: !include
    file: "../projects/water-tank/level.yaml"
    vars:
      tank_id: "rwt"
      tank_name: "Regenwassertank"
      full_pin: "GPIO23"
      full_supply_pin: "GPIO22"
      empty_entity_id: "binary_sensor.trinkwasserventil_input"
  ac: !include
    file: "../projects/coolix-ac/ac.yaml"
    vars:
      transmitter_pin: 14
      climate_name: "Keller Klimaanlage"
      power_switch_entity_id: "switch.keller_klimaanlage"

esphome:
  name: "bean-arusha"
  friendly_name: "Regenwassertank"

esp32:
  # See: <https://www.espboards.dev/esp32/esp32doit-devkit-v1/>
  # TODO: confirm this is the correct board
  board: "esp32doit-devkit-v1"
  framework:
    type: "esp-idf"
