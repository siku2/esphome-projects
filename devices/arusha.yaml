substitutions:
  api_encryption_key: !secret arusha_api_encryption_key
  language: "de"

packages:
  base: !include "../packages/base/device.yaml"
  bluetooth_proxy: !include "../packages/base/bluetooth_proxy.yaml"

esphome:
  name: esp-arusha
  friendly_name: Regenwassertank

esp32:
  # See: <https://www.espboards.dev/esp32/esp32doit-devkit-v1/>
  # TODO: confirm this is the correc board
  board: "esp32doit-devkit-v1"
  framework:
    type: esp-idf

remote_transmitter:
  pin: 14
  carrier_duty_percent: 50%
  non_blocking: true

switch:
- id: sw_lv_1
  internal: true
  restore_mode: ALWAYS_ON
  platform: gpio
  pin: GPIO22

- id: sw_ac_power
  on_turn_on:
    then:
    - delay: 2s
    # Force the climate to re-transmit the state.
    - climate.control:
        id: climate_main
  on_turn_off:
    then:
    - climate.control:
        id: climate_main
        mode: "OFF"
  platform: homeassistant
  entity_id: switch.keller_klimaanlage

- id: sw_auto_calibrate
  name: "Regenwassertank Autokalibrierung"
  restore_mode: RESTORE_DEFAULT_ON
  entity_category: CONFIG
  device_class: switch
  platform: template
  optimistic: true
  assumed_state: true

binary_sensor:
- id: bs_lv_1
  name: "Regenwassertank Voll"
  platform: gpio
  pin:
    number: GPIO23
    inverted: true
    mode:
      input: true
      pulldown: true
  # As soon as the tank is no longer full, take a voltage reading and update the "full voltage" value.
  on_release:
    then:
    - if:
        condition:
        - switch.is_on: sw_auto_calibrate
        then:
        - component.update: sensor_rwt_voltage
        - number.set:
            id: rwt_voltage_full
            value: !lambda |
              return id(sensor_rwt_voltage).state;
        - event.trigger: 
            id: ev_diag
            event_type: "auto_calibrated_full"

- id: bs_lv_0
  name: "Regenwassertank leer"
  platform: homeassistant
  entity_id: binary_sensor.trinkwasserventil_input
  # As soon as the tank is no longer empty, take a voltage reading and update the "empty voltage" value.
  on_release:
    then:
    - if:
        condition:
        - switch.is_on: sw_auto_calibrate
        then:
        - component.update: sensor_rwt_voltage
        - number.set:
            id: rwt_voltage_empty
            value: !lambda |
              return id(sensor_rwt_voltage).state;
        - event.trigger: 
            id: ev_diag
            event_type: "auto_calibrated_empty"

climate:
- id: climate_main
  platform: coolix
  name: "Keller Klimaanlage"
  on_control: 
    then:
    - if:
        condition:
          lambda: !lambda |
            return x.get_mode() != CLIMATE_MODE_OFF;
        then:
        - switch.turn_on: sw_ac_power

number:
- platform: template
  id: rwt_voltage_empty
  name: "Regenwassertank Spannung Leer"
  entity_category: config
  unit_of_measurement: "µV"
  optimistic: true
  min_value: 0
  max_value: 4e6
  step: 1
  restore_value: true
  initial_value: 0.5e6
- platform: template
  id: rwt_voltage_full
  name: "Regenwassertank Spannung Voll"
  entity_category: config
  unit_of_measurement: "µV"
  optimistic: true
  min_value: 0
  max_value: 4e6
  step: 1
  restore_value: true
  initial_value: 1.5e6
- platform: template
  id: rwt_volume_full
  name: "Regenwassertank Volumen Voll"
  entity_category: config
  unit_of_measurement: "L"
  optimistic: true
  min_value: 0
  max_value: 10000
  step: 1
  restore_value: true
  initial_value: 3800

sensor:
# based on: <https://www.dfrobot.com/product-1863.html>
- id: sensor_rwt_voltage
  name: Rain water tank voltage
  unit_of_measurement: "µV"
  device_class: voltage
  state_class: measurement
  accuracy_decimals: 0
  update_interval: 5s
  filters:
  - sliding_window_moving_average:
      # Include the last 5 minutes of samples
      window_size: 60
      # And emit a value every minute
      send_every: 12
      send_first_at: 12
  - multiply: 1e6
  - round: 0
  entity_category: diagnostic
  platform: adc
  pin: GPIO35
  attenuation: 12db
  samples: 255
  on_value:
    then:
    - lambda: !lambda |
        float mul;
        if (id(bs_lv_1).state) {
          mul = 1.0;
        } else if (id(bs_lv_0).state) {
          mul = 0.0;
        } else {
          float voltage_empty = id(rwt_voltage_empty).state;
          float voltage_full = id(rwt_voltage_full).state;
          mul = (x - voltage_empty) / (voltage_full - voltage_empty);
        }
        id(sensor_rwt_fill_percentage).publish_state(100.0 * mul);
        id(sensor_rwt_fill_volume).publish_state(mul * id(rwt_volume_full).state);

- id: sensor_rwt_fill_volume
  name: Rain water tank fill volume
  unit_of_measurement: "L"
  device_class: volume
  state_class: measurement
  icon: "mdi:water-well"
  accuracy_decimals: 0
  filters:
  - round: 0
  platform: template
  update_interval: never

- id: sensor_rwt_fill_percentage
  name: Rain water tank fill percentage
  unit_of_measurement: "%"
  state_class: measurement
  icon: "mdi:percent"
  accuracy_decimals: 0
  filters:
  - round: 0
  platform: template
  update_interval: never

event:
- id: ev_diag
  name: "Diagnostic Events"
  platform: template
  event_types:
  - auto_calibrated_full
  - auto_calibrated_empty
