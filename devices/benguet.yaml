packages:
  project: !include
    file: "../projects/door-display/esp32.yaml"
    vars:
      name: "bean-benguet"
      friendly_name: "DoorDisplay"
      language: "de"
      door_lock_entity_id: "lock.smart_lock_pro"
      door_action: "script.gang_eg_schloss_hausture_toggle"
      bicycle_cover_entity_id: "cover.aussen_veloraum"
      gate_action: "script.bastelraum_tor_toggle"

# The long supply cable cannot deliver the boot current peaks at full power
wifi:
  output_power: "13dB"
