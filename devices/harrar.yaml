button:
- &program_velo
  id: "program_velo"
  name: "Aussen Veloraum Program"
  icon: "mdi:access-point"
  entity_category: "config"
  platform: "template"

- <<: *program_velo
  id: "program_unterstand"
  name: "Aussen Unterstand Tor Program"

- <<: *program_velo
  id: "program_garage"
  name: "Aussen Garagentor Program"

- name: "Aussen Veloraum Brute-force"
  entity_category: "config"
  on_press: 
    then:
    - repeat:
        count: 0x7fff
        then:
        - lambda: !lambda |
            if (iteration % 256 == 0) {
              uint32_t prog = 100 * iteration / 0x7fff;
              ESP_LOGI("main", "progress: %d", prog);
            }
        - cover.close: "velo"
        - cover.open: "velo"
        - delay: "20ms"
  platform: "template"

cover:
- id: "velo"
  name: "Aussen Veloraum"
  device_class: "garage"
  platform: "somfy_cover"
  cc1101_module: "cc_module"
  remote_code: 0xB51201
  open_duration: "40s"
  close_duration: "35s"
  storage_key: "velo"
  prog_button: "program_velo"

- id: "unterstand"
  name: "Aussen Unterstand Tor"
  device_class: "shutter"
  platform: "somfy_cover"
  cc1101_module: "cc_module"
  remote_code: 0xB51221
  open_duration: "41s"
  close_duration: "36s"
  storage_key: "unterstand"
  prog_button: "program_unterstand"

- id: "garage"
  name: "Aussen Garagentor"
  device_class: "garage"
  platform: "somfy_cover"
  cc1101_module: "cc_module"
  remote_code: 0xB51222
  open_duration: "25s"
  close_duration: "24s"
  storage_key: "garage"
  prog_button: "program_garage"
