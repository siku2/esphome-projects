substitutions:
  name: "bean-jember"
  language: "de"

packages:
  base: !include "../base/device.yaml"
  tank: !include
    file: "../projects/water-tank/tank.yaml"
    vars:
      tank_id: "wt"
      device_id: "wt_device"
      adc_pin: "GPIO35"
      # Around 1.5 V when full
      attenuation: "6db"
      samples: 10
      sample_interval: "1s"
      average_interval: "30s"
      window_size: 2
      voltage_max: 1.8
      fill_level_internal: false
      initial_voltage_empty: 0.234
      initial_voltage_full: 1.42
      initial_volume_full: 540
  tank_2: !include
    file: "../projects/water-tank/tank.yaml"
    vars:
      tank_id: "wt2"
      device_id: "wt2_device"
      adc_pin: "GPIO34"
      attenuation: "6db"
      samples: 10
      sample_interval: "1s"
      average_interval: "30s"
      window_size: 2
      voltage_max: 1.8
      fill_level_internal: true
      initial_voltage_empty: 0.108
      initial_voltage_full: 1.0
      initial_volume_full: 5000
  tank_2_link: !include
    file: "../projects/water-tank/linked.yaml"
    vars:
      tank_id: "wt2"
      device_id: "wt2_device"
      system_device_id: "rain_water_device"
      linked_full_entity_id: "binary_sensor.regenwassertank_voll"
      linked_volume_entity_id: "sensor.rain_water_tank_fill_volume"
      linked_volume_full_entity_id: "number.regenwassertank_volumen_voll"

esphome:
  name: "${name}"
  friendly_name: "Jember"
  areas:
  - id: "area_rain_water"
    name: "Regenwassernutzung"
  devices:
  - id: "wt_device"
    name: "Amphore"
  - id: "wt2_device"
    name: "Regenwassertank 3"
    area_id: "area_rain_water"
  - id: "rain_water_device"
    name: "Regenwasser"
    area_id: "area_rain_water"
  - id: "light_device"
    name: "Lichtstreifen"

esp32:
  board: "esp32dev"
  framework:
    type: "esp-idf"

light:
- name: ""
  device_id: "light_device"
  effects:
  - addressable_rainbow:
  - addressable_color_wipe:
  - addressable_scan:
  - addressable_twinkle:
  - addressable_random_twinkle:
  - addressable_fireworks:
  - addressable_flicker:
  platform: "esp32_rmt_led_strip"
  pin: "GPIO26"
  num_leds: 365
  channel_colors: "GRB"
  chipset: "WS2812"
