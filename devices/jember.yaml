substitutions:
  api_encryption_key: !secret jember_api_encryption_key
  language: "de"

packages:
  base: !include "../base/device.yaml"
  tank: !include
    file: "../projects/water-tank/tank.yaml"
    vars:
      tank_id: "wt"
      tank_name: "Wassertank"
      adc_pin: "GPIO35"
      # Around 1.5 V when full
      attenuation: "6db"
      samples: 10
      sample_interval: "1s"
      window_size: 60
      send_every: 30
      voltage_max: 1.8
      initial_voltage_empty: 1.0
      initial_voltage_full: 1.0
      initial_volume_full: 1.0
      name_voltage: "Wassertank Raw Voltage"
      name_percentage: "Wassertank"
      name_volume: "Wassertank Volumen"
      name_volume_full: "Wassertank Volumen"
  tank_2: !include
    file: "../projects/water-tank/tank.yaml"
    vars:
      tank_id: "wt2"
      tank_name: "Regenwassertank 3"
      adc_pin: "GPIO34"
      attenuation: "6db"
      samples: 10
      sample_interval: "1s"
      window_size: 60
      send_every: 30
      voltage_max: 1.8
      initial_voltage_empty: 0.108
      initial_voltage_full: 1.0
      initial_volume_full: 4000
      name_voltage: "Wassertank 2 Raw Voltage"
      name_percentage: "Regenwassertank 3"
      name_volume: "Regenwassertank 3 Volumen"
      name_volume_full: "Regenwassertank 3 Volumen Voll"
  tank_2_link: !include
    file: "../projects/water-tank/linked.yaml"
    vars:
      tank_id: "wt2"
      tank_name: "Regenwassertank 3"
      linked_full_entity_id: "binary_sensor.regenwassertank_voll"
      linked_volume_entity_id: "sensor.rain_water_tank_fill_volume"
      name_total_volume: "Regenwasser Gesamtvolumen"

esphome:
  name: "bean-jember"
  friendly_name: "Jember"

esp32:
  board: "esp32dev"
  framework:
    type: "esp-idf"

light:
- name: "Light strip"
  effects:
  - addressable_rainbow:
  - addressable_color_wipe:
  - addressable_scan:
  - addressable_twinkle:
  - addressable_random_twinkle:
  - addressable_fireworks:
  - addressable_flicker:
  platform: "esp32_rmt_led_strip"
  pin: "GPIO26"
  num_leds: 365
  channel_colors: "GRB"
  chipset: "WS2812"
