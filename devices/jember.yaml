substitutions:
  api_encryption_key: !secret jember_api_encryption_key
  language: "de"

packages:
  base: !include "../packages/base/device.yaml"
  tank: !include
    file: "../projects/water-tank/tank.yaml"
    vars:
      tank_id: "wt"
      tank_name: "Wassertank"
      adc_pin: "GPIO35"
      # Around 1.5 V when full
      attenuation: "6db"
      samples: 10
      sample_interval: "1s"
      window_size: 60
      send_every: 30
      voltage_max: 1.8
      initial_voltage_empty: 1.0
      initial_voltage_full: 1.0
      initial_volume_full: 1.0
      name_voltage: "Wassertank Raw Voltage"
      name_percentage: "Wassertank"
      name_volume: "Wassertank Volumen"
      name_volume_full: "Wassertank Volumen"
  tank_2: !include
    file: "../projects/water-tank/voltage.yaml"
    vars:
      tank_id: "wt2"
      adc_pin: "GPIO34"
      attenuation: "6db"
      samples: 10
      sample_interval: "1s"
      window_size: 60
      send_every: 30
      name_voltage: "Wassertank 2 Raw Voltage"

esphome:
  name: "bean-jember"
  friendly_name: "Jember"

esp32:
  board: "esp32dev"
  framework:
    type: "esp-idf"

light:
- name: "Light strip"
  effects:
  - addressable_rainbow:
  - addressable_color_wipe:
  - addressable_scan:
  - addressable_twinkle:
  - addressable_random_twinkle:
  - addressable_fireworks:
  - addressable_flicker:
  platform: "esp32_rmt_led_strip"
  pin: "GPIO26"
  num_leds: 365
  channel_colors: "GRB"
  chipset: "WS2812"
