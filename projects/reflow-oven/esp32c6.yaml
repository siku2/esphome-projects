substitutions:
# name: "reflow-oven"
# friendly_name: "Reflow Oven"

packages:
  core: !include core.yaml

dashboard_import:
  package_import_url: "github://siku2/esphome-projects/projects/reflow-oven/esp32c6.yaml@main"

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_4MB: y
