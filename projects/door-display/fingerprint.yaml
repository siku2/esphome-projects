number:
- platform: "template"
  id: "fp_num_scans"
  name: "${i18n.doordisplay[language].scans}"
  icon: "mdi:counter"
  entity_category: "config"
  mode: "box"
  min_value: 2
  max_value: 6
  step: 1
  update_interval: "never"
  optimistic: true
  restore_value: true
