uart:
  rx_pin: "GPIO35"
  tx_pin: "GPIO32"
  baud_rate: 57600

fingerprint_grow:
  sensing_pin:
    number: "GPIO21"
    allow_other_uses: true
  password: "${fingerprint_password}"
  on_finger_scan_matched:
  - script.execute: "fp_touch_begin"
  - lambda: !lambda "id(fp_touch_matched) = true;"
  - fingerprint_grow.aura_led_control:
      state: "BREATHING"
      speed: 200
      color: "BLUE"
      count: 1
  - component.update: "fp_last_person"
  - event.trigger:
      id: "fp_scan_event"
      event_type: "matched"
  - lambda: !lambda |-
      auto target = id(target_entity_selection).active_index().value_or(0);
      bool farewell = target == 0 && id(sensor_door_lock).get_state() == "unlocked";
      select::Select *selection = farewell ? (select::Select *) id(farewell_selection) : (select::Select *) id(greeting_selection);
      selection->make_call().select_next(true).perform();
      id(hello_text) = selection->current_option() + " " + id(fp_last_person).state;
  - if:
      condition:
        display.is_displaying_page: "pg_hello"
      then:
      - component.update: "display_main"
      else:
      - display.page.show: "pg_hello"
  - script.execute:
      id: "overlay_return"
      timeout: 3000
  - script.execute: "perform_target_action"

  on_finger_scan_unmatched:
  - script.execute:
      id: "fp_bad_scan"
      kind: 1

  on_finger_scan_misplaced:
  - script.execute:
      id: "fp_bad_scan"
      kind: 2

  on_finger_scan_invalid:
  - script.execute:
      id: "fp_bad_scan"
      kind: 3

  on_enrollment_scan:
  - lambda: !lambda |-
      auto counter = id(fp_num_scans_counter);
      counter->publish_state(counter->state + 1);
  - fingerprint_grow.aura_led_control:
      state: "FLASHING"
      speed: 25
      color: "BLUE"
      count: 2
  - fingerprint_grow.aura_led_control:
      state: "ALWAYS_ON"
      speed: 0
      color: "PURPLE"
      count: 0

  on_enrollment_done:
  - fingerprint_grow.aura_led_control:
      state: "BREATHING"
      speed: 100
      color: "BLUE"
      count: 2

  on_enrollment_failed:
  - fingerprint_grow.aura_led_control:
      state: "FLASHING"
      speed: 25
      color: "RED"
      count: 4

binary_sensor:
- platform: "fingerprint_grow"
  id: "fp_enrolling"
  name: "${i18n.doordisplay[language].enroll_active}"
  entity_category: "diagnostic"
  on_press:
    then:
    - lambda: !lambda "id(fp_num_scans_counter).publish_state(0);"
    - script.stop: "overlay_return"
    - display.page.show: "pg_enroll"
    - fingerprint_grow.aura_led_control:
        state: "ALWAYS_ON"
        speed: 0
        color: "PURPLE"
        count: 0
  on_release:
    then:
    - display.page.show: "pg_main"

- platform: "gpio"
  pin:
    number: "GPIO21"
    allow_other_uses: true
  name: "${i18n.doordisplay[language].finger_touch}"
  entity_category: "diagnostic"
  filters:
  - invert
  on_press:
    then:
    - script.execute: "fp_touch_begin"
  on_release:
    then:
    - if:
        condition:
          lambda: !lambda "return !id(fp_touch_matched);"
        then:
        - if:
            condition:
              lambda: !lambda "return millis() - id(fp_touch_start) <= 400;"
            then:
            - lambda: !lambda "id(fp_touch_pending) = 0;"
            - if:
                condition:
                  lambda: !lambda "return millis() - id(fp_touch_start) >= 50;"
                then:
                - if:
                    condition:
                      or:
                      - display.is_displaying_page: "pg_hello"
                      - display.is_displaying_page: "pg_error"
                    then:
                    - script.stop: "overlay_return"
                    - display.page.show: "pg_main"
                    else:
                    - select.next:
                        id: "target_entity_selection"
                    - fingerprint_grow.aura_led_control:
                        state: "FLASHING"
                        speed: 50
                        color: "WHITE"
                        count: 1
            else:
            - if:
                condition:
                  lambda: !lambda "return id(fp_touch_pending) != 0;"
                then:
                - script.execute:
                    id: "fp_report_scan"
                    kind: !lambda "return id(fp_touch_pending);"
    - lambda: !lambda |-
        id(fp_touch_start) = 0;
        id(fp_touch_pending) = 0;
        id(fp_touch_matched) = false;

sensor:
- platform: "fingerprint_grow"
  fingerprint_count:
    name: "${i18n.doordisplay[language].finger_count}"
    entity_category: "diagnostic"
  last_finger_id:
    name: "${i18n.doordisplay[language].last_finger_id}"
    id: "fp_last_finger_id"
    entity_category: "diagnostic"
  last_confidence:
    name: "${i18n.doordisplay[language].last_confidence}"
    entity_category: "diagnostic"
  capacity:
    name: "${i18n.doordisplay[language].capacity}"
    entity_category: "diagnostic"

- platform: "template"
  id: "fp_finger_id"
  name: "${i18n.doordisplay[language].active_id}"
  accuracy_decimals: 0
  entity_category: "diagnostic"
  update_interval: "never"
  lambda: !lambda |
    auto fingers_per_hand = id(fp_finger).size();
    auto fingers_per_person = fingers_per_hand * id(fp_hand).size();
    return id(fp_finger).active_index().value_or(0)
      + fingers_per_hand * id(fp_hand).active_index().value_or(0)
      + fingers_per_person * id(fp_person).active_index().value_or(0);

- platform: "template"
  id: "fp_num_scans_counter"
  name: "${i18n.doordisplay[language].scans_done}"
  accuracy_decimals: 0
  entity_category: "diagnostic"
  update_interval: "never"
  on_value:
    then:
    - component.update: "display_main"

event:
- platform: "template"
  id: "fp_scan_event"
  name: "${i18n.doordisplay[language].scan_event}"
  icon: "mdi:fingerprint"
  event_types:
  - "matched"
  - "unmatched"
  - "misplaced"
  - "invalid"
  - "action_failed"

globals:
# Pending result: 0 none, 1 unmatched, 2 misplaced, 3 invalid
- id: "fp_touch_pending"
  type: "int"
  initial_value: "0"
- id: "fp_touch_start"
  type: "uint32_t"
  initial_value: "0"
- id: "fp_touch_matched"
  type: "bool"
  initial_value: "false"

script:
# A scan can report before the touch press, so whichever comes first starts the touch
- id: "fp_touch_begin"
  then:
  - lambda: !lambda |-
      if (id(fp_touch_start) == 0 || millis() - id(fp_touch_start) > 2000) {
        id(fp_touch_start) = millis();
        id(fp_touch_pending) = 0;
        id(fp_touch_matched) = false;
      }

- id: "fp_report_scan"
  parameters:
    kind: "int"
  then:
  - event.trigger:
      id: "fp_scan_event"
      event_type: !lambda |-
        return kind == 1 ? "unmatched" : kind == 2 ? "misplaced" : "invalid";
  - fingerprint_grow.aura_led_control:
      state: "FLASHING"
      speed: 25
      color: "RED"
      count: !lambda "return kind == 1 ? 2 : 1;"

- id: "fp_bad_scan"
  parameters:
    kind: "int"
  then:
  - if:
      condition:
        lambda: !lambda "return !id(fp_enrolling).state;"
      then:
      - script.execute: "fp_touch_begin"
      - if:
          condition:
            lambda: !lambda "return millis() - id(fp_touch_start) > 400;"
          then:
          - script.execute:
              id: "fp_report_scan"
              kind: !lambda "return kind;"
          else:
          - lambda: !lambda |-
              if (id(fp_touch_pending) == 0) id(fp_touch_pending) = kind;

text_sensor:
- platform: "template"
  id: "fp_last_person"
  name: "${i18n.doordisplay[language].last_person}"
  icon: "mdi:account"
  update_interval: "never"
  lambda: !lambda |-
    auto fingers_per_person = id(fp_finger).size() * id(fp_hand).size();
    size_t person_index = id(fp_last_finger_id).state / fingers_per_person;
    text::Text *names[] = {id(fp_name_1), id(fp_name_2), id(fp_name_3), id(fp_name_4)};
    if (person_index >= 4) return "";
    auto name = names[person_index]->state;
    return name.empty() ? id(fp_person).at(person_index).value_or("") : name;

select:
- platform: "template"
  id: "fp_person"
  name: "${i18n.doordisplay[language].person}"
  icon: "mdi:account"
  entity_category: "config"
  update_interval: "never"
  optimistic: true
  restore_value: true
  options:
  - "${i18n.doordisplay[language].person_1}"
  - "${i18n.doordisplay[language].person_2}"
  - "${i18n.doordisplay[language].person_3}"
  - "${i18n.doordisplay[language].person_4}"
  on_value:
    then:
    - component.update: "fp_finger_id"

- platform: "template"
  id: "fp_hand"
  name: "${i18n.doordisplay[language].hand}"
  icon: "mdi:hand-back-left"
  entity_category: "config"
  update_interval: "never"
  optimistic: true
  restore_value: true
  options:
  - "${i18n.doordisplay[language].hand_left}"
  - "${i18n.doordisplay[language].hand_right}"
  on_value:
    then:
    - component.update: "fp_finger_id"

- platform: "template"
  id: "fp_finger"
  name: "${i18n.doordisplay[language].finger}"
  icon: "mdi:fingerprint"
  entity_category: "config"
  update_interval: "never"
  optimistic: true
  restore_value: true
  options:
  - "${i18n.doordisplay[language].finger_thumb}"
  - "${i18n.doordisplay[language].finger_index}"
  - "${i18n.doordisplay[language].finger_middle}"
  - "${i18n.doordisplay[language].finger_ring}"
  - "${i18n.doordisplay[language].finger_little}"
  on_value:
    then:
    - component.update: "fp_finger_id"

text:
- platform: "template"
  id: "fp_name_1"
  name: "${i18n.doordisplay[language].person_1_name}"
  icon: "mdi:account-edit"
  entity_category: "config"
  mode: "text"
  max_length: 16
  initial_value: ""
  optimistic: true
  restore_value: true
  on_value:
    then:
    - component.update: "fp_last_person"
    - component.update: "display_main"

- platform: "template"
  id: "fp_name_2"
  name: "${i18n.doordisplay[language].person_2_name}"
  icon: "mdi:account-edit"
  entity_category: "config"
  mode: "text"
  max_length: 16
  initial_value: ""
  optimistic: true
  restore_value: true
  on_value:
    then:
    - component.update: "fp_last_person"
    - component.update: "display_main"

- platform: "template"
  id: "fp_name_3"
  name: "${i18n.doordisplay[language].person_3_name}"
  icon: "mdi:account-edit"
  entity_category: "config"
  mode: "text"
  max_length: 16
  initial_value: ""
  optimistic: true
  restore_value: true
  on_value:
    then:
    - component.update: "fp_last_person"
    - component.update: "display_main"

- platform: "template"
  id: "fp_name_4"
  name: "${i18n.doordisplay[language].person_4_name}"
  icon: "mdi:account-edit"
  entity_category: "config"
  mode: "text"
  max_length: 16
  initial_value: ""
  optimistic: true
  restore_value: true
  on_value:
    then:
    - component.update: "fp_last_person"
    - component.update: "display_main"

number:
- platform: "template"
  id: "fp_num_scans"
  name: "${i18n.doordisplay[language].scans}"
  icon: "mdi:counter"
  entity_category: "config"
  mode: "box"
  min_value: 2
  max_value: 6
  step: 1
  update_interval: "never"
  optimistic: true
  restore_value: true

button:
- platform: "template"
  name: "${i18n.doordisplay[language].enroll_button}"
  icon: "mdi:key-plus"
  entity_category: "config"
  on_press:
    then:
    - fingerprint_grow.enroll:
        finger_id: !lambda "return id(fp_finger_id).state;"
        num_scans: !lambda "return id(fp_num_scans).state;"

- platform: "template"
  name: "${i18n.doordisplay[language].cancel_enroll}"
  icon: "mdi:cancel"
  entity_category: "config"
  on_press:
    then:
    - fingerprint_grow.cancel_enroll:

- platform: "template"
  name: "${i18n.doordisplay[language].delete}"
  icon: "mdi:key-minus"
  entity_category: "config"
  on_press:
    then:
    - fingerprint_grow.delete:
        finger_id: !lambda "return id(fp_finger_id).state;"

- platform: "template"
  name: "${i18n.doordisplay[language].delete_all}"
  icon: "mdi:alert"
  entity_category: "diagnostic"
  on_press:
    then:
    - fingerprint_grow.delete_all:
