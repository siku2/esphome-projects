uart:
  rx_pin: "GPIO35"
  tx_pin: "GPIO32"
  baud_rate: 57600

fingerprint_grow:
  sensing_pin:
    number: "GPIO21"
    allow_other_uses: true
  password: "${fingerprint_password}"
  on_finger_scan_matched:
  - script.execute: "fp_on_matched"

  on_finger_scan_unmatched:
  - script.execute:
      id: "fp_on_bad_scan"
      kind: 1

  on_finger_scan_misplaced:
  - script.execute:
      id: "fp_on_bad_scan"
      kind: 2

  on_finger_scan_invalid:
  - script.execute:
      id: "fp_on_bad_scan"
      kind: 3

  on_enrollment_scan:
  - script.execute: "fp_on_enroll_scan"

  on_enrollment_done:
  - script.execute: "fp_on_enroll_done"

  on_enrollment_failed:
  - script.execute: "fp_on_enroll_failed"

binary_sensor:
- platform: "fingerprint_grow"
  id: "fp_enrolling"
  name: "${i18n.doordisplay[language].enroll_active}"
  entity_category: "diagnostic"
  on_press:
    then:
    - script.execute: "fp_on_enroll_start"
  on_release:
    then:
    - script.execute: "fp_on_enroll_end"

- platform: "gpio"
  id: "fp_touch"
  pin:
    number: "GPIO21"
    allow_other_uses: true
  name: "${i18n.doordisplay[language].finger_touch}"
  entity_category: "diagnostic"
  filters:
  - invert
  on_press:
    then:
    - script.execute: "fp_on_touch_press"
  on_release:
    then:
    - script.execute: "fp_on_touch_release"

sensor:
- platform: "fingerprint_grow"
  fingerprint_count:
    name: "${i18n.doordisplay[language].finger_count}"
    entity_category: "diagnostic"
  last_finger_id:
    name: "${i18n.doordisplay[language].last_finger_id}"
    id: "fp_last_finger_id"
    entity_category: "diagnostic"
  last_confidence:
    name: "${i18n.doordisplay[language].last_confidence}"
    entity_category: "diagnostic"
  capacity:
    name: "${i18n.doordisplay[language].capacity}"
    entity_category: "diagnostic"

script:
- id: "fp_led"
  parameters:
    state: "string"
    color: "string"
    speed: "int"
    count: "int"
  then:
  - fingerprint_grow.aura_led_control:
      state: !lambda |-
        if (state == "FLASHING") return fingerprint_grow::FLASHING;
        if (state == "ALWAYS_ON") return fingerprint_grow::ALWAYS_ON;
        return fingerprint_grow::BREATHING;
      speed: !lambda "return speed;"
      color: !lambda |-
        if (color == "RED") return fingerprint_grow::RED;
        if (color == "PURPLE") return fingerprint_grow::PURPLE;
        if (color == "WHITE") return fingerprint_grow::WHITE;
        return fingerprint_grow::BLUE;
      count: !lambda "return count;"

button:
- platform: "template"
  name: "${i18n.doordisplay[language].enroll_button}"
  icon: "mdi:key-plus"
  entity_category: "config"
  on_press:
    then:
    - fingerprint_grow.enroll:
        finger_id: !lambda "return id(fp_finger_id).state;"
        num_scans: !lambda "return id(fp_num_scans).state;"

- platform: "template"
  name: "${i18n.doordisplay[language].cancel_enroll}"
  icon: "mdi:cancel"
  entity_category: "config"
  on_press:
    then:
    - fingerprint_grow.cancel_enroll:

- platform: "template"
  name: "${i18n.doordisplay[language].delete}"
  icon: "mdi:key-minus"
  entity_category: "config"
  on_press:
    then:
    - fingerprint_grow.delete:
        finger_id: !lambda "return id(fp_finger_id).state;"

- platform: "template"
  name: "${i18n.doordisplay[language].delete_all}"
  icon: "mdi:alert"
  entity_category: "diagnostic"
  on_press:
    then:
    - fingerprint_grow.delete_all:
