spi:
  clk_pin: "GPIO33"
  mosi_pin: "GPIO13"

font:
# Glyphs must cover every string shown at this size in all languages.
# The 48, 32 and 24 fonts also show address, names and errors, so they cover ASCII and umlauts.
- file: "gfonts://Anton"
  id: "font_anton_x48"
  size: 48
  glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~äöüÄÖÜß"

- file: "gfonts://Anton"
  id: "font_anton_x32"
  size: 32
  glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~äöüÄÖÜß"

- file: "gfonts://Anton"
  id: "font_anton_x24"
  size: 24
  glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~äöüÄÖÜß"

image:
- file: "mdi:airplane"
  type: "BINARY"
  id: "img_mdi_airplane"
  resize: "32x32"

- file: "mdi:bicycle"
  type: "BINARY"
  id: "img_mdi_bicycle"
  resize: "32x32"

- file: "mdi:door-closed"
  type: "BINARY"
  id: "img_mdi_door_closed"
  resize: "32x32"

- file: "mdi:door-closed-lock"
  type: "BINARY"
  id: "img_mdi_door_closed_lock"
  resize: "32x32"

- file: "mdi:alert-circle"
  type: "BINARY"
  id: "img_mdi_alert_circle"
  resize: "32x32"

- file: "mdi:fingerprint"
  type: "BINARY"
  id: "img_mdi_fingerprint"
  resize: "32x32"

- file: "mdi:lock-alert"
  type: "BINARY"
  id: "img_mdi_lock_alert"
  resize: "32x32"

display:
- platform: "waveshare_epaper"
  id: "display_main"
  model: "2.90inv2-r2"
  cs_pin: "GPIO14"
  dc_pin: "GPIO27"
  busy_pin: "GPIO25"
  reset_pin: "GPIO26"
  rotation: "90°"
  update_interval: "never"
  on_page_change:
  - then:
    - component.update: "display_main"
  pages:
  - id: "pg_main"
    lambda: !lambda |-
      auto w = it.get_width();
      auto h = it.get_height();
      it.print(w / 2, h / 2, id(font_anton_x48), TextAlign::CENTER, id(address_text).state.c_str());

      BaseImage *icon = nullptr;
      switch (id(target_entity_selection).active_index().value_or(0)) {
        // house door
        case 0: {
          const std::string &lock = id(sensor_door_lock).get_state();
          if (lock == "locked" || lock == "locking") {
            icon = id(img_mdi_door_closed_lock);
          } else if (lock == "unlocked" || lock == "unlocking" || lock == "open" || lock == "opening") {
            icon = id(img_mdi_door_closed);
          } else {
            icon = id(img_mdi_lock_alert);
          }
          break;
        }
        // bicycle
        case 1:
          icon = id(img_mdi_bicycle);
          break;
        // workshop gate
        case 2:
          icon = id(img_mdi_airplane);
          break;
      }
      if (!api::global_api_server->is_connected_with_state_subscription()) icon = id(img_mdi_lock_alert);
      if (icon != nullptr) it.image(w / 2, h, icon, ImageAlign::BOTTOM_CENTER);

  - id: "pg_enroll"
    lambda: !lambda |-
      // top row
      {
        auto icon = id(img_mdi_fingerprint);
        auto text = "${i18n.doordisplay[language].enroll}";
        auto font = id(font_anton_x32);

        int text_w, text_h, tmp;
        font->measure(text, &text_w, &tmp, &tmp, &text_h);
        auto row_w = text_w + icon->get_width();
        auto row_start_x = (it.get_width() - row_w) / 2;
        it.image(row_start_x, text_h / 2, icon, ImageAlign::CENTER_LEFT);
        it.print(row_start_x + icon->get_width(), 0, font, TextAlign::TOP_LEFT, text);
        it.line(0, text_h, it.get_width(), text_h);
      }
      // middle row
      {
        text::Text *names[] = {id(fp_name_1), id(fp_name_2), id(fp_name_3), id(fp_name_4)};
        auto index = id(fp_person).active_index().value_or(0);
        std::string person_name = names[index]->state.empty() ? id(fp_person).current_option() : names[index]->state;
        it.printf(it.get_width() / 2, it.get_height() / 2, id(font_anton_x24), TextAlign::CENTER,
          "%s %s %s",
          person_name.c_str(),
          id(fp_hand).current_option().c_str(),
          id(fp_finger).current_option().c_str()
        );
      }
      // bottom row
      {
        it.printf(it.get_width() / 2, it.get_height(), id(font_anton_x24), TextAlign::BOTTOM_CENTER,
          "%d/%d",
          (int) id(fp_num_scans_counter).state,
          (int) id(fp_num_scans).state
        );
      }

  - id: "pg_hello"
    lambda: !lambda |-
      auto font = id(font_anton_x48);
      int text_w, tmp;
      font->measure(id(hello_text).c_str(), &text_w, &tmp, &tmp, &tmp);
      if (text_w > it.get_width()) font = id(font_anton_x32);
      it.print(it.get_width() / 2, it.get_height() / 2, font, TextAlign::CENTER, id(hello_text).c_str());

  - id: "pg_error"
    lambda: !lambda |-
      auto icon = id(img_mdi_alert_circle);
      it.image(it.get_width() / 2, it.get_height() / 2 - 4, icon, ImageAlign::BOTTOM_CENTER);
      it.print(it.get_width() / 2, it.get_height() / 2 + 4, id(font_anton_x32), TextAlign::TOP_CENTER, id(error_text).c_str());

text:
- platform: "template"
  id: "address_text"
  name: "${i18n.doordisplay[language].address}"
  icon: "mdi:home"
  entity_category: "config"
  mode: "text"
  max_length: 24
  initial_value: ""
  optimistic: true
  restore_value: true
  on_value:
    then:
    - component.update: "display_main"
