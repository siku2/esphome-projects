script:
# reset the target entity back to the door
- id: "reset_target_selection"
  mode: "restart"
  then:
  - delay: "5min"
  - select.set_index:
      id: "target_entity_selection"
      index: 0

- id: "perform_target_action"
  mode: "queued"
  then:
  - if:
      condition:
        lambda: !lambda "return id(target_entity_selection).active_index().value_or(0) == 0;"
      then:
      - homeassistant.action:
          action: "script.gang_eg_schloss_hausture_toggle"
  - if:
      condition:
        lambda: !lambda "return id(target_entity_selection).active_index().value_or(0) == 1;"
      then:
      - homeassistant.action:
          action: "cover.toggle"
          data:
            entity_id: "cover.aussen_veloraum"
  - if:
      condition:
        lambda: !lambda "return id(target_entity_selection).active_index().value_or(0) == 2;"
      then:
      - homeassistant.action:
          action: "script.bastelraum_tor_toggle"

text_sensor:
- platform: "homeassistant"
  id: "sensor_door_lock"
  entity_id: "${door_lock_entity_id}"
  on_value:
    then:
    - component.update: "display_main"

select:
- platform: "template"
  id: "target_entity_selection"
  name: "${i18n.doordisplay[language].target}"
  icon: "mdi:target"
  update_interval: "never"
  optimistic: true
  restore_value: true
  options:
  - "${i18n.doordisplay[language].target_door}"
  - "${i18n.doordisplay[language].target_bicycle}"
  - "${i18n.doordisplay[language].target_gate}"
  on_value:
    then:
    - component.update: "display_main"
    - script.execute: "reset_target_selection"

- platform: "template"
  id: "greeting_selection"
  internal: true
  update_interval: "never"
  optimistic: true
  restore_value: true
  options:
  - "${i18n.doordisplay[language].greeting_1}"
  - "${i18n.doordisplay[language].greeting_2}"
  - "${i18n.doordisplay[language].greeting_3}"
  - "${i18n.doordisplay[language].greeting_4}"

- platform: "template"
  id: "farewell_selection"
  internal: true
  update_interval: "never"
  optimistic: true
  restore_value: true
  options:
  - "${i18n.doordisplay[language].farewell_1}"
  - "${i18n.doordisplay[language].farewell_2}"
