script:
# reset the target entity back to the door
- id: "reset_target_selection"
  mode: "restart"
  then:
  - delay: "5min"
  - select.set_index:
      id: "target_entity_selection"
      index: 0

- id: "overlay_return"
  mode: "restart"
  parameters:
    timeout: "int"
  then:
  - delay: !lambda "return timeout;"
  - display.page.show: "pg_main"

- id: "target_action_timeout"
  mode: "restart"
  then:
  - delay: "30s"
  - script.execute:
      id: "fail_target_action"
      reason: "${i18n.doordisplay[language].error_timeout}"

- id: "fail_target_action"
  mode: "restart"
  parameters:
    reason: "string"
  then:
  - script.execute:
      id: "fp_led"
      state: "FLASHING"
      speed: 25
      color: "RED"
      count: 3
  - event.trigger:
      id: "fp_scan_event"
      event_type: "action_failed"
  - lambda: !lambda "id(error_text) = reason;"
  - if:
      condition:
        display.is_displaying_page: "pg_error"
      then:
      - component.update: "display_main"
      else:
      - display.page.show: "pg_error"
  - script.execute:
      id: "overlay_return"
      timeout: 5000

- id: "perform_target_action"
  mode: "queued"
  then:
  - if:
      condition:
        not:
          api.connected:
            state_subscription_only: true
      then:
      - script.execute:
          id: "fail_target_action"
          reason: "${i18n.doordisplay[language].error_no_connection}"
      else:
      - script.execute: "target_action_timeout"
      - script.execute: "ha_send_target_action"

globals:
- id: "hello_text"
  type: "std::string"
- id: "error_text"
  type: "std::string"

select:
- platform: "template"
  id: "target_entity_selection"
  name: "${i18n.doordisplay[language].target}"
  icon: "mdi:target"
  update_interval: "never"
  optimistic: true
  restore_value: true
  options:
  - "${i18n.doordisplay[language].target_door}"
  - "${i18n.doordisplay[language].target_bicycle}"
  - "${i18n.doordisplay[language].target_gate}"
  on_value:
    then:
    - component.update: "display_main"
    - script.execute: "reset_target_selection"

- platform: "template"
  id: "greeting_selection"
  internal: true
  update_interval: "never"
  optimistic: true
  restore_value: true
  options:
  - "${i18n.doordisplay[language].greeting_1}"
  - "${i18n.doordisplay[language].greeting_2}"
  - "${i18n.doordisplay[language].greeting_3}"
  - "${i18n.doordisplay[language].greeting_4}"

- platform: "template"
  id: "farewell_selection"
  internal: true
  update_interval: "never"
  optimistic: true
  restore_value: true
  options:
  - "${i18n.doordisplay[language].farewell_1}"
  - "${i18n.doordisplay[language].farewell_2}"
