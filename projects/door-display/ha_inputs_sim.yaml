text_sensor:
- platform: "template"
  id: "sensor_door_lock"
  on_value:
    then:
    - component.update: "display_main"

select:
- platform: "template"
  id: "sim_door_lock"
  name: "Sim Door Lock"
  optimistic: true
  restore_value: false
  initial_option: "locked"
  options:
  - "locked"
  - "unlocked"
  - "locking"
  - "unlocking"
  - "open"
  - "jammed"
  - "unavailable"
  on_value:
  - text_sensor.template.publish:
      id: "sensor_door_lock"
      state: !lambda "return x;"

esphome:
  on_boot:
    priority: -100
    then:
    - text_sensor.template.publish:
        id: "sensor_door_lock"
        state: !lambda "return id(sim_door_lock).current_option();"
