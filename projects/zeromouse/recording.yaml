external_components:
- source: "${components_source}"
  components: ["s3", "task_util", "zeromouse_recorder"]

s3:
  id: "zm_s3"

zeromouse_recorder:
  s3_id: "zm_s3"
  controller_id: "zm_controller"
  camera_id: "zm_camera"
  enabled: "zm_record_events"
  board: "${board}"
  on_recorded:
  - homeassistant.event:
      event: "esphome.zeromouse_event"
      data:
        path: !lambda "return path;"
        event_id: !lambda "return to_string(event_id);"
        class_name: !lambda "return class_name;"

switch:
- id: "zm_record_events"
  name: "${i18n.zeromouse[language].record_events}"
  platform: "template"
  entity_category: "CONFIG"
  optimistic: true
  restore_mode: "RESTORE_DEFAULT_ON"

text:
- id: "zm_s3_endpoint"
  name: "${i18n.zeromouse[language].s3_endpoint}"
  platform: "template"
  entity_category: "CONFIG"
  mode: "TEXT"
  optimistic: true
  restore_value: true
  max_length: 255
  initial_value: ""
  on_value:
  - lambda: !lambda |-
      id(zm_s3).set_location(id(zm_s3_endpoint).state, id(zm_s3_bucket).state);
- id: "zm_s3_bucket"
  name: "${i18n.zeromouse[language].s3_bucket}"
  platform: "template"
  entity_category: "CONFIG"
  mode: "TEXT"
  optimistic: true
  restore_value: true
  max_length: 255
  initial_value: ""
  on_value:
  - lambda: !lambda |-
      id(zm_s3).set_location(id(zm_s3_endpoint).state, id(zm_s3_bucket).state);
