external_components:
- source: "${components_source}"
  components: ["s3", "task_util", "zeromouse_recorder"]

s3:
  id: "zm_s3"
  endpoint: "${s3_endpoint}"
  bucket: "${s3_bucket}"
  access_key_id: "${s3_access_key_id}"
  secret_access_key: "${s3_secret_access_key}"

zeromouse_recorder:
  s3_id: "zm_s3"
  controller_id: "zm_controller"
  camera_id: "zm_camera"
  enabled: "zm_record_events"
  board: "${board}"
  on_recorded:
  - homeassistant.event:
      event: "esphome.zeromouse_event"
      data:
        path: !lambda "return path;"
        event_id: !lambda "return to_string(event_id);"
        class_name: !lambda "return class_name;"

switch:
- id: "zm_record_events"
  name: "${i18n.zeromouse[language].record_events}"
  platform: "template"
  entity_category: "CONFIG"
  optimistic: true
  restore_mode: "RESTORE_DEFAULT_ON"
