external_components:
- source: "${components_source}"
  components: ["zeromouse"]

time:
- id: "zm_sntp"
  platform: "sntp"

zeromouse:
  id: "zm_controller"
  time_id: "zm_sntp"
  camera: "zm_camera"
  blocker: "zm_rfid_blocker"
  settings:
    upload_empty: "zm_upload_empty"
    block_enabled: "zm_block_enabled"
    undecidable_mode: "zm_undecidable_mode"
    clean_event_time: "zm_clean_event_time"
    finale_interval_max_count: "zm_finale_interval_max_count"
    finale_interval_delta: "zm_finale_interval_delta"
    last_ref_event_max_count: "zm_last_ref_event_max_count"
    last_ref_event_max_time_sec: "zm_last_ref_event_max_time_sec"
  state:
    name: "${i18n.zeromouse[language].event_state}"
  ir_free_value:
    name: "${i18n.zeromouse[language].ir_free_value}"
  ir_free_value_raw:
    name: "${i18n.zeromouse[language].ir_free_value_raw}"
  on_event_start:
  - output.turn_on:
      id: "zm_led2_output"
  - delay: 30ms
  - output.turn_off:
      id: "zm_led2_output"
  on_ready:
  - output.turn_on:
      id: "zm_led2_output"
  - delay: 30ms
  - output.turn_off:
      id: "zm_led2_output"
  - delay: 150ms
  - output.turn_on:
      id: "zm_led2_output"
  - delay: 30ms
  - output.turn_off:
      id: "zm_led2_output"
  on_time_zero:
  - logger.log:
      format: "Time zero, PIR %d ms from T0"
      args:
      - !lambda "pir_to_t0_ms"
  on_scan_end:
  - logger.log:
      format: "Scan result: %s"
      args:
      - !lambda "result.c_str()"
  on_event_end:
  - logger.log:
      format: "Event end: %s"
      args:
      - !lambda "reason.c_str()"
