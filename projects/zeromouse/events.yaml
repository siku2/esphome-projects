external_components:
- source: "${components_source}"
  components: ["zeromouse"]

zeromouse:
  id: "zm_controller"
  time_id: "zm_sntp"
  settings:
    upload_empty: "zm_upload_empty"
  ir_free_value:
    name: "${i18n.zeromouse[language].ir_free_value}"
  ir_free_value_raw:
    name: "${i18n.zeromouse[language].ir_free_value_raw}"
  on_event_start:
  - output.turn_on:
      id: "zm_led2_output"
  - delay: 30ms
  - output.turn_off:
      id: "zm_led2_output"
  on_ready:
  - output.turn_on:
      id: "zm_led2_output"
  - delay: 30ms
  - output.turn_off:
      id: "zm_led2_output"
  - delay: 150ms
  - output.turn_on:
      id: "zm_led2_output"
  - delay: 30ms
  - output.turn_off:
      id: "zm_led2_output"
  on_time_zero:
  - logger.log:
      format: "Time zero, PIR %d ms from T0"
      args:
      - !lambda "pir_to_t0_ms"
  on_scan_end:
  - logger.log:
      format: "Scan result: %s"
      args:
      - !lambda "result.c_str()"
