substitutions:
  api_encryption_key: "" # REQUIRED!
  aws_thing_name: "" # REQUIRED!
  aws_certificate: "" # REQUIRED!
  aws_private_key: "" # REQUIRED!
  zeromouse_owner_id: "" # REQUIRED!
  zeromouse_identity_id: "" # REQUIRED!
  zeromouse_event_count: 0
  zeromouse_boot_count: 0
  s3_endpoint: "" # REQUIRED!
  s3_bucket: "" # REQUIRED!
  s3_access_key_id: "" # REQUIRED!
  s3_secret_access_key: "" # REQUIRED!

  name: "zeromouse"
  friendly_name: "ZeroMOUSE"
  language: "en"
  board: "v1"
  i18n:
    zeromouse:
      de: !include translations/de.yaml
      en: !include translations/en.yaml

packages:
  base: !include ../../base/device.yaml
  board: !include ../../boards/zeromouse/${board}.yaml
  settings: !include settings/common.yaml
  settings_board: !include settings/${board}.yaml
  cloud: !include cloud.yaml
  events: !include events.yaml
  recording: !include recording.yaml

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  project:
    name: "siku2.zeromouse"
    version: "0.1.0"

ota:
- id: !extend "base_ota"
  on_begin:
  - lambda: !lambda |-
      id(zm_controller).abort_event("ota");
  on_error:
  - lambda: !lambda |-
      id(zm_controller).resume();
