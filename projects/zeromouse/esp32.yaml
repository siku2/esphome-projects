substitutions:
  api_encryption_key: "" # REQUIRED!
  aws_thing_name: "" # REQUIRED!
  aws_certificate: "" # REQUIRED!
  aws_private_key: "" # REQUIRED!
  zeromouse_owner_id: "" # REQUIRED!
  zeromouse_identity_id: "" # REQUIRED!
  zeromouse_event_count: 0

  name: "zeromouse"
  friendly_name: "ZeroMOUSE"
  language: "en"
  board: "v1"
  i18n:
    zeromouse:
      de: !include translations/de.yaml
      en: !include translations/en.yaml

packages:
  base: !include ../../packages/base/device.yaml
  board: !include ../../packages/zeromouse/${board}.yaml
  cloud: !include cloud.yaml

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  project:
    name: "siku2.zeromouse"
    version: "0.1.0"

dashboard_import:
  package_import_url: "github://siku2/esphome-projects/projects/zeromouse/esp32.yaml@main"
  import_full_config: false

api:
  encryption:
    key: "${api_encryption_key}"

ota:
- platform: "esphome"
  encryption: {}
