external_components:
- source: "${components_source}"
  components: ["aws_iot", "zeromouse_cloud"]

aws_iot:
  id: "zm_aws_iot"
  endpoint: "a1lrk6d93bvma9-ats.iot.eu-central-1.amazonaws.com"
  client_id: "${aws_thing_name}"
  certificate: "${aws_certificate}"
  private_key: "${aws_private_key}"
  username: "?SDK=FreeRTOS&Version=V10.5.1&Platform=ESP32-S3&MQTTLib=core-mqtt@v2.3.1"
  time_id: "zm_sntp"
  on_connect:
  - binary_sensor.template.publish:
      id: "zm_cloud_connected"
      state: true
  on_disconnect:
  - binary_sensor.template.publish:
      id: "zm_cloud_connected"
      state: false

packages:
  board: !include cloud/${board}.yaml

zeromouse:
  cloud: "zm_cloud"

zeromouse_cloud:
  id: "zm_cloud"
  aws_iot_id: "zm_aws_iot"
  thing_name: "${aws_thing_name}"
  owner_id: "${zeromouse_owner_id}"
  identity_id: "${zeromouse_identity_id}"
  event_count: "${zeromouse_event_count}"
  time_id: "zm_sntp"
  accept_settings: "zm_accept_cloud_settings"
  upload_events: "zm_upload_events"
  settings:
    clean_event_time: "zm_clean_event_time"
    undecidable_mode: "zm_undecidable_mode"
    finale_interval_max_count: "zm_finale_interval_max_count"
    finale_interval_delta: "zm_finale_interval_delta"
    upload_empty: "zm_upload_empty"
    log_enabled: "zm_log_enabled"
    auto_exp_level: "zm_auto_exp_level"
    gain_ceiling: "zm_gain_ceiling"
    block_enabled: "zm_block_enabled"
    response_timeout: "zm_response_timeout"
    last_ref_event_max_count: "zm_last_ref_event_max_count"
    last_ref_event_max_time_sec: "zm_last_ref_event_max_time_sec"
  on_classification:
  - text_sensor.template.publish:
      id: "zm_last_classification"
      state: !lambda |-
        return class_name;
  - binary_sensor.template.publish:
      id: "zm_block"
      state: !lambda |-
        return block;
  on_setting_change:
  - homeassistant.event:
      event: "esphome.zeromouse_cloud_setting"
      data:
        key: !lambda "return key;"
        previous: !lambda "return previous;"
        value: !lambda "return value;"
        applied: !lambda "return applied ? \"true\" : \"false\";"

button:
- id: "zm_send_test_event"
  platform: "template"
  name: "${i18n.zeromouse[language].send_test_event}"
  on_press:
  - zeromouse_cloud.publish_test_event:
      id: "zm_cloud"
      camera_id: "zm_camera"

text_sensor:
- id: "zm_last_classification"
  platform: "template"
  name: "${i18n.zeromouse[language].last_classification}"

binary_sensor:
- id: "zm_block"
  platform: "template"
  name: "${i18n.zeromouse[language].block}"

- id: "zm_cloud_connected"
  platform: "template"
  name: "${i18n.zeromouse[language].cloud_connected}"
  device_class: "connectivity"
  entity_category: "DIAGNOSTIC"

switch:
- id: "zm_cloud_enabled"
  name: "${i18n.zeromouse[language].cloud_enabled}"
  platform: "template"
  entity_category: "CONFIG"
  optimistic: true
  restore_mode: "RESTORE_DEFAULT_ON"
  on_turn_on:
  - aws_iot.enable:
      id: "zm_aws_iot"
  on_turn_off:
  - aws_iot.disable:
      id: "zm_aws_iot"

- id: "zm_upload_events"
  name: "${i18n.zeromouse[language].upload_events}"
  platform: "template"
  entity_category: "CONFIG"
  optimistic: true
  restore_mode: "RESTORE_DEFAULT_ON"

- id: "zm_accept_cloud_settings"
  name: "${i18n.zeromouse[language].accept_cloud_settings}"
  platform: "template"
  entity_category: "CONFIG"
  optimistic: true
  restore_mode: "RESTORE_DEFAULT_ON"
