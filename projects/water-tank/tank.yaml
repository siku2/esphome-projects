substitutions:
  language: "en"
  i18n:
    watertank:
      de: !include translations/de.yaml
      en: !include translations/en.yaml

packages:
  voltage: !include voltage.yaml

sensor:
- id: "${tank_id}_fill_fraction"
  internal: true
  filters:
  - lambda: !lambda |-
      if (std::isnan(x)) return {};
      if (id(${tank_id}_full).state) return 1.0f;
      if (id(${tank_id}_empty).state) return 0.0f;
      float min = id(${tank_id}_voltage_empty).state;
      float max = id(${tank_id}_voltage_full).state;
      return (x - min) / (max - min);
  - clamp:
      min_value: 0.0
      max_value: 1.0
  platform: "copy"
  source_id: "${tank_id}_raw_voltage"

- id: "${tank_id}_fill_percentage"
  name: "${i18n.watertank[language].fill_level}"
  device_id: "${device_id}"
  internal: ${fill_level_internal}
  unit_of_measurement: "%"
  device_class: ""
  state_class: "measurement"
  entity_category: ""
  icon: "mdi:percent"
  accuracy_decimals: 0
  filters:
  - multiply: 100.0
  - round: 0
  - delta: 0.5
  - timeout:
      timeout: "60s"
      value: "last"
  platform: "copy"
  source_id: "${tank_id}_fill_fraction"

- id: "${tank_id}_fill_volume"
  name: "${i18n.watertank[language].volume}"
  device_id: "${device_id}"
  unit_of_measurement: "L"
  device_class: "volume"
  state_class: "measurement"
  entity_category: ""
  icon: "mdi:water-well"
  accuracy_decimals: 0
  filters:
  - multiply: !lambda "return id(${tank_id}_volume_full).state;"
  - round: 0
  - delta: 0.5
  - timeout:
      timeout: "60s"
      value: "last"
  platform: "copy"
  source_id: "${tank_id}_fill_fraction"

binary_sensor:
- id: "${tank_id}_full"
  internal: true
  on_state:
    then:
    - lambda: !lambda |-
        id(${tank_id}_fill_fraction)->publish_state(id(${tank_id}_raw_voltage).state);
  platform: "template"

- id: "${tank_id}_empty"
  internal: true
  on_state:
    then:
    - lambda: !lambda |-
        id(${tank_id}_fill_fraction)->publish_state(id(${tank_id}_raw_voltage).state);
  platform: "template"

number:
- id: "${tank_id}_voltage_empty"
  name: "${i18n.watertank[language].voltage_empty}"
  device_id: "${device_id}"
  entity_category: "CONFIG"
  unit_of_measurement: "V"
  device_class: "voltage"
  on_value:
    then:
    - lambda: !lambda |-
        id(${tank_id}_fill_fraction)->publish_state(id(${tank_id}_raw_voltage).state);
  platform: "template"
  min_value: 0.0
  max_value: "${voltage_max}"
  update_interval: "never"
  optimistic: true
  step: 0.001
  restore_value: true
  initial_value: "${initial_voltage_empty}"

- id: "${tank_id}_voltage_full"
  name: "${i18n.watertank[language].voltage_full}"
  device_id: "${device_id}"
  entity_category: "CONFIG"
  unit_of_measurement: "V"
  device_class: "voltage"
  on_value:
    then:
    - lambda: !lambda |-
        id(${tank_id}_fill_fraction)->publish_state(id(${tank_id}_raw_voltage).state);
  platform: "template"
  min_value: 0.0
  max_value: "${voltage_max}"
  update_interval: "never"
  optimistic: true
  step: 0.001
  restore_value: true
  initial_value: "${initial_voltage_full}"

- id: "${tank_id}_volume_full"
  name: "${i18n.watertank[language].volume_full}"
  device_id: "${device_id}"
  entity_category: "CONFIG"
  unit_of_measurement: "L"
  device_class: "volume"
  on_value:
    then:
    - lambda: !lambda |-
        id(${tank_id}_fill_fraction)->publish_state(id(${tank_id}_raw_voltage).state);
  platform: "template"
  min_value: 0
  max_value: 10000
  update_interval: "never"
  optimistic: true
  step: 1
  restore_value: true
  initial_value: "${initial_volume_full}"
