sensor:
# Pressure sensor, see: <https://www.dfrobot.com/product-1863.html>
- id: "${tank_id}_raw_voltage"
  name: "${i18n.watertank[language].voltage}"
  device_id: "${device_id}"
  accuracy_decimals: 3
  entity_category: "DIAGNOSTIC"
  filters:
  - throttle_average: "${average_interval}"
  - sliding_window_moving_average:
      window_size: "${window_size}"
      send_every: 1
      send_first_at: 1
  - delta: 0.0005
  - round: 3
  - timeout:
      timeout: "60s"
      value: "last"
  platform: "adc"
  pin: "${adc_pin}"
  attenuation: "${attenuation}"
  samples: "${samples}"
  update_interval: "${sample_interval}"
