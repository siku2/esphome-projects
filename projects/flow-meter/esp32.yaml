substitutions:
  name: "flow-meter"
  friendly_name: "Flow Meter"
  language: "en"
  i18n:
    flowmeter:
      de: !include translations/de.yaml
      en: !include translations/en.yaml

packages:
  base: !include ../../base/device.yaml
  flow_sensor: !include
    file: ../../base/yf_flow_sensor.yaml
    vars:
      prefix: "flow"
      pin: "GPIO27"
      k: "18"
      rate_name: "${i18n.flowmeter[language].flow_rate}"
      total_name: "${i18n.flowmeter[language].total}"
      device_id: ""

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  project:
    name: "siku2.flow-meter"

esp32:
  board: "esp32dev"
  framework:
    type: "esp-idf"
