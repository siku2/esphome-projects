substitutions:
  api_encryption_key: "" # REQUIRED!
  ota_password: "" # REQUIRED!

  name: "flow-meter"
  friendly_name: "Flow Meter"
  language: "en"
  i18n:
    flowmeter:
      de: !include translations/de.yaml
      en: !include translations/en.yaml

packages:
  base: !include ../../packages/base.yaml

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  project:
    name: "siku2.flow-meter"
    version: "0.1.0"

dashboard_import:
  package_import_url: "github://siku2/esphome-projects/projects/flow-meter/esp32.yaml@main"
  import_full_config: false

esp32:
  board: "esp32dev"
  framework:
    type: "esp-idf"

api:
  encryption:
    key: "${api_encryption_key}"

ota:
- platform: "esphome"
  password: "${ota_password}"

sensor:
- platform: "pulse_meter"
  id: "flow_rate"
  name: "${i18n.flowmeter[language].flow_rate}"
  pin:
    number: "GPIO27"
    mode:
      input: true
      pullup: true
  unit_of_measurement: "L/min"
  device_class: "volume_flow_rate"
  state_class: "measurement"
  accuracy_decimals: 2
  internal_filter: "100us"
  timeout: "2s"
  filters:
  # Datasheet: F[Hz] = 18 * Q[L/min] - 3. Input is pulses per minute.
  - lambda: !lambda |-
      return x > 0 ? (x / 60.0f + 3.0f) / 18.0f : 0.0f;
  - throttle_with_priority:
      timeout: "5s"
      value: 0.0
  total:
    id: "flow_total"
    name: "${i18n.flowmeter[language].total}"
    unit_of_measurement: "L"
    device_class: "water"
    state_class: "total_increasing"
    accuracy_decimals: 1
    filters:
    # Each pulse is (1 + 3 * T) / 1080 L, with T the pulse period in seconds.
    - lambda: !lambda |-
        static double liters = 0;
        static float last_count = 0;
        static uint32_t last_ms = 0;
        uint32_t now = millis();
        uint32_t dt = now - last_ms;
        if (dt > 2000 || x == last_count) dt = 0;
        liters += ((x - last_count) + 3.0 * dt / 1000.0) / 1080.0;
        last_count = x;
        last_ms = now;
        return liters;
    - or:
      - throttle: "10s"
      - debounce: "1s"
