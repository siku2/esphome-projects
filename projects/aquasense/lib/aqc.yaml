# Namespace: aqc (core)

substitutions:
  components_source:
    type: "local"
    path: "../components"

  name: "aquasense"
  friendly_name: "Aquasense"
  language: "en"
  i18n:
    aquasense:
      de: !include ../i18n/de.yaml
      en: !include ../i18n/en.yaml

packages:
  base: !include ../../../base/device.yaml
  e32s3cam: !include ../../../boards/generic/esp32_s3_cam.yaml
  #
  aqss: !include ./aqss.yaml

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  project:
    name: "siku2.aquasense"

external_components:
- source: "${components_source}"
  components: ["meter_reader", "still_camera", "task_util", "tflite"]
