# Namespace: aqc (core)

substitutions:
  api_encryption_key: "" # REQUIRED!
  git_ref: "" # REQUIRED!
  components_source:
    type: "git"
    url: "https://github.com/siku2/esphome-projects"
    ref: "${git_ref}"
    path: "components"

  name: "aquasense"
  friendly_name: "Aquasense"
  language: "en"
  i18n:
    aquasense:
      de: !include ../i18n/de.yaml
      en: !include ../i18n/en.yaml

packages:
  base: !include ../../../packages/base/device.yaml
  e32s3cam: !include ../../../packages/keyestudio/esp32_s3_cam.yaml
  #
  aqss: !include ./aqss.yaml

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  project:
    name: "siku2.aquasense"
    version: "0.1.0"

external_components:
- source: "${components_source}"
  components: ["camera_snapshot", "meter_reader", "tflite"]

api:
  encryption:
    key: "${api_encryption_key}"

ota:
- id: "aqc_ota"
  platform: "esphome"
  encryption: {}
