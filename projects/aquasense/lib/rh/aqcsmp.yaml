# Namespace: aqcsmp

globals:
  - id: "aqcsmp_prev_tick_ms"
    type: "uint32_t"
    restore_value: true
    initial_value: "0"

  - id: "aqcsmp_sum_ml"
    type: "uint32_t"
    restore_value: true
    initial_value: "0"

  - id: "aqcsmp_m3_prev"
    type: "uint32_t"
    restore_value: true
    initial_value: "0"

  - id: "aqcsmp_pending_10l_ml"
    type: "uint16_t"
    restore_value: false
    initial_value: "65535"

  - id: "aqcsmp_m3_last_raw"
    type: "uint32_t"
    restore_value: false
    initial_value: "0"

  - id: "aqcsmp_m3_stable"
    type: "bool"
    restore_value: false
    initial_value: "false"

sensor:
  - id: "aqcsmp_10_liters"
    name: "${i18n.aquasense[language].aqcsmp_10_liters}"
    unit_of_measurement: "L"
    device_class: "water"
    state_class: "measurement"
    icon: "mdi:gauge"
    accuracy_decimals: 3
    entity_category: "diagnostic"
    on_value:
      - lambda: !lambda |
          if (isnan(x)) return;

          uint32_t &prev_tick_ms = id(aqcsmp_prev_tick_ms);
          uint32_t &sum_ml = id(aqcsmp_sum_ml);
          uint16_t &pending_ml = id(aqcsmp_pending_10l_ml);

          uint16_t new_10l_ml = (uint16_t)(1000.0f * x);
          uint16_t sum_10l_ml = sum_ml % 10000;
          int16_t diff_10l_ml = new_10l_ml - sum_10l_ml;
          // Adjust for rollover.
          if (diff_10l_ml <= -5000) diff_10l_ml += 10000;

          // Diffs below 200 ml are noise.
          if (diff_10l_ml < 200) {
            pending_ml = 65535;
            return;
          }
          if (pending_ml != 65535 &&
              (int32_t)new_10l_ml >= (int32_t)pending_ml - 100) {
            pending_ml = 65535;
          } else {
            pending_ml = new_10l_ml;
            return;
          }

          sum_ml += diff_10l_ml;
          id(aqcsmp_total)->update();
          float per_second = (float)diff_10l_ml / (float)(millis() - prev_tick_ms);
          id(aqcsmp_consumption)->publish_state(per_second);
          prev_tick_ms = millis();

    platform: "template"
    update_interval: "never"
    lambda: !lambda |
      auto correct = [](float digit_state, int lower_int) -> int {
        if (isnan(digit_state) || digit_state < 0.0f || digit_state >= 10.0f) return -1;
        int v = (int)roundf(digit_state - lower_int / 10.0f);
        return ((v % 10) + 10) % 10;
      };
      float dl = truncf(id(aqdig_00001).state);
      if (correct(dl, 0) < 0) return NAN;
      int whole_liters = correct(id(aqdig_0001).state, (int)dl);
      if (whole_liters < 0) return NAN;
      return (float)whole_liters + 0.1f * dl;

  - id: "aqcsmp_m3"
    name: "${i18n.aquasense[language].aqcsmp_m3}"
    unit_of_measurement: "m³"
    device_class: "water"
    state_class: "measurement"
    icon: "mdi:numeric-10-box-outline"
    accuracy_decimals: 0
    entity_category: "diagnostic"
    on_value:
      - lambda: !lambda |
          if (isnan(x)) return;
          uint32_t &sum_ml = id(aqcsmp_sum_ml);
          uint32_t &prev = id(aqcsmp_m3_prev);
          uint32_t &last_raw = id(aqcsmp_m3_last_raw);
          bool &stable = id(aqcsmp_m3_stable);

          uint32_t new_value = (uint32_t)x;
          if (!stable) {
            if (last_raw != new_value) {
              last_raw = new_value;
              return;
            }
            stable = true;
          }

          if (prev == 0) {
            prev = new_value;
            return;
          }
          int32_t diff = (int32_t)new_value - (int32_t)prev;
          prev = new_value;
          if (diff < 0) {
            ESP_LOGW("aqcsmp", "m3 reading did not increase, diff %d", diff);
            return;
          }
          if (diff == 0) return;
          if (diff > 1) {
            ESP_LOGW("aqcsmp", "m3 jumped by %d", diff);
          }

          // We passed a 1000L boundary, reset the ml counter.
          sum_ml = sum_ml % 10000;
          id(aqcsmp_total)->update();

    platform: "template"
    update_interval: "never"
    lambda: !lambda |
      auto digit = [](float state) -> int {
        if (isnan(state) || state < 0.0f || state >= 10.0f) return -1;
        int v = (int)roundf(state);
        return ((v % 10) + 10) % 10;
      };
      int d10000 = digit(id(aqdig_10000).state);
      int d1000 = digit(id(aqdig_1000).state);
      int d100 = digit(id(aqdig_100).state);
      int d10 = digit(id(aqdig_10).state);
      int d1 = digit(id(aqdig_1).state);
      if (d10000 < 0 || d1000 < 0 || d100 < 0 || d10 < 0 || d1 < 0) return NAN;
      float val = 0.0f;
      val += 10000.0f * d10000;
      val +=  1000.0f * d1000;
      val +=   100.0f * d100;
      val +=    10.0f * d10;
      val +=     1.0f * d1;
      return val;

  - id: "aqcsmp_total"
    name: "${i18n.aquasense[language].aqcsmp_total}"
    unit_of_measurement: "L"
    device_class: "water"
    state_class: "total_increasing"
    accuracy_decimals: 2
    platform: "template"
    update_interval: "never"
    lambda: !lambda |
      return 1000.0f * id(aqcsmp_m3).state + 0.001f * id(aqcsmp_sum_ml);

  - id: "aqcsmp_consumption"
    name: "${i18n.aquasense[language].aqcsmp_consumption}"
    unit_of_measurement: "L/s"
    device_class: "volume_flow_rate"
    state_class: "measurement"
    accuracy_decimals: 2
    platform: "template"
    update_interval: "never"

  - &aqcsmp_confidence_snapshot
    id: "aqcsmp_confidence_snapshot"
    name: "${i18n.aquasense[language].aqcsmp_confidence_snapshot}"
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    accuracy_decimals: 0
    platform: "template"
    update_interval: "never"
    lambda: !lambda |
      float min_fit = NAN;
      auto check = [&](float fit) {
        if (isnan(fit)) return;
        if (isnan(min_fit) || fit < min_fit) min_fit = fit;
      };
      check(id(aqdig_10000).get_last_fit());
      check(id(aqdig_1000).get_last_fit());
      check(id(aqdig_100).get_last_fit());
      check(id(aqdig_10).get_last_fit());
      check(id(aqdig_1).get_last_fit());
      check(id(aqdig_01).get_last_fit());
      check(id(aqdig_0001).get_last_fit());
      check(id(aqdig_00001).get_last_fit());
      return min_fit * 100.0f;

  - <<: *aqcsmp_confidence_snapshot
    id: "aqcsmp_confidence_reading"
    name: "${i18n.aquasense[language].aqcsmp_confidence_reading}"
    lambda: !lambda |
      float min_fit = NAN;
      auto check = [&](float fit) {
        if (isnan(fit)) return;
        if (isnan(min_fit) || fit < min_fit) min_fit = fit;
      };
      check(id(aqdig_10000).get_published_fit());
      check(id(aqdig_1000).get_published_fit());
      check(id(aqdig_100).get_published_fit());
      check(id(aqdig_10).get_published_fit());
      check(id(aqdig_1).get_published_fit());
      check(id(aqdig_01).get_published_fit());
      check(id(aqdig_0001).get_published_fit());
      check(id(aqdig_00001).get_published_fit());
      return min_fit * 100.0f;
