substitutions:
  api_encryption_key: "" # REQUIRED!
  ota_password: "" # REQUIRED!
  git_ref: "" # REQUIRED!

  name: "aquasense"
  friendly_name: "Aquasense"
  language: "en"
  i18n:
    aquasense:
      de: !include i18n/de.yaml
      en: !include i18n/en.yaml

packages:
  base: !include
    file: ../../packages/base.yaml
  e32s3cam: !include
    file: ../../packages/esp32_s3_cam.yaml

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  project:
    name: "siku2.aquasense"
    version: "0.1.0"

dashboard_import:
  package_import_url: "github://siku2/esphome-projects/projects/aquasense/core.yaml@main"
  import_full_config: false

external_components:
  - source:
      type: git
      url: "https://github.com/siku2/esphome-projects"
      ref: "${git_ref}"
      path: "components"
    components: ["camera_snapshot", "tflite"]

api:
  encryption:
    key: "${api_encryption_key}"

ota:
  - platform: "esphome"
    password: "${ota_password}"

camera_snapshot:
  update_interval: "10s"
  before_snapshot:
    - light.turn_on: "e32s3cam_flash"
    - delay: "100ms"
  after_snapshot:
    - light.turn_off: "e32s3cam_flash"

tflite:
  op_resolver:
    builtin:
      - "add"
      - "conv_2d"
      - "dequantize"
      - "fully_connected"
      - "leaky_relu"
      - "max_pool_2d"
      - "mul"
      - "quantize"
      - "reshape"
      - "softmax"
  allocator:
    size: "150 kB"
  model:
    - id: "digits_model"
      file: "https://github.com/jomjol/AI-on-the-edge-device/raw/refs/heads/main/sd-card/config/dig-cont_0900_s3_q.tflite"
    - id: "analog_model"
      file: "https://github.com/jomjol/AI-on-the-edge-device/raw/refs/heads/main/sd-card/config/ana-cont_1500_s2_q.tflite"
  interpreter:
    - id: "digits_interpreter"
      model: "digits_model"
    - id: "analog_interpreter"
      model: "analog_model"

sensor:
  - id: "dig1"
    platform: "tflite"
    interpreter: "digits_interpreter"
    crop:
      top_left:
        x: 0
        y: 0
      bottom_right:
        x: 128
        y: 128
