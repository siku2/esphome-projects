substitutions:
  api_encryption_key: "" # REQUIRED!
  ota_password: "" # REQUIRED!
  git_ref: "" # REQUIRED!

  crop_dig_10000: &crop_dig_10000
    top_left:
      x: 0
      y: 0
    bottom_right:
      x: 0
      y: 0
  crop_dig_1000:
    <<: *crop_dig_10000
  crop_dig_100:
    <<: *crop_dig_10000
  crop_dig_10:
    <<: *crop_dig_10000
  crop_dig_1:
    <<: *crop_dig_10000
  crop_dig_01:
    <<: *crop_dig_10000
  crop_ana_0001:
    <<: *crop_dig_10000

  name: "aquasense"
  friendly_name: "Aquasense"
  language: "en"
  i18n:
    aquasense:
      de: !include i18n/de.yaml
      en: !include i18n/en.yaml

packages:
  base: !include
    file: ../../packages/base.yaml
  e32s3cam: !include
    file: ../../packages/esp32_s3_cam.yaml

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  project:
    name: "siku2.aquasense"
    version: "0.1.0"

dashboard_import:
  package_import_url: "github://siku2/esphome-projects/projects/aquasense/core.yaml@main"
  import_full_config: false

external_components:
  - source:
      type: git
      url: "https://github.com/siku2/esphome-projects"
      ref: "${git_ref}"
      path: "components"
    components: ["camera_snapshot", "tflite"]

api:
  encryption:
    key: "${api_encryption_key}"

ota:
  - platform: "esphome"
    password: "${ota_password}"

esp32_camera:
  entity_category: "diagnostic"
  max_framerate: "1 fps"
  idle_framerate: "0 fps"
  resolution: "640x480"
  jpeg_quality: 6
  contrast: 2
  brightness: 1
  saturation: -1
  # Exposure
  aec_mode: "manual"
  aec_value: 400
  # Gain
  agc_mode: "manual"
  agc_value: 0
  # White balance
  wb_mode: "sunny"

camera_snapshot:
  id: "snapshotter"
  update_interval: "10s"
  rotate: "90°"
  before_snapshot:
    - if:
        condition:
          switch.is_on: "auto_flashlight"
        then:
          - light.turn_on:
              id: "e32s3cam_flash"
              brightness: !lambda |
                return id(auto_flashlight_brightness).state / 100.0f;
            # TODO: fix the camera_snapshot so we can guarantee the snapshot is taken after before_snapshot completes.
            # Right now the issue is that the camera might still have a frame buffered.
          - delay: "1200ms"
  after_snapshot:
    - if:
        condition:
          switch.is_on: "auto_flashlight"
        then:
          - light.turn_off: "e32s3cam_flash"
  on_snapshot:
    - component.update: "meter_raw"
    - component.update: "meter_analog"

tflite:
  op_resolver:
    builtin:
      - "add"
      - "conv_2d"
      - "dequantize"
      - "fully_connected"
      - "leaky_relu"
      - "max_pool_2d"
      - "mul"
      - "quantize"
      - "reshape"
      - "softmax"
  allocator:
    size: "150 kB"
  model:
    - id: "digits_model"
      file: "https://github.com/jomjol/AI-on-the-edge-device/raw/refs/heads/main/sd-card/config/dig-cont_0900_s3_q.tflite"
    - id: "analog_model"
      file: "https://github.com/jomjol/AI-on-the-edge-device/raw/refs/heads/main/sd-card/config/ana-cont_1500_s2_q.tflite"
  interpreter:
    - id: "digits_interpreter"
      model: "digits_model"
    - id: "analog_interpreter"
      model: "analog_model"

button:
  - id: "manual_snapshot"
    name: "${i18n.aquasense.${language}.manual_snapshot}"
    entity_category: "diagnostic"
    platform: "template"
    on_press:
      - component.update: "snapshotter"

  - id: "reset_meter_value"
    name: "${i18n.aquasense.${language}.reset_meter}"
    # Clears the stored last-reading so the next snapshot is always accepted
    # regardless of whether it looks like a decrease or a large jump.
    entity_category: "config"
    icon: "mdi:counter"
    platform: "template"
    on_press:
      - globals.set:
          id: "meter_normalized_storage"
          value: 'nanf("")'

globals:
  - id: "meter_normalized_storage"
    type: "float"
    restore_value: true
    initial_value: 'nanf("")'

switch:
  - id: "auto_flashlight"
    name: "${i18n.aquasense.${language}.auto_flashlight}"
    restore_mode: "RESTORE_DEFAULT_ON"
    entity_category: "config"
    platform: "template"
    optimistic: true

number:
  - id: "auto_flashlight_brightness"
    name: "${i18n.aquasense.${language}.auto_flashlight_brightness}"
    entity_category: "config"
    unit_of_measurement: "%"
    platform: "template"
    min_value: 0.0
    max_value: 100.0
    step: 1.0
    update_interval: "never"
    optimistic: true
    restore_value: true
    initial_value: 80.0

sensor:
  - &dig_10000
    id: "dig_10000"
    name: "${i18n.aquasense.${language}.dig_10000}"
    state_class: "measurement"
    icon: "mdi:numeric-10-box-outline"
    accuracy_decimals: 1
    entity_category: "diagnostic"
    platform: "tflite"
    interpreter: "digits_interpreter"
    crop: "${crop_dig_10000}"
    output_format: "digit_softmax10"
    min_fit: "50%"

  - <<: *dig_10000
    id: "dig_1000"
    name: "${i18n.aquasense.${language}.dig_1000}"
    crop: "${crop_dig_1000}"

  - <<: *dig_10000
    id: "dig_100"
    name: "${i18n.aquasense.${language}.dig_100}"
    crop: "${crop_dig_100}"

  - <<: *dig_10000
    id: "dig_10"
    name: "${i18n.aquasense.${language}.dig_10}"
    crop: "${crop_dig_10}"

  - <<: *dig_10000
    id: "dig_1"
    name: "${i18n.aquasense.${language}.dig_1}"
    crop: "${crop_dig_1}"

  - <<: *dig_10000
    id: "dig_01"
    name: "${i18n.aquasense.${language}.dig_01}"
    crop: "${crop_dig_01}"

  - &ana_0001
    <<: *dig_10000
    id: "ana_0001"
    name: "${i18n.aquasense.${language}.ana_0001}"
    icon: "mdi:gauge"
    accuracy_decimals: 2
    crop: "${crop_ana_0001}"
    interpreter: "analog_interpreter"
    output_format: "analog_continuous_cw"
    min_fit: "40%"

  - <<: *ana_0001
    id: "ana_00001"
    name: "${i18n.aquasense.${language}.ana_00001}"
    crop: "${crop_ana_00001}"

  - id: "meter_analog"
    # name: "${i18n.aquasense.${language}.meter_raw}"
    name: Test # TODO
    unit_of_measurement: "L"
    device_class: "water"
    state_class: "measurement"
    accuracy_decimals: 3
    entity_category: "diagnostic"
    platform: "template"
    update_interval: "never"
    lambda: !lambda |
      return truncf(id(ana_0001).state) + 0.1f * id(id(ana_00001).state);

  - &meter_raw
    id: "meter_raw"
    name: "${i18n.aquasense.${language}.meter_raw}"
    unit_of_measurement: "m³"
    device_class: "water"
    state_class: "measurement"
    accuracy_decimals: 6
    entity_category: "diagnostic"
    on_value:
      - lambda: !lambda |
          float new_value = x;
          if (isnan(new_value))
            return;
          float &normalized_value = id(meter_normalized_storage);
          if (!isnan(normalized_value)) {
            float diff = new_value - normalized_value;
            if (diff < 0.0f) {
              ESP_LOGW("main", "Rejecting new meter value %.6f because it is smaller than the current stable value %.6f", new_value, normalized_value);
              return;
            }
            if (diff > 0.5f) {
              ESP_LOGW("main", "Rejecting new meter value %.6f because it differs too much from the current stable value %.6f", new_value, normalized_value);
              return;
            }
          }
          normalized_value = new_value;
          id(meter)->update();

    platform: "template"
    update_interval: "never"
    lambda: !lambda |
      auto correct = [](float digit_state, int lower_int) -> int {
        int v = (int)roundf(digit_state - lower_int / 10.0f);
        return ((v % 10) + 10) % 10;
      };

      int a00001_int = ((int)roundf(id(ana_00001).state) % 10 + 10) % 10;
      int a0001_int = correct(id(ana_0001).state, a00001_int);

      // 1e-2: no dedicated sensor; infer from dig_01's fractional part (frac * 10 ≈ 1e-2 dial).
      float dig01_raw = id(dig_01).state;
      float virtual_1e2_raw = (dig01_raw - floorf(dig01_raw)) * 10.0f;
      int virtual_1e2_int = correct(virtual_1e2_raw, a0001_int);

      int d01_int = correct(dig01_raw, virtual_1e2_int);
      int d1_int     = correct(id(dig_1).state,     d01_int);
      int d10_int    = correct(id(dig_10).state,    d1_int);
      int d100_int   = correct(id(dig_100).state,   d10_int);
      int d1000_int  = correct(id(dig_1000).state,  d100_int);
      int d10000_int = correct(id(dig_10000).state, d1000_int);

      float val = 0.0f;
      val += 10000.0f * (float)d10000_int;
      val +=  1000.0f * (float)d1000_int;
      val +=   100.0f * (float)d100_int;
      val +=    10.0f * (float)d10_int;
      val +=     1.0f * (float)d1_int;
      val +=    0.1f  * (float)d01_int;
      val +=    0.01f * (float)virtual_1e2_int;
      val +=   0.001f * (float)a0001_int;
      val +=  0.0001f * id(ana_00001).state;
      return val;

  - <<: *meter_raw
    id: "meter"
    name: "${i18n.aquasense.${language}.meter}"
    state_class: "total_increasing"
    entity_category: ""
    on_value: []
    lambda: !lambda |
      return id(meter_normalized_storage);
