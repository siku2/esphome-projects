packages:
  aqc: !include lib/aqc.yaml
  aqdig: !include lib/rh/aqdig.yaml

still_camera:
  rotate: "90°"
  update_interval: "2s"

meter_reader:
  id: aqmr
  camera: e32s3cam_camera
  reading:
    name: "${i18n.aquasense[language].aqmr_reading}"
  consumption:
    name: "${i18n.aquasense[language].aqmr_consumption}"
  confidence:
    name: "${i18n.aquasense[language].aqmr_confidence}"
  consistency:
    name: "${i18n.aquasense[language].aqmr_consistency}"
  rejected:
    name: "${i18n.aquasense[language].aqmr_rejected}"
  status:
    name: "${i18n.aquasense[language].aqmr_status}"
  rebase:
    name: "${i18n.aquasense[language].aqmr_rebase}"
  wheels:
  # Finest dial x0.0001 m3 = 1 L/rev.
  - { source: aqdig_00001, resolution: 1, tolerance: 0.8 }
  # x0.001 m3 is a needle dial geared to the finest one.
  - { source: aqdig_0001, resolution: 10, linear: true }
  # The x0.01 m3 dial (100 L/rev) has no sensor.
  - { source: aqdig_01, resolution: 1000 }
  - { source: aqdig_1, resolution: 10000 }
  - { source: aqdig_10, resolution: 100000 }
  - { source: aqdig_100, resolution: 1000000 }
  - { source: aqdig_1000, resolution: 10000000 }
  - { source: aqdig_10000, resolution: 100000000 }
