script:
- id: "toggle_power"
  mode: "parallel"
  parameters:
    zone: "uint8_t"
  then:
  - lambda: !lambda |-
      esphome::remote_base::NECData data;
      switch (zone) {
        case 1:
          data = id(NEC_ZONE1_TOGGLE_POWER);
          break;
        case 2:
          data = id(NEC_ZONE2_TOGGLE_POWER);
          break;
        default:
          return;
      }
      auto call = id(ir_transmitter).transmit();
      esphome::remote_base::NECProtocol().encode(call.get_data(), data);
      call.perform();
  - delay: "200ms"

- id: "set_power"
  mode: "queued"
  parameters:
    zone: "uint8_t"
    power_on: "bool"
  then:
  - lambda: !lambda |-
      bool currently_on;
      switch (zone) {
        case 1:
          currently_on = id(zone1_power).state;
          break;
        case 2:
          currently_on = id(zone2_power).state;
          break;
        default:
          return;
      }
      if (power_on != currently_on) {
        id(toggle_power)->execute(zone);
      }
  - script.wait: "toggle_power"

- id: "toggle_mute"
  mode: "parallel"
  parameters:
    zone: "uint8_t"
  then:
  - lambda: !lambda |-
      esphome::remote_base::NECData data;
      switch (zone) {
        case 1:
          data = id(NEC_ZONE1_TOGGLE_MUTE);
          break;
        case 2:
          data = id(NEC_ZONE2_TOGGLE_MUTE);
          break;
        default:
          return;
      }
      auto call = id(ir_transmitter).transmit();
      esphome::remote_base::NECProtocol().encode(call.get_data(), data);
      call.perform();
  - delay: "200ms"

- id: "set_mute"
  mode: "queued"
  parameters:
    zone: "uint8_t"
    muted: "bool"
  then:
  - lambda: !lambda |-
      bool currently_muted;
      switch (zone) {
        case 1:
          currently_muted = id(zone1_mute).state;
          break;
        case 2:
          currently_muted = id(zone2_mute).state;
          break;
        default:
          return;
      }
      if (muted != currently_muted) {
        id(toggle_mute)->execute(zone);
      }
  - script.wait: "toggle_mute"

- id: "volume_change"
  mode: "parallel"
  parameters:
    zone: "uint8_t"
    up: "bool"
  then:
  - lambda: !lambda |-
      esphome::remote_base::NECData data;
      // zone 1
      if (zone == 1 && up) {
        data = id(NEC_ZONE1_VOLUME_UP);
      } else if (zone == 1 && !up) {
        data = id(NEC_ZONE1_VOLUME_DOWN);
      }
      // zone 2
      else if (zone == 2 && up) {
        data = id(NEC_ZONE2_VOLUME_UP);
      } else if (zone == 2 && !up) {
        data = id(NEC_ZONE2_VOLUME_DOWN);
      }
      // unknown
      else {
        return;
      }
      auto call = id(ir_transmitter).transmit();
      esphome::remote_base::NECProtocol().encode(call.get_data(), data);
      call.perform();

- id: "zone1_set_scene"
  mode: "parallel"
  parameters:
    scene_id: "uint8_t"
  then:
  - lambda: !lambda |-
      esphome::remote_base::NECData data;
      switch (scene_id) {
        // DVD
        case 0:
          data = id(NEC_ZONE1_SCENE_DVD);
          break;
        // TV
        case 1:
          data = id(NEC_ZONE1_SCENE_TV);
          break;
        // CD
        case 2:
          data = id(NEC_ZONE1_SCENE_CD);
          break;
        // RADIO
        case 3:
          data = id(NEC_ZONE1_SCENE_RADIO);
          break;
        default:
          return;
      }
      auto call = id(ir_transmitter).transmit();
      esphome::remote_base::NECProtocol().encode(call.get_data(), data);
      call.perform();
