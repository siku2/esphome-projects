switch:
- platform: "template"
  name: "${i18n.yamaha[language].zone1_power}"
  icon: "mdi:power"
  device_class: "switch"
  lambda: !lambda "return id(zone1_power).state;"
  turn_on_action:
  - script.execute:
      id: "set_power"
      zone: 1
      power_on: true
  turn_off_action:
  - script.execute:
      id: "set_power"
      zone: 1
      power_on: false

- platform: "template"
  name: "${i18n.yamaha[language].zone1_mute}"
  icon: "mdi:volume-off"
  device_class: "switch"
  lambda: !lambda "return id(zone1_mute).state;"
  turn_on_action:
  - script.execute:
      id: "set_mute"
      zone: 1
      muted: true
  turn_off_action:
  - script.execute:
      id: "set_mute"
      zone: 1
      muted: false

- platform: "template"
  name: "${i18n.yamaha[language].zone2_power}"
  icon: "mdi:power"
  device_class: "switch"
  lambda: !lambda "return id(zone2_power).state;"
  turn_on_action:
  - script.execute:
      id: "set_power"
      zone: 2
      power_on: true
  turn_off_action:
  - script.execute:
      id: "set_power"
      zone: 2
      power_on: false

- platform: "template"
  name: "${i18n.yamaha[language].zone2_mute}"
  icon: "mdi:volume-off"
  device_class: "switch"
  lambda: !lambda "return id(zone2_mute).state;"
  turn_on_action:
  - script.execute:
      id: "set_mute"
      zone: 2
      muted: true
  turn_off_action:
  - script.execute:
      id: "set_mute"
      zone: 2
      muted: false

select:
- platform: "template"
  id: "zone1_scene_select"
  name: "${i18n.yamaha[language].zone1_scene}"
  update_interval: "never"
  restore_value: true
  options:
  - "DVD"
  - "TV"
  - "CD"
  - "RADIO"
  set_action:
    then:
    - script.execute:
        id: "zone1_set_scene"
        scene_id: !lambda "return id(zone1_scene_select).index_of(x).value_or(0);"

button:
- platform: "template"
  name: "${i18n.yamaha[language].zone1_volume_up}"
  icon: "mdi:volume-plus"
  on_press:
    then:
    - script.execute:
        id: "volume_change"
        zone: 1
        up: true

- platform: "template"
  name: "${i18n.yamaha[language].zone1_volume_down}"
  icon: "mdi:volume-minus"
  on_press:
    then:
    - script.execute:
        id: "volume_change"
        zone: 1
        up: false

- platform: "template"
  name: "${i18n.yamaha[language].zone2_volume_up}"
  icon: "mdi:volume-plus"
  on_press:
    then:
    - script.execute:
        id: "volume_change"
        zone: 2
        up: true

- platform: "template"
  name: "${i18n.yamaha[language].zone2_volume_down}"
  icon: "mdi:volume-minus"
  on_press:
    then:
    - script.execute:
        id: "volume_change"
        zone: 2
        up: false
