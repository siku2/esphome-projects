substitutions:
  receiver_device_id: "" # REQUIRED!

  components_source:
    type: "local"
    path: "../components"

  name: "yamaha-receiver"
  friendly_name: "Yamaha Receiver"
  language: "en"
  i18n:
    yamaha:
      de: !include translations/de.yaml
      en: !include translations/en.yaml

packages:
  base: !include ../../base/device.yaml
  ir: !include ir.yaml
  zones: !include zones.yaml

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  project:
    name: "siku2.yamaha-receiver"

esp32:
  board: "esp32dev"
  framework:
    type: "esp-idf"
