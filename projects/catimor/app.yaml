substitutions:
  blind_left_cover_id: "" # REQUIRED!
  blind_right_cover_id: "" # REQUIRED!
  climate_id: "" # REQUIRED!

  api_encryption_key: "" # REQUIRED!
  ota_password: "" # REQUIRED!
  git_ref: "" # REQUIRED!
  components_source:
    type: "git"
    url: "https://github.com/siku2/esphome-projects"
    ref: "${git_ref}"
    path: "components"

  name: "esp-catimor"
  friendly_name: "Catimor"
  language: "en"
  i18n:
    catimor:
      de: !include translations/de.yaml
      en: !include translations/en.yaml

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  project:
    name: "siku2.esp-catimor"
    version: "0.1.0"

api:
  encryption:
    key: "${api_encryption_key}"

ota:
- platform: "esphome"
  password: "${ota_password}"

number:
- id: "display_timeout"
  name: "${i18n.catimor[language].display_timeout}"
  unit_of_measurement: "s"
  entity_category: "CONFIG"
  mode: "box"
  platform: "template"
  optimistic: true
  initial_value: 10
  restore_value: true
  min_value: 5
  max_value: 180
  step: 5

sensor:
- id: !extend "blind_left_position"
  on_value:
  - script.execute: "script_sync_sliders"

- id: !extend "blind_right_position"
  on_value:
  - script.execute: "script_sync_sliders"

- id: !extend "blind_left_tilt"
  on_value:
  - script.execute: "script_sync_sliders"

- id: !extend "blind_right_tilt"
  on_value:
  - script.execute: "script_sync_sliders"

- id: !extend "ac_temperature"
  on_value:
  - script.execute: "script_sync_ac"

text_sensor:
- id: !extend "blind_left_state"
  on_value:
  - script.execute: "script_sync_sliders"

- id: !extend "blind_right_state"
  on_value:
  - script.execute: "script_sync_sliders"

- id: !extend "ac_hvac_mode"
  on_value:
  - script.execute: "script_sync_ac"

- id: !extend "ac_fan_mode"
  on_value:
  - script.execute: "script_sync_ac"

- id: !extend "ac_swing_mode"
  on_value:
  - script.execute: "script_sync_ac"

script:
- !include scripts/set_cover_position.yaml
- !include scripts/set_cover_tilt.yaml
- !include scripts/sync_ac.yaml
- !include scripts/sync_sliders.yaml

font:
- id: "montserrat_12_ext"
  file: "gfonts://Montserrat"
  size: 12
  glyphsets:
  - "GF_Latin_Core"

touchscreen:
- id: !extend m5s3l_touchscreen
  on_release:
  - if:
      condition: lvgl.is_paused
      then:
      - logger.log: "LVGL resuming"
      - lvgl.resume:
      - lvgl.page.show: "pg_blinds_control"
      - lvgl.widget.redraw:
      - light.turn_on: "m5s3l_lcd_backlight"

lvgl:
  displays: ["m5s3l_lcd"]
  touchscreens:
  - touchscreen_id: "m5s3l_touchscreen"
  theme:
    dark_mode: true
    button:
      text_color: "0xCDD6F4"
      radius: 4
      border_width: 1
      border_color: "0x585B70"
      pressed:
        bg_color: "0x313244"
      checked:
        bg_color: "0x89B4FA"
        border_color: "0x89B4FA"
        text_color: "0x1E1E2E"
    slider:
      radius: 4
      indicator:
        bg_color: "0x89B4FA"
        radius: 4
      knob:
        radius: 4
        pad_top: -14
        pad_bottom: -14
        bg_color: "0x89B4FA"
        border_color: "0x1E1E2E"
        border_width: 1
    label:
      text_color: "0xCDD6F4"
  on_idle:
    timeout: !lambda >
      return (id(display_timeout).state * 1000);
    then:
    - logger.log: "LVGL is idle"
    - light.turn_off: "m5s3l_lcd_backlight"
    - lvgl.pause:
  pages:
  - !include pages/blinds_control.yaml
  - !include pages/home.yaml
  - !include pages/ac_control.yaml
