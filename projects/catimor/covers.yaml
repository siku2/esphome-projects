external_components:
- source: "${components_source}"
  components: ["m5stack_4encodermotor"]

m5stack_4encodermotor:
- id: "motor_encoder"
  update_interval: "100ms"
  current:
    id: "m54em_current"
    name: "${i18n.catimor[language].m54em_current}"
    filters:
    - sliding_window_moving_average:
        window_size: 10
        send_every: 10
        send_first_at: 10
    - round: 3
    - delta: "10%"
  voltage:
    id: "m54em_voltage"
    name: "${i18n.catimor[language].m54em_voltage}"
    filters:
    - delta: 0.1

cover:
- &cover_north
  id: "cover_north"
  name: "${i18n.catimor[language].cover_north}"
  device_class: "shutter"
  platform: "m5stack_4encodermotor"
  m5stack_4encodermotor_id: "motor_encoder"
  motor: "M3"
  min_current: "0.1A"
  soft_start_stop: true
  open_duration: "29s"
  close_duration: "28.5s"
  acceleration_wait_time: "0.5s"

- <<: *cover_north
  id: "cover_south"
  name: "${i18n.catimor[language].cover_south}"
  motor: "M4"
