substitutions:
  components_source:
    type: "local"
    path: "../components"

  name: "somfy-gates"
  friendly_name: "Somfy Gates"
  language: "en"
  velo_device_id: "" # REQUIRED!
  unterstand_device_id: "" # REQUIRED!
  garage_device_id: "" # REQUIRED!
  i18n:
    somfygates:
      de: !include translations/de.yaml
      en: !include translations/en.yaml

packages:
  base: !include ../../base/device.yaml

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  project:
    name: "siku2.somfy-gates"

esp32:
  board: "esp32doit-devkit-v1"
  framework:
    type: "arduino"

external_components:
- source: "${components_source}"
  components: ["cc1101", "somfy_cover"]

spi:
  clk_pin: "GPIO18"
  mosi_pin: "GPIO23"
  miso_pin:
    number: "GPIO19"
    allow_other_uses: true

cc1101:
  id: "cc_module"
  cs_pin: "GPIO5"
  miso_pin:
    number: "GPIO19"
    allow_other_uses: true
  tx_pin: "GPIO2"
  frequency: "433.42 MHz"

button:
- &program_velo
  id: "program_velo"
  name: "${i18n.somfygates[language].program}"
  device_id: "${velo_device_id}"
  icon: "mdi:access-point"
  entity_category: "config"
  platform: "template"
  on_press:
    then:
    - cover.somfy_cover.program: "velo"

- <<: *program_velo
  id: "program_unterstand"
  device_id: "${unterstand_device_id}"
  on_press:
    then:
    - cover.somfy_cover.program: "unterstand"

- <<: *program_velo
  id: "program_garage"
  device_id: "${garage_device_id}"
  on_press:
    then:
    - cover.somfy_cover.program: "garage"

cover:
- id: "velo"
  name: ""
  device_id: "${velo_device_id}"
  device_class: "garage"
  platform: "somfy_cover"
  cc1101_id: "cc_module"
  remote_code: 0xB51201
  open_duration: "40s"
  close_duration: "35s"
  storage_key: "velo"

- id: "unterstand"
  name: ""
  device_id: "${unterstand_device_id}"
  device_class: "shutter"
  platform: "somfy_cover"
  cc1101_id: "cc_module"
  remote_code: 0xB51221
  open_duration: "41s"
  close_duration: "36s"
  storage_key: "unterstand"

- id: "garage"
  name: ""
  device_id: "${garage_device_id}"
  device_class: "garage"
  platform: "somfy_cover"
  cc1101_id: "cc_module"
  remote_code: 0xB51222
  open_duration: "25s"
  close_duration: "24s"
  storage_key: "garage"
