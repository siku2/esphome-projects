substitutions:
  components_source:
    type: "local"
    path: "../components"

  name: "somfy-gates"
  friendly_name: "Somfy Gates"
  language: "en"
  i18n:
    somfygates:
      de: !include translations/de.yaml
      en: !include translations/en.yaml

packages:
  base: !include ../../base/device.yaml

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  project:
    name: "siku2.somfy-gates"
    version: "0.1.0"

esp32:
  board: "esp32doit-devkit-v1"
  framework:
    type: "arduino"

external_components:
- source: "${components_source}"
  components: ["cc1101", "somfy_cover"]

spi:
  clk_pin: "GPIO18"
  mosi_pin: "GPIO23"
  miso_pin:
    number: "GPIO19"
    allow_other_uses: true

cc1101:
  id: "cc_module"
  cs_pin: "GPIO5"
  miso_pin:
    number: "GPIO19"
    allow_other_uses: true
  tx_pin: "GPIO2"
  frequency: "433.42 MHz"

button:
- &program_velo
  id: "program_velo"
  name: "${i18n.somfygates[language].velo_program}"
  icon: "mdi:access-point"
  entity_category: "config"
  platform: "template"
  on_press:
    then:
    - cover.somfy_cover.program: "velo"

- <<: *program_velo
  id: "program_unterstand"
  name: "${i18n.somfygates[language].unterstand_program}"
  on_press:
    then:
    - cover.somfy_cover.program: "unterstand"

- <<: *program_velo
  id: "program_garage"
  name: "${i18n.somfygates[language].garage_program}"
  on_press:
    then:
    - cover.somfy_cover.program: "garage"

- name: "${i18n.somfygates[language].velo_brute_force}"
  entity_category: "config"
  on_press:
    then:
    - repeat:
        count: 0x7fff
        then:
        - lambda: !lambda |
            if (iteration % 256 == 0) {
              uint32_t prog = 100 * iteration / 0x7fff;
              ESP_LOGI("main", "progress: %d", prog);
            }
        - cover.close: "velo"
        - cover.open: "velo"
        - delay: "20ms"
  platform: "template"

cover:
- id: "velo"
  name: "${i18n.somfygates[language].velo}"
  device_class: "garage"
  platform: "somfy_cover"
  cc1101_id: "cc_module"
  remote_code: 0xB51201
  open_duration: "40s"
  close_duration: "35s"
  storage_key: "velo"

- id: "unterstand"
  name: "${i18n.somfygates[language].unterstand}"
  device_class: "shutter"
  platform: "somfy_cover"
  cc1101_id: "cc_module"
  remote_code: 0xB51221
  open_duration: "41s"
  close_duration: "36s"
  storage_key: "unterstand"

- id: "garage"
  name: "${i18n.somfygates[language].garage}"
  device_class: "garage"
  platform: "somfy_cover"
  cc1101_id: "cc_module"
  remote_code: 0xB51222
  open_duration: "25s"
  close_duration: "24s"
  storage_key: "garage"
