esphome:
  on_boot:
    priority: -100
    then:
    - climate.control:
        id: "climate_west"
        mode: "OFF"
    - climate.control:
        id: "climate_east"
        mode: "OFF"

api:
  on_client_connected:
  - if:
      condition:
        lambda: !lambda "return id(climate_west)->mode == climate::CLIMATE_MODE_OFF;"
      then:
      - switch.turn_off: "heater_west_switch"
  - if:
      condition:
        lambda: !lambda "return id(climate_east)->mode == climate::CLIMATE_MODE_OFF;"
      then:
      - switch.turn_off: "heater_east_switch"

switch:
- &heater_west_switch
  id: "heater_west_switch"
  name: "${i18n.grilldisplay[language].heater_west}"
  platform: "homeassistant"
  entity_id: "switch.terrasse_grill_west"

- <<: *heater_west_switch
  id: "heater_east_switch"
  name: "${i18n.grilldisplay[language].heater_east}"
  entity_id: "switch.on_off_light_31"

output:
- id: "heater_west_pwm"
  platform: "slow_pwm"
  period: "60s"
  turn_on_action:
  - switch.turn_on: "heater_west_switch"
  turn_off_action:
  - switch.turn_off: "heater_west_switch"

- id: "heater_east_pwm"
  platform: "slow_pwm"
  period: "60s"
  turn_on_action:
  - switch.turn_on: "heater_east_switch"
  turn_off_action:
  - switch.turn_off: "heater_east_switch"

climate:
- &climate_west
  id: "climate_west"
  name: "${i18n.grilldisplay[language].climate_west}"
  visual:
    min_temperature: 40
    max_temperature: 300
    temperature_step: 5
  platform: "pid"
  sensor: "probe_west_temperature"
  default_target_temperature: 180
  heat_output: "heater_west_pwm"
  control_parameters:
    kp: 0.02829
    ki: 0.00016
    kd: 1.21726
  on_state:
  # Fires on every publish, so only react when the mode changes.
  - if:
      condition:
        lambda: !lambda |-
          static climate::ClimateMode last = climate::CLIMATE_MODE_OFF;
          const bool changed = x.mode != last;
          last = x.mode;
          return changed;
      then:
      - lambda: !lambda |-
          id(grill_cook_main)->update();
      - script.execute: "ui_select_page"

- <<: *climate_west
  id: "climate_east"
  name: "${i18n.grilldisplay[language].climate_east}"
  sensor: "probe_east_temperature"
  heat_output: "heater_east_pwm"

button:
- &climate_west_autotune
  id: "climate_west_autotune"
  name: "${i18n.grilldisplay[language].climate_west_autotune}"
  entity_category: "CONFIG"
  platform: "template"
  on_press:
  - climate.pid.autotune: "climate_west"

- <<: *climate_west_autotune
  id: "climate_east_autotune"
  name: "${i18n.grilldisplay[language].climate_east_autotune}"
  on_press:
  - climate.pid.autotune: "climate_east"
