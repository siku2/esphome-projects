globals:
- id: "ui_focus"
  type: "int"
  restore_value: no
  initial_value: "0"
- id: "ui_focus_visible"
  type: "bool"
  restore_value: no
  initial_value: "false"

script:
- id: "ui_focus_timeout"
  mode: "restart"
  then:
  - delay: "15s"
  - lambda: |-
      id(ui_focus_visible) = false;
  - script.execute: "ui_cook_update"

binary_sensor:
- id: !extend "cp579epd_rotary_press"
  on_press:
  - if:
      condition:
        lvgl.page.is_showing: "ui_page_idle"
      then:
      - lambda: |-
          id(grill_cook_main)->start_cook();
      - script.execute: "ui_select_page"
      else:
      - lambda: |-
          int next = (id(ui_focus) + 1) % 3;
          if (next == 2 && !id(grill_cook_main)->meat_probe_present()) {
            next = (next + 1) % 3;
          }
          id(ui_focus) = next;
          id(ui_focus_visible) = true;
      - script.execute: "ui_focus_timeout"
      - script.execute: "ui_cook_update"

- id: !extend "cp579epd_menu"
  on_press:
  - if:
      condition:
        lvgl.page.is_showing: "ui_page_idle"
      then:
      - lambda: |-
          id(grill_cook_main)->start_cook();
      - script.execute: "ui_select_page"
      else:
      - if:
          condition:
            lambda: "return !id(ui_focus_visible);"
          then:
          - lambda: |-
              id(ui_focus_visible) = true;
          else:
          - if:
              condition:
                lambda: "return id(ui_focus) == 0;"
              then:
              - if:
                  condition:
                    lambda: "return id(climate_west)->mode == climate::CLIMATE_MODE_OFF;"
                  then:
                  - climate.control:
                      id: "climate_west"
                      mode: "HEAT"
                  else:
                  - climate.control:
                      id: "climate_west"
                      mode: "OFF"
          - if:
              condition:
                lambda: "return id(ui_focus) == 1;"
              then:
              - if:
                  condition:
                    lambda: "return id(climate_east)->mode == climate::CLIMATE_MODE_OFF;"
                  then:
                  - climate.control:
                      id: "climate_east"
                      mode: "HEAT"
                  else:
                  - climate.control:
                      id: "climate_east"
                      mode: "OFF"
      - script.execute: "ui_focus_timeout"
      - script.execute: "ui_cook_update"

- id: !extend "cp579epd_rotary_up"
  on_press:
  - if:
      condition:
        lvgl.page.is_showing: "ui_page_cook"
      then:
      - if:
          condition:
            lambda: "return !id(ui_focus_visible);"
          then:
          - lambda: |-
              id(ui_focus_visible) = true;
          else:
          - if:
              condition:
                lambda: "return id(ui_focus) == 0;"
              then:
              - climate.control:
                  id: "climate_west"
                  target_temperature: !lambda "return id(climate_west)->target_temperature + 5;"
          - if:
              condition:
                lambda: "return id(ui_focus) == 1;"
              then:
              - climate.control:
                  id: "climate_east"
                  target_temperature: !lambda "return id(climate_east)->target_temperature + 5;"
          - if:
              condition:
                lambda: "return id(ui_focus) == 2;"
              then:
              - number.set:
                  id: "target_meat_core_temperature"
                  value: !lambda "return id(target_meat_core_temperature)->state + 1;"
      - script.execute: "ui_focus_timeout"
      - script.execute: "ui_cook_update"

- id: !extend "cp579epd_rotary_down"
  on_press:
  - if:
      condition:
        lvgl.page.is_showing: "ui_page_cook"
      then:
      - if:
          condition:
            lambda: "return !id(ui_focus_visible);"
          then:
          - lambda: |-
              id(ui_focus_visible) = true;
          else:
          - if:
              condition:
                lambda: "return id(ui_focus) == 0;"
              then:
              - climate.control:
                  id: "climate_west"
                  target_temperature: !lambda "return id(climate_west)->target_temperature - 5;"
          - if:
              condition:
                lambda: "return id(ui_focus) == 1;"
              then:
              - climate.control:
                  id: "climate_east"
                  target_temperature: !lambda "return id(climate_east)->target_temperature - 5;"
          - if:
              condition:
                lambda: "return id(ui_focus) == 2;"
              then:
              - number.set:
                  id: "target_meat_core_temperature"
                  value: !lambda "return id(target_meat_core_temperature)->state - 1;"
      - script.execute: "ui_focus_timeout"
      - script.execute: "ui_cook_update"

- id: !extend "cp579epd_exit"
  on_click:
    min_length: "50ms"
    max_length: "999ms"
    then:
    - if:
        condition:
          lvgl.page.is_showing: "ui_page_cook"
        then:
        - lambda: |-
            id(ui_focus_visible) = false;
        - script.execute: "ui_cook_update"
  on_multi_click:
  - timing:
    - state: true
      min_length: "1s"
    - min_length: "0s"
    then:
    - if:
        condition:
          lvgl.page.is_showing: "ui_page_cook"
        then:
        - lambda: |-
            id(grill_cook_main)->end_cook();
        - script.execute: "ui_select_page"
