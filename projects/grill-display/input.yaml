# Levels: 0 idle page, 1 panel, 2 item, 3 edit.
globals:
- id: "ui_input_pending"
  type: "bool"
  restore_value: no
  initial_value: "false"
- id: "ui_level"
  type: "int"
  restore_value: no
  initial_value: "0"
- id: "ui_panel"
  type: "int"
  restore_value: no
  initial_value: "0"
- id: "ui_item"
  type: "int"
  restore_value: no
  initial_value: "0"
- id: "ui_panel_count"
  type: "int"
  restore_value: no
  initial_value: "1"
- id: "ui_meat_selectable"
  type: "bool"
  restore_value: no
  initial_value: "true"

script:
- id: "ui_timeout_item"
  mode: "restart"
  then:
  - delay: "20s"
  - if:
      condition:
        lambda: "return id(ui_level) >= 2;"
      then:
      - script.execute:
          id: "ui_panel_move"
          step: 0
      - lambda: |-
          id(ui_level) = id(ui_panel_count) == 1 ? 0 : 1;
      - script.execute: "ui_select_page"
      - script.execute: "ui_refresh_full"

- id: "ui_timeout_panel"
  mode: "restart"
  then:
  - delay: "60s"
  - if:
      condition:
        lambda: |-
          return id(ui_level) == 1 &&
                 !id(grill_cook_main)->zone_on(grill_cook::Zone::WEST) &&
                 !id(grill_cook_main)->zone_on(grill_cook::Zone::EAST);
      then:
      - lambda: |-
          id(ui_level) = 0;
      - script.execute: "ui_select_page"
      - script.execute: "ui_refresh_full"

- id: "ui_input_done"
  then:
  - lambda: |-
      id(ui_input_pending) = true;
      id(ui_last_activity) = millis_64() / 1000;
  - script.execute: "ui_timeout_item"
  - script.execute: "ui_timeout_panel"
  - lambda: |-
      id(grill_cook_main)->update();
  - script.execute: "ui_select_page"

- id: "ui_shutdown_hold"
  mode: "restart"
  then:
  - delay: "2s"
  - climate.control:
      id: "climate_west"
      mode: "OFF"
  - climate.control:
      id: "climate_east"
      mode: "OFF"
  - lambda: |-
      id(grill_cook_main)->end_cook();
      id(ui_level) = 0;
  - script.execute: "ui_input_done"

- id: "ui_panel_move"
  parameters:
    step: "int"
  then:
  - lambda: |-
      const bool east = id(grill_cook_main)->zone_present(grill_cook::Zone::EAST);
      const bool west = id(grill_cook_main)->zone_present(grill_cook::Zone::WEST);
      const bool selectable[3] = {east, west, id(grill_cook_main)->meat_probe_present() || (!east && !west)};
      id(ui_panel_count) = selectable[0] + selectable[1] + selectable[2];
      id(ui_meat_selectable) = selectable[2];
      if (id(ui_panel_count) == 1 && id(ui_level) == 1) {
        id(ui_level) = 0;
      }
      int panel = id(ui_panel);
      for (int i = 0; i < 3 && step != 0; i++) {
        panel = (panel + step + 3) % 3;
        if (selectable[panel])
          break;
      }
      id(ui_panel) = panel;

- id: "ui_panel_first"
  then:
  # Stepping forward from the last panel wraps around to the first selectable one.
  - lambda: |-
      id(ui_panel) = 2;
      id(ui_panel_move)->execute(1);

- id: "ui_item_reset"
  then:
  - lambda: |-
      id(ui_item) = id(ui_panel) == 2 && id(grill_cook_main)->is_cooking() &&
                            id(grill_cook_main)->meat_probe_present()
                        ? 1
                        : 0;

- id: "ui_panel_enter"
  then:
  - lambda: |-
      id(ui_panel_first)->execute();
      id(ui_level) = id(ui_panel_count) == 1 ? 2 : 1;
      id(ui_item_reset)->execute();

- id: "ui_rotate"
  parameters:
    step: "int"
  then:
  - lambda: |-
      if (id(ui_asleep))
        return;
      if (id(ui_level) == 0) {
        id(ui_panel_enter)->execute();
      } else if (id(ui_level) == 1) {
        id(ui_panel_move)->execute(step);
      } else if (id(ui_level) == 2) {
        if (id(ui_panel) != 2 || id(grill_cook_main)->meat_probe_present()) {
          id(ui_item) = 1 - id(ui_item);
        }
      } else if (id(ui_panel) == 2) {
        auto call = id(target_meat_core_temperature).make_call();
        call.set_value(id(target_meat_core_temperature).state + step);
        call.perform();
      } else {
        climate::Climate *zone = id(ui_panel) == 0 ? id(climate_east) : id(climate_west);
        auto call = zone->make_call();
        call.set_target_temperature(std::max(40.0f, std::min(300.0f, zone->target_temperature + 5.0f * step)));
        call.perform();
      }
  - script.execute: "ui_input_done"

binary_sensor:
- id: !extend "cp579epd_menu"
  on_press:
    then:
    - lambda: |-
        if (id(ui_asleep))
          return;
        if (id(ui_level) == 0) {
          id(ui_panel_enter)->execute();
        } else if (id(ui_level) == 1) {
          id(ui_level) = 2;
          id(ui_item_reset)->execute();
        } else if (id(ui_level) == 2 && id(ui_item) == 0 && id(ui_panel) == 2) {
          if (id(grill_cook_main)->is_cooking()) {
            id(grill_cook_main)->end_cook();
          } else {
            id(grill_cook_main)->start_cook();
          }
        } else if (id(ui_level) == 2 && id(ui_item) == 0) {
          climate::Climate *zone = id(ui_panel) == 0 ? id(climate_east) : id(climate_west);
          auto call = zone->make_call();
          call.set_mode(zone->mode == climate::CLIMATE_MODE_OFF ? climate::CLIMATE_MODE_HEAT : climate::CLIMATE_MODE_OFF);
          call.perform();
        } else if (id(ui_level) == 2) {
          id(ui_level) = 3;
        } else {
          id(ui_level) = 2;
        }
    - script.execute: "ui_input_done"

- id: !extend "cp579epd_exit"
  on_press:
  - script.execute: "ui_shutdown_hold"
  on_release:
  - script.stop: "ui_shutdown_hold"
  on_click:
  - min_length: "50ms"
    max_length: "999ms"
    then:
    - lambda: |-
        if (id(ui_asleep))
          return;
        id(ui_panel_move)->execute(0);
        if (id(ui_level) == 0) {
          id(ui_panel_enter)->execute();
        } else if (id(ui_level) == 1) {
          if (!id(grill_cook_main)->zone_on(grill_cook::Zone::WEST) &&
              !id(grill_cook_main)->zone_on(grill_cook::Zone::EAST)) {
            id(ui_level) = 0;
          }
        } else if (id(ui_level) == 2 && id(ui_panel_count) == 1) {
          id(ui_level) = 0;
        } else {
          id(ui_level) -= 1;
        }
    - script.execute: "ui_input_done"

- id: !extend "cp579epd_rotary_up"
  on_press:
  - script.execute:
      id: "ui_rotate"
      step: 1

- id: !extend "cp579epd_rotary_down"
  on_press:
  - script.execute:
      id: "ui_rotate"
      step: -1
