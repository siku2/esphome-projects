# Levels: 0 idle page, 1 panel, 2 item, 3 edit.
globals:
- id: "ui_level"
  type: "int"
  restore_value: no
  initial_value: "0"
- id: "ui_panel"
  type: "int"
  restore_value: no
  initial_value: "0"
- id: "ui_item"
  type: "int"
  restore_value: no
  initial_value: "0"

script:
- id: "ui_timeout_item"
  mode: "restart"
  then:
  - delay: "20s"
  - if:
      condition:
        lambda: "return id(ui_level) >= 2;"
      then:
      - lambda: |-
          id(ui_level) = 1;
      - script.execute: "ui_cook_update"

- id: "ui_timeout_panel"
  mode: "restart"
  then:
  - delay: "60s"
  - if:
      condition:
        lambda: |-
          return id(ui_level) == 1 &&
                 !id(grill_cook_main)->zone_on(grill_cook::Zone::WEST) &&
                 !id(grill_cook_main)->zone_on(grill_cook::Zone::EAST);
      then:
      - lambda: |-
          id(ui_level) = 0;
      - script.execute: "ui_select_page"

- id: "ui_input_done"
  then:
  - script.execute: "ui_timeout_item"
  - script.execute: "ui_timeout_panel"
  - lambda: |-
      id(grill_cook_main)->update();
  - script.execute: "ui_select_page"

- id: "ui_rotate"
  parameters:
    step: "int"
  then:
  - lambda: |-
      if (id(ui_level) == 0) {
        id(ui_level) = 1;
        id(ui_panel) = 0;
      } else if (id(ui_level) == 1) {
        int panel = (id(ui_panel) + step + 3) % 3;
        if (panel == 2 && !id(grill_cook_main)->meat_probe_present()) {
          panel = (panel + step + 3) % 3;
        }
        id(ui_panel) = panel;
      } else if (id(ui_level) == 2) {
        if (id(ui_panel) != 2) {
          id(ui_item) = 1 - id(ui_item);
        }
      } else if (id(ui_panel) == 2) {
        auto call = id(target_meat_core_temperature).make_call();
        call.set_value(id(target_meat_core_temperature).state + step);
        call.perform();
      } else {
        climate::Climate *zone = id(ui_panel) == 0 ? id(climate_west) : id(climate_east);
        auto call = zone->make_call();
        call.set_target_temperature(std::max(40.0f, std::min(300.0f, zone->target_temperature + 5.0f * step)));
        call.perform();
      }
  - script.execute: "ui_input_done"

binary_sensor:
- id: !extend "cp579epd_menu"
  on_click:
    min_length: "50ms"
    max_length: "999ms"
    then:
    - lambda: |-
        if (id(ui_level) == 0) {
          id(ui_level) = 1;
          id(ui_panel) = 0;
        } else if (id(ui_level) == 1) {
          id(ui_level) = 2;
          id(ui_item) = id(ui_panel) == 2 ? 1 : 0;
        } else if (id(ui_level) == 2 && id(ui_item) == 0) {
          climate::Climate *zone = id(ui_panel) == 0 ? id(climate_west) : id(climate_east);
          auto call = zone->make_call();
          call.set_mode(zone->mode == climate::CLIMATE_MODE_OFF ? climate::CLIMATE_MODE_HEAT : climate::CLIMATE_MODE_OFF);
          call.perform();
        } else if (id(ui_level) == 2) {
          id(ui_level) = 3;
        } else {
          id(ui_level) = 2;
        }
    - script.execute: "ui_input_done"

- id: !extend "cp579epd_exit"
  on_click:
    min_length: "50ms"
    max_length: "999ms"
    then:
    - lambda: |-
        if (id(ui_level) == 0) {
          id(ui_level) = 1;
          id(ui_panel) = 0;
        } else if (id(ui_level) == 1) {
          if (!id(grill_cook_main)->zone_on(grill_cook::Zone::WEST) &&
              !id(grill_cook_main)->zone_on(grill_cook::Zone::EAST)) {
            id(ui_level) = 0;
          }
        } else {
          id(ui_level) -= 1;
        }
    - script.execute: "ui_input_done"

- id: !extend "cp579epd_rotary_up"
  on_press:
  - script.execute:
      id: "ui_rotate"
      step: 1

- id: !extend "cp579epd_rotary_down"
  on_press:
  - script.execute:
      id: "ui_rotate"
      step: -1
