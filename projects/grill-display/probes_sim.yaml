globals:
- id: "sim_west_temperature"
  type: "float"
  initial_value: "20.0"
- id: "sim_east_temperature"
  type: "float"
  initial_value: "20.0"
- id: "sim_west_element"
  type: "float"
  initial_value: "0.0"
- id: "sim_east_element"
  type: "float"
  initial_value: "0.0"
- id: "sim_meat_temperature"
  type: "float"
  initial_value: "8.0"

binary_sensor:
- id: "sim_meat_toggle"
  internal: true
  platform: "sdl"
  sdl_id: "cp579epd_display"
  key: "SDLK_m"
  on_press:
  - switch.toggle: "sim_meat_probe"

switch:
- id: "sim_west_probe"
  name: "Sim West Probe"
  platform: "template"
  optimistic: true
  restore_mode: "ALWAYS_ON"

- id: "sim_east_probe"
  name: "Sim East Probe"
  platform: "template"
  optimistic: true
  restore_mode: "ALWAYS_ON"

- id: "sim_meat_probe"
  name: "Sim Meat Probe"
  platform: "template"
  optimistic: true
  restore_mode: "ALWAYS_ON"

number:
- id: "sim_west_temperature_input"
  name: "Sim West Temperature"
  platform: "template"
  optimistic: true
  min_value: 0
  max_value: 400
  step: 1
  initial_value: 20
  on_value:
  - lambda: !lambda "id(sim_west_temperature) = x;"

- id: "sim_east_temperature_input"
  name: "Sim East Temperature"
  platform: "template"
  optimistic: true
  min_value: 0
  max_value: 400
  step: 1
  initial_value: 20
  on_value:
  - lambda: !lambda "id(sim_east_temperature) = x;"

- id: "sim_meat_temperature_input"
  name: "Sim Meat Temperature"
  platform: "template"
  optimistic: true
  min_value: 0
  max_value: 120
  step: 0.5
  initial_value: 8
  on_value:
  - lambda: !lambda "id(sim_meat_temperature) = x;"

sensor:
- &sim_zone
  id: "probe_west_temperature"
  internal: true
  update_interval: "1s"
  platform: "template"
  lambda: !lambda |-
    const float duty = std::max(0.0f, std::min(1.0f, id(climate_west)->get_output_value()));
    id(sim_west_element) += (duty - id(sim_west_element)) / 60.0f;
    id(sim_west_temperature) += (20.0f + 330.0f * id(sim_west_element) - id(sim_west_temperature)) / 180.0f;
    return id(sim_west_probe).state ? id(sim_west_temperature) : NAN;

- <<: *sim_zone
  id: "probe_east_temperature"
  lambda: !lambda |-
    const float duty = std::max(0.0f, std::min(1.0f, id(climate_east)->get_output_value()));
    id(sim_east_element) += (duty - id(sim_east_element)) / 60.0f;
    id(sim_east_temperature) += (20.0f + 330.0f * id(sim_east_element) - id(sim_east_temperature)) / 180.0f;
    return id(sim_east_probe).state ? id(sim_east_temperature) : NAN;

- <<: *sim_zone
  id: "probe_meat_temperature"
  lambda: !lambda |-
    float &t = id(sim_meat_temperature);
    const float rate = (t > 65.0f && t < 75.0f) ? 0.05f : 1.0f;
    t += rate * ((id(sim_west_temperature) + id(sim_east_temperature)) / 2.0f - t) / 2400.0f;
    return id(sim_meat_probe).state ? t : NAN;
