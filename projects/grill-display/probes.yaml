spi:
- id: "probes_spi"
  miso_pin: "GPIO18"
  clk_pin: "GPIO19"

sensor:
- &probe_west_temperature
  id: "probe_west_temperature"
  internal: true
  filters:
  - throttle_average: "2s"
  - round: 1
  platform: "max31855"
  spi_id: "probes_spi"
  update_interval: "500ms"
  cs_pin: "GPIO20"

- <<: *probe_west_temperature
  id: "probe_east_temperature"
  cs_pin: "GPIO38"

- <<: *probe_west_temperature
  id: "probe_meat_temperature"
  cs_pin: "GPIO21"

- &probe_west_temperature_public
  id: "probe_west_temperature_public"
  name: "${i18n.grilldisplay[language].probe_west}"
  source_id: "probe_west_temperature"
  unit_of_measurement: "°C"
  device_class: "temperature"
  state_class: "measurement"
  accuracy_decimals: 0
  filters:
  - or:
    - delta: 0.5
    # Pass NaN and the first value after it, which delta would drop
    - lambda: !lambda |-
        static bool was_nan = false;
        const bool pass = std::isnan(x) || was_nan;
        was_nan = std::isnan(x);
        return pass ? optional<float>{x} : optional<float>{};
  platform: "copy"

- <<: *probe_west_temperature_public
  id: "probe_east_temperature_public"
  name: "${i18n.grilldisplay[language].probe_east}"
  source_id: "probe_east_temperature"

- <<: *probe_west_temperature_public
  id: "probe_meat_temperature_public"
  name: "${i18n.grilldisplay[language].probe_grey}"
  source_id: "probe_meat_temperature"
