lvgl:
  pages:
  - id: "ui_page_cook"
    widgets:
    - obj:
        width: 792
        height: 272
        pad_all: 0
        border_width: 0
        bg_color: "color_paper"
        widgets:
        - line:
            id: "divider_east"
            x: 264
            y: 26
            points:
            - x: 0
              y: 0
            - x: 0
              y: 220
            line_width: 1
            line_color: "color_ink"

        - line:
            id: "divider_west"
            x: 528
            y: 26
            points:
            - x: 0
              y: 0
            - x: 0
              y: 220
            line_width: 1
            line_color: "color_ink"

        - obj:
            id: "panel_meat"
            x: 264
            y: 0
            width: 264
            height: 272
            pad_all: 0
            border_width: 0
            bg_opa: "TRANSP"
            widgets:
            - label:
                id: "lbl_meat_header"
                text: "${i18n.grilldisplay[language].ui_meat_probe}"
                text_font: "font_label"
                text_color: "color_ink"
                bg_opa: "TRANSP"
                radius: 8
                pad_top: 2
                pad_bottom: 2
                pad_left: 10
                pad_right: 10
                align: "TOP_MID"
                y: 8

            - label:
                id: "lbl_meat_start"
                text: "${i18n.grilldisplay[language].ui_start}"
                text_font: "font_label"
                text_color: "color_ink"
                bg_opa: "TRANSP"
                radius: 8
                pad_top: 2
                pad_bottom: 2
                pad_left: 10
                pad_right: 10
                align: "TOP_MID"
                y: 32

            - label:
                id: "lbl_meat_hint"
                text: "${i18n.grilldisplay[language].ui_no_meat_probe}"
                text_font: "font_text"
                text_align: "CENTER"
                align: "TOP_MID"
                y: 100
                hidden: true

            - obj:
                id: "grp_meat_present"
                x: 0
                y: 0
                width: 264
                height: 272
                pad_all: 0
                border_width: 0
                bg_opa: "TRANSP"
                widgets:
                - obj:
                    id: "row_meat_temp"
                    width: "SIZE_CONTENT"
                    height: "SIZE_CONTENT"
                    align: "TOP_MID"
                    y: 36
                    pad_all: 0
                    border_width: 0
                    bg_opa: "TRANSP"
                    layout:
                      type: "flex"
                      flex_flow: "ROW"
                      flex_align_main: "CENTER"
                      flex_align_cross: "END"
                      pad_column: 4
                    widgets:
                    - label:
                        id: "lbl_meat_temp"
                        text: "--"
                        text_font: "font_hero"
                    - label:
                        text: "°C"
                        text_font: "font_text"
                        pad_bottom: 18
                - label:
                    id: "lbl_meat_target"
                    text: ""
                    text_font: "font_text"
                    text_color: "color_ink"
                    bg_opa: "TRANSP"
                    radius: 8
                    pad_top: 4
                    pad_bottom: 4
                    pad_left: 10
                    pad_right: 10
                    align: "TOP_MID"
                    y: 140
                - label:
                    id: "lbl_meat_rate"
                    text: ""
                    text_font: "font_text"
                    align: "TOP_MID"
                    y: 168
                - label:
                    id: "lbl_meat_phase"
                    text: ""
                    text_font: "font_label"
                    align: "TOP_MID"
                    y: 194
                - label:
                    id: "lbl_meat_done"
                    text: ""
                    text_font: "font_text"
                    align: "TOP_MID"
                    y: 214
                    hidden: true
                - label:
                    id: "lbl_meat_remaining"
                    text: ""
                    text_font: "font_label"
                    align: "TOP_MID"
                    y: 238
                    hidden: true
            - obj:
                id: "frame_meat"
                x: 3
                y: 3
                width: 259
                height: 266
                bg_opa: "TRANSP"
                border_width: 3
                border_color: "color_ink"
                radius: 10
                clickable: false
                hidden: true

script:
- id: "ui_cook_update"
  mode: "restart"
  then:
  - script.execute:
      id: "ui_panel_move"
      step: 0
  - script.execute: "ui_cook_update_west"
  - script.execute: "ui_cook_update_east"
  - lvgl.obj.update:
      id: "divider_east"
      hidden: !lambda "return !id(grill_cook_main)->zone_present(grill_cook::Zone::EAST);"
  - lvgl.obj.update:
      id: "divider_west"
      hidden: !lambda "return !id(grill_cook_main)->zone_present(grill_cook::Zone::WEST);"
  - lambda: !lambda |-
      const bool east = id(grill_cook_main)->zone_present(grill_cook::Zone::EAST);
      const bool west = id(grill_cook_main)->zone_present(grill_cook::Zone::WEST);
      const int width = 264 * (1 + !east + !west);
      lv_obj_set_x(id(panel_meat), east ? 264 : 0);
      lv_obj_set_width(id(panel_meat), width);
      lv_obj_set_width(id(grp_meat_present), width);
      lv_obj_set_width(id(frame_meat), width - 5);
  - lvgl.label.update:
      id: "lbl_meat_start"
      hidden: !lambda "return !id(ui_meat_selectable);"
      text: !lambda |-
        if (id(grill_cook_main)->is_cooking())
          return std::string("${i18n.grilldisplay[language].ui_stop}");
        return std::string("${i18n.grilldisplay[language].ui_start}");
  - if:
      condition:
        lambda: !lambda "return id(ui_level) == 2 && id(ui_panel) == 2 && id(ui_item) == 0;"
      then:
      - lvgl.label.update:
          id: "lbl_meat_start"
          bg_opa: "COVER"
          bg_color: "color_ink"
          text_color: "color_paper"
      else:
      - lvgl.label.update:
          id: "lbl_meat_start"
          bg_opa: "TRANSP"
          text_color: "color_ink"
  - lvgl.obj.update:
      id: "frame_meat"
      hidden: !lambda "return !(id(ui_level) >= 1 && id(ui_panel) == 2 && id(ui_panel_count) > 1);"
  - lvgl.obj.update:
      id: "grp_meat_present"
      hidden: !lambda "return !id(grill_cook_main)->meat_probe_present();"
  - lvgl.label.update:
      id: "lbl_meat_hint"
      hidden: !lambda "return id(grill_cook_main)->meat_probe_present();"
  - if:
      condition:
        lambda: !lambda "return id(grill_cook_main)->meat_probe_present();"
      then:
      - lvgl.label.update:
          id: "lbl_meat_temp"
          text: !lambda |-
            char buf[24];
            snprintf(buf, sizeof(buf), "%.1f", id(grill_cook_main)->meat_temperature());
            return std::string(buf);
      - lvgl.label.update:
          id: "lbl_meat_target"
          text: !lambda |-
            char buf[24];
            snprintf(buf, sizeof(buf), "${i18n.grilldisplay[language].ui_target_format}",
                     id(target_meat_core_temperature).state);
            if (id(ui_level) == 3 && id(ui_panel) == 2)
              return "< " + std::string(buf) + " >";
            return std::string(buf);
      - if:
          condition:
            lambda: !lambda "return id(ui_level) >= 2 && id(ui_panel) == 2 && id(ui_item) == 1;"
          then:
          - lvgl.label.update:
              id: "lbl_meat_target"
              bg_opa: "COVER"
              bg_color: "color_ink"
              text_color: "color_paper"
          else:
          - lvgl.label.update:
              id: "lbl_meat_target"
              bg_opa: "TRANSP"
              text_color: "color_ink"
      - lvgl.label.update:
          id: "lbl_meat_rate"
          text: !lambda |-
            const float rate = id(grill_cook_main)->meat_rate();
            char buf[24];
            if (std::isnan(rate)) {
              snprintf(buf, sizeof(buf), "--");
            } else {
              snprintf(buf, sizeof(buf), "%+.2f °C/min", rate);
            }
            return std::string(buf);
      - lvgl.label.update:
          id: "lbl_meat_phase"
          text: !lambda |-
            switch (id(grill_cook_main)->phase()) {
              case grill_cook::Phase::IDLE:
                return std::string("${i18n.grilldisplay[language].ui_phase_idle}");
              case grill_cook::Phase::GRILLING:
                return std::string("${i18n.grilldisplay[language].ui_phase_grilling}");
              case grill_cook::Phase::COOKING:
                return std::string("${i18n.grilldisplay[language].ui_phase_cooking}");
              case grill_cook::Phase::STALLED:
                return std::string("${i18n.grilldisplay[language].ui_phase_stalled}");
              case grill_cook::Phase::DONE:
                return std::string("${i18n.grilldisplay[language].ui_phase_done}");
              default:
                return std::string("");
            }
      - lvgl.label.update:
          id: "lbl_meat_done"
          hidden: !lambda "return id(grill_cook_main)->eta_clock().empty();"
          text: !lambda |-
            const std::string eta = id(grill_cook_main)->eta_clock();
            if (eta.empty())
              return std::string("");
            char buf[24];
            snprintf(buf, sizeof(buf), "${i18n.grilldisplay[language].ui_done_format}", eta.c_str());
            return std::string(buf);
      - lvgl.label.update:
          id: "lbl_meat_remaining"
          hidden: !lambda "return id(grill_cook_main)->remaining_minutes() < 0;"
          text: !lambda |-
            const int remaining = id(grill_cook_main)->remaining_minutes();
            if (remaining < 0)
              return std::string("");
            char buf[24];
            snprintf(buf, sizeof(buf), "${i18n.grilldisplay[language].ui_remaining_format}", remaining / 60, remaining % 60);
            return std::string(buf);
