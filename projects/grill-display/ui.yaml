font:
- file: "gfonts://Roboto@400"
  id: "font_label"
  size: 14
  glyphsets: ["GF_Latin_Core"]
  ignore_missing_glyphs: true
- file: "gfonts://Roboto@400"
  id: "font_text"
  size: 20
  glyphsets: ["GF_Latin_Core"]
  ignore_missing_glyphs: true
- file: "gfonts://Squada One"
  id: "font_medium"
  size: 35
- file: "gfonts://Squada One"
  id: "font_hero"
  size: 106
  glyphs:
  - "0123456789.-+:%C°"
- file: "gfonts://Squada One"
  id: "font_dial"
  size: 29
  glyphs:
  - "0123456789"
- file: "gfonts://Roboto Condensed@700"
  id: "font_compass"
  size: 26
  glyphs:
  - "NESW"
- file: "gfonts://Squada One"
  id: "font_wind"
  size: 44
  glyphs:
  - "0123456789-"

color:
- id: "color_ink"
  hex: "FFFFFF"
# The panel driver inverts colors, so white renders as black ink on paper.
- id: "color_paper"
  hex: "000000"

lvgl:
  on_draw_end:
  - script.execute: "ui_refresh"
  displays:
  - "cp579epd_display"
  buffer_size: "12%"
  log_level: "info"
  bg_color: "color_paper"
  theme:
    label:
      text_color: "color_ink"

script:
- id: "ui_refresh"
  mode: "restart"
  then:
  - delay: !lambda "return id(ui_input_pending) ? 50 : 1000;"
  - lambda: !lambda |-
      id(ui_input_pending) = false;
  - component.update: "cp579epd_display"

- id: "ui_refresh_full"
  then:
  - lambda: !lambda |-
      #ifndef USE_HOST
      id(cp579epd_display)->request_full_update();
      #endif
  - lambda: !lambda |-
      lv_obj_invalidate(lv_screen_active());

- id: "ui_select_page"
  mode: "restart"
  then:
  - if:
      condition:
        lambda: !lambda |-
          return id(ui_level) > 0 || id(grill_cook_main)->is_cooking() ||
                 id(grill_cook_main)->zone_on(grill_cook::Zone::WEST) ||
                 id(grill_cook_main)->zone_on(grill_cook::Zone::EAST);
      then:
      - if:
          condition:
            not:
              lvgl.page.is_showing: "ui_page_cook"
          then:
          - lvgl.page.show: "ui_page_cook"
          - script.execute: "light_on"
      - script.execute: "ui_cook_update"
      - lambda: !lambda |-
          id(ui_asleep) = false;
      - script.execute: "ui_activity"
      else:
      - if:
          condition:
            lambda: !lambda |-
              if (!id(sleep_enabled).state)
                return false;
              const uint32_t now_s = millis_64() / 1000;
              if (now_s - id(ui_last_activity) < (uint32_t) id(sleep_hold).state * 60)
                return false;
              if (api::global_api_server->is_connected() && id(ha_terrace_presence).has_state())
                return !id(ha_terrace_presence).state;
              const auto now = id(base_homeassistant_time).now();
              if (!now.is_valid())
                return false;
              const int minute = now.hour * 60 + now.minute;
              const int start = id(sleep_fallback_start).hour * 60 + id(sleep_fallback_start).minute;
              const int end = id(sleep_fallback_end).hour * 60 + id(sleep_fallback_end).minute;
              return start <= end ? (minute >= start && minute < end) : (minute >= start || minute < end);
          then:
          - if:
              condition:
                not:
                  lvgl.page.is_showing: "ui_page_sleep"
              then:
              - lvgl.page.show: "ui_page_sleep"
              - script.execute: "light_off"
              - script.execute: "ui_refresh_full"
              - lambda: !lambda |-
                  id(ui_asleep) = true;
          else:
          - lambda: !lambda |-
              id(ui_asleep) = false;
          - if:
              condition:
                not:
                  lvgl.page.is_showing: "ui_page_idle"
              then:
              - lvgl.page.show: "ui_page_idle"
              - script.execute: "light_off"
              - script.execute: "ui_refresh_full"
          - script.execute: "ui_idle_update"

esphome:
  on_boot:
    priority: -100
    then:
    - script.execute: "ui_select_page"

interval:
- interval: "10min"
  then:
  - if:
      condition:
        and:
        - lvgl.page.is_showing: "ui_page_cook"
        - lambda: !lambda "return id(ui_level) <= 1;"
      then:
      - script.execute: "ui_refresh_full"
