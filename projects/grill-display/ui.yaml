font:
- file: "gfonts://Roboto@400"
  id: "font_label"
  size: 14
  glyphsets: ["GF_Latin_Core"]
  ignore_missing_glyphs: true
- file: "gfonts://Roboto@400"
  id: "font_text"
  size: 20
  glyphsets: ["GF_Latin_Core"]
  ignore_missing_glyphs: true
- file: "gfonts://Roboto Condensed@700"
  id: "font_medium"
  size: 32
- file: "gfonts://Roboto Condensed@700"
  id: "font_hero"
  size: 96
  glyphs:
  - "0123456789.-+:%C°"
- file: "gfonts://Roboto Condensed@700"
  id: "font_dial"
  size: 26
  glyphs:
  - "0123456789"
- file: "gfonts://Roboto Condensed@700"
  id: "font_wind"
  size: 40
  glyphs:
  - "0123456789-"

color:
- id: "color_ink"
  hex: "FFFFFF"
# The panel driver inverts colors, so white renders as black ink on paper.
- id: "color_paper"
  hex: "000000"

lvgl:
  displays:
  - "cp579epd_display"
  buffer_size: "12%"
  log_level: "info"
  bg_color: "color_paper"
  theme:
    label:
      text_color: "color_ink"

script:
- id: "ui_refresh"
  mode: "restart"
  then:
  - delay: "500ms"
  - component.update: "cp579epd_display"

- id: "ui_refresh_full"
  then:
  - lambda: |-
      #ifndef USE_HOST
      id(cp579epd_display)->request_full_update();
      #endif
  - script.execute: "ui_refresh"

- id: "ui_select_page"
  mode: "restart"
  then:
  - if:
      condition:
        lambda: "return id(ui_level) > 0 || id(grill_cook_main)->is_cooking();"
      then:
      - if:
          condition:
            not:
              lvgl.page.is_showing: "ui_page_cook"
          then:
          - lvgl.page.show: "ui_page_cook"
      - script.execute: "ui_cook_update"
      else:
      - if:
          condition:
            not:
              lvgl.page.is_showing: "ui_page_idle"
          then:
          - lvgl.page.show: "ui_page_idle"
      - script.execute: "ui_idle_update"

esphome:
  on_boot:
    priority: -100
    then:
    - script.execute: "ui_select_page"
