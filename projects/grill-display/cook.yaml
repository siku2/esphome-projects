number:
- id: "target_meat_core_temperature"
  name: "${i18n.grilldisplay[language].grill_target_temperature}"
  platform: "template"
  optimistic: true
  restore_value: true
  initial_value: 93
  min_value: 40
  max_value: 300
  step: 0.5
  mode: "box"

event:
- id: "grill_event"
  name: "${i18n.grilldisplay[language].grill_event}"
  platform: "template"
  event_types:
  - "started"
  - "done"
  - "stalled"
  - "ended"

grill_cook:
  id: "grill_cook_main"
  time_id: "base_homeassistant_time"
  update_interval: "5s"
  zones:
    west:
      climate: "climate_west"
      probe: "probe_west_temperature"
    east:
      climate: "climate_east"
      probe: "probe_east_temperature"
  meat_probe: "probe_meat_temperature"
  meat_target: "target_meat_core_temperature"
  phase:
    name: "${i18n.grilldisplay[language].grill_phase}"
  meat_rate:
    name: "${i18n.grilldisplay[language].grill_meat_rate}"
  eta:
    name: "${i18n.grilldisplay[language].grill_eta}"
  remaining_minutes:
    name: "${i18n.grilldisplay[language].grill_remaining_minutes}"
  on_cook_started:
  - event.trigger:
      id: "grill_event"
      event_type: "started"
  - if:
      condition:
        lambda: "return id(ui_level) == 0;"
      then:
      - lambda: |-
          id(ui_panel_enter)->execute();
      - script.execute: "ui_timeout_item"
      - script.execute: "ui_timeout_panel"
  - script.execute: "ui_select_page"
  on_cook_ended:
  - event.trigger:
      id: "grill_event"
      event_type: "ended"
  - script.execute: "ui_timeout_panel"
  - script.execute: "ui_select_page"
  on_zone_presence:
  - script.execute:
      id: "ui_panel_move"
      step: 0
  - lambda: |-
      const bool east = id(grill_cook_main)->zone_present(grill_cook::Zone::EAST);
      const bool west = id(grill_cook_main)->zone_present(grill_cook::Zone::WEST);
      if (id(ui_level) >= 1 && ((id(ui_panel) == 0 && !east) || (id(ui_panel) == 1 && !west))) {
        id(ui_panel_enter)->execute();
      }
  - script.execute: "ui_select_page"
  - if:
      condition:
        lvgl.page.is_showing: "ui_page_cook"
      then:
      - script.execute: "ui_refresh_full"
  on_phase:
  - if:
      condition:
        lambda: "return x == \"done\" || x == \"stalled\";"
      then:
      - event.trigger:
          id: "grill_event"
          event_type: !lambda "return x;"
  - script.execute: "ui_cook_update"
