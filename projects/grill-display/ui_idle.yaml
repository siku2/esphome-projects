globals:
- id: "wind_ux"
  type: "float"
  restore_value: no
  initial_value: "0.0f"
- id: "wind_uy"
  type: "float"
  restore_value: no
  initial_value: "1.0f"
- id: "wind_vx"
  type: "float"
  restore_value: no
  initial_value: "1.0f"
- id: "wind_vy"
  type: "float"
  restore_value: no
  initial_value: "0.0f"

lvgl:
  pages:
  - id: "ui_page_idle"
    widgets:
    - obj:
        width: 792
        height: 272
        pad_all: 0
        border_width: 0
        bg_color: "color_paper"
        widgets:
        - meter:
            id: "lvgl_meter_time"
            x: 30
            y: 26
            width: 220
            height: 220
            pad_all: 0
            bg_opa: "TRANSP"
            border_width: 0
            text_color: "color_ink"
            ticks:
              text_font: "font_dial"
            scales:
            - range_from: 0 # minutes scale
              range_to: 60
              angle_range: 360
              rotation: 270
              ticks:
                width: 3
                count: 61
                length: 10
                color: "color_ink"
              indicators:
              - line:
                  id: "lvgl_minute_hand"
                  width: 9
                  color: "color_ink"
                  length: 56%
                  value: 0
            - range_from: 1 # hours scale for labels
              range_to: 12
              angle_range: 330
              rotation: 300
              ticks:
                width: 1
                count: 12
                length: 1
                major:
                  stride: 1
                  width: 6
                  length: 14
                  color: "color_ink"
                  label_gap: 8
            - range_from: 0 # hi-res hours scale for hand
              range_to: 720
              angle_range: 360
              rotation: 270
              indicators:
              - line:
                  id: "lvgl_hour_hand"
                  width: 15
                  color: "color_ink"
                  length: 38%
                  value: 0

        - line:
            x: 272
            y: 26
            points:
            - x: 0
              y: 0
            - x: 0
              y: 220
            line_width: 1
            line_color: "color_ink"

        - line:
            x: 520
            y: 26
            points:
            - x: 0
              y: 0
            - x: 0
              y: 220
            line_width: 1
            line_color: "color_ink"

        - obj:
            x: 272
            y: 26
            width: 248
            height: 220
            pad_all: 0
            border_width: 0
            bg_opa: "TRANSP"
            scrollbar_mode: "OFF"
            widgets:
            - label:
                text: "${i18n.grilldisplay[language].ui_solar_label}"
                text_font: "font_label"
                align: "TOP_MID"
            - obj:
                width: "SIZE_CONTENT"
                height: "SIZE_CONTENT"
                align: "TOP_MID"
                y: 2
                pad_all: 0
                border_width: 0
                bg_opa: "TRANSP"
                layout:
                  type: "flex"
                  flex_flow: "ROW"
                  flex_align_main: "CENTER"
                  flex_align_cross: "END"
                  pad_column: 4
                widgets:
                - label:
                    id: "lbl_solar_value"
                    text: "--"
                    text_font: "font_hero"
                - label:
                    id: "lbl_solar_unit"
                    text: ""
                    text_font: "font_text"
                    pad_bottom: 18
            - line:
                y: 104
                points:
                - x: 10
                  y: 0
                - x: 238
                  y: 0
                line_width: 1
                line_color: "color_ink"
            - label:
                text: "${i18n.grilldisplay[language].ui_outdoor_label}"
                text_font: "font_label"
                align: "TOP_MID"
                y: 110
            - obj:
                width: "SIZE_CONTENT"
                height: "SIZE_CONTENT"
                align: "TOP_MID"
                y: 110
                pad_all: 0
                border_width: 0
                bg_opa: "TRANSP"
                layout:
                  type: "flex"
                  flex_flow: "ROW"
                  flex_align_main: "CENTER"
                  flex_align_cross: "END"
                  pad_column: 4
                widgets:
                - label:
                    id: "lbl_outdoor_value"
                    text: "--"
                    text_font: "font_hero"
                - label:
                    text: "°C"
                    text_font: "font_text"
                    pad_bottom: 18

        - obj:
            x: 527
            y: 5
            width: 262
            height: 262
            pad_all: 0
            border_width: 0
            bg_opa: "TRANSP"
            scrollbar_mode: "OFF"
            widgets:
            - obj:
                x: 25
                y: 25
                width: 212
                height: 212
                pad_all: 0
                radius: 106
                border_width: 6
                border_color: "color_ink"
                bg_opa: "TRANSP"
                scrollbar_mode: "OFF"
            - meter:
                x: 31
                y: 31
                width: 200
                height: 200
                pad_all: 0
                bg_opa: "TRANSP"
                border_width: 0
                scales:
                - range_from: 0
                  range_to: 360
                  angle_range: 360
                  rotation: 270
                  ticks:
                    width: 10
                    count: 5
                    length: 16
                    color: "color_ink"
                - range_from: 0
                  range_to: 360
                  angle_range: 360
                  rotation: 315
                  ticks:
                    width: 6
                    count: 5
                    length: 10
                    color: "color_ink"
            - line:
                id: "line_wind_arrow"
                width: 262
                height: 262
                line_width: 12
                line_color: "color_ink"
                line_rounded: true
                points:
                - x: 131
                  y: 221
                - x: 131
                  y: 185
                - x: 111
                  y: 205
                - x: 131
                  y: 185
                - x: 151
                  y: 205
            - label:
                text: "S"
                text_font: "font_compass"
                align: "TOP_MID"
                y: -1
            - label:
                text: "N"
                text_font: "font_compass"
                align: "BOTTOM_MID"
                y: 1
            - label:
                text: "E"
                text_font: "font_compass"
                align: "LEFT_MID"
                x: 5
            - label:
                text: "W"
                text_font: "font_compass"
                align: "RIGHT_MID"
                x: -4
            - label:
                id: "lbl_wind_speed"
                text: "--"
                text_font: "font_wind"
                align: "CENTER"
                y: -19
            - label:
                text: "km/h"
                text_font: "font_label"
                align: "CENTER"
                y: 12
            - label:
                id: "lbl_wind_gust"
                text: "--"
                text_font: "font_label"
                align: "CENTER"
                y: 26

script:
- id: "ui_idle_update"
  mode: "restart"
  then:
  - if:
      condition:
        lambda: !lambda "return id(ui_asleep);"
      then:
      - script.stop: "ui_idle_update"
  - lambda: !lambda |-
      auto now = id(base_homeassistant_time).now();
      id(lvgl_minute_hand)->set_value(now.minute);
      id(lvgl_hour_hand)->set_value((now.hour % 12) * 60 + now.minute);
  - if:
      condition:
        lambda: !lambda "return std::isnan(id(ha_wind_bearing).state);"
      then:
      - lvgl.widget.hide: "line_wind_arrow"
      else:
      - lambda: !lambda |-
          float rad = id(ha_wind_bearing).state * 3.14159265f / 180.0f;
          id(wind_ux) = -sinf(rad);
          id(wind_uy) = cosf(rad);
          id(wind_vx) = cosf(rad);
          id(wind_vy) = sinf(rad);
      - lvgl.widget.show: "line_wind_arrow"
      - lvgl.line.update:
          id: "line_wind_arrow"
          points:
          - x: !lambda "return (int) (131 + id(wind_ux) * 90);"
            y: !lambda "return (int) (131 + id(wind_uy) * 90);"
          - x: !lambda "return (int) (131 + id(wind_ux) * 54);"
            y: !lambda "return (int) (131 + id(wind_uy) * 54);"
          - x: !lambda "return (int) (131 + id(wind_ux) * 74 + id(wind_vx) * 20);"
            y: !lambda "return (int) (131 + id(wind_uy) * 74 + id(wind_vy) * 20);"
          - x: !lambda "return (int) (131 + id(wind_ux) * 54);"
            y: !lambda "return (int) (131 + id(wind_uy) * 54);"
          - x: !lambda "return (int) (131 + id(wind_ux) * 74 - id(wind_vx) * 20);"
            y: !lambda "return (int) (131 + id(wind_uy) * 74 - id(wind_vy) * 20);"
  - lvgl.label.update:
      id: "lbl_solar_value"
      text: !lambda |-
        float w = id(ha_solar_power).state;
        char buf[16];
        if (std::isnan(w)) {
          snprintf(buf, sizeof(buf), "--");
        } else if (w >= 1000.0f) {
          snprintf(buf, sizeof(buf), "%.1f", w / 1000.0f);
        } else {
          snprintf(buf, sizeof(buf), "%.0f", w);
        }
        return std::string(buf);
  - lvgl.label.update:
      id: "lbl_solar_unit"
      text: !lambda |-
        float w = id(ha_solar_power).state;
        if (std::isnan(w)) {
          return std::string("");
        }
        return std::string(w >= 1000.0f ? "kW" : "W");
  - lvgl.label.update:
      id: "lbl_outdoor_value"
      text: !lambda |-
        float t = id(ha_outdoor_temperature).state;
        if (std::isnan(t)) {
          return std::string("--");
        }
        char buf[16];
        snprintf(buf, sizeof(buf), "%.1f", t);
        return std::string(buf);
  - lvgl.label.update:
      id: "lbl_wind_speed"
      text: !lambda |-
        float v = id(ha_wind_speed).state;
        if (std::isnan(v)) {
          return std::string("--");
        }
        char buf[16];
        snprintf(buf, sizeof(buf), "%.0f", v);
        return std::string(buf);
  - lvgl.label.update:
      id: "lbl_wind_gust"
      text: !lambda |-
        float v = id(ha_wind_gust).state;
        char buf[24];
        if (std::isnan(v)) {
          snprintf(buf, sizeof(buf), "${i18n.grilldisplay[language].ui_gust_label} --");
        } else {
          snprintf(buf, sizeof(buf), "${i18n.grilldisplay[language].ui_gust_label} %.0f", v);
        }
        return std::string(buf);
