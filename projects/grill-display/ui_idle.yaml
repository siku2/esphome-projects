globals:
- id: "wind_ux"
  type: "float"
  restore_value: no
  initial_value: "0.0f"
- id: "wind_uy"
  type: "float"
  restore_value: no
  initial_value: "-1.0f"
- id: "wind_vx"
  type: "float"
  restore_value: no
  initial_value: "1.0f"
- id: "wind_vy"
  type: "float"
  restore_value: no
  initial_value: "0.0f"

lvgl:
  pages:
  - id: "ui_page_idle"
    widgets:
    - obj:
        width: 792
        height: 272
        pad_all: 0
        border_width: 0
        bg_color: "color_paper"
        widgets:
        - meter:
            id: "lvgl_meter_time"
            x: 30
            y: 26
            width: 220
            height: 220
            pad_all: 0
            bg_opa: "TRANSP"
            border_width: 0
            text_color: "color_ink"
            ticks:
              text_font: "font_dial"
            scales:
            - range_from: 0 # minutes scale
              range_to: 60
              angle_range: 360
              rotation: 270
              ticks:
                width: 3
                count: 61
                length: 10
                color: "color_ink"
              indicators:
              - line:
                  id: "lvgl_minute_hand"
                  width: 9
                  color: "color_ink"
                  length: 56%
                  value: 0
            - range_from: 1 # hours scale for labels
              range_to: 12
              angle_range: 330
              rotation: 300
              ticks:
                width: 1
                count: 12
                length: 1
                major:
                  stride: 1
                  width: 6
                  length: 14
                  color: "color_ink"
                  label_gap: 8
            - range_from: 0 # hi-res hours scale for hand
              range_to: 720
              angle_range: 360
              rotation: 270
              indicators:
              - line:
                  id: "lvgl_hour_hand"
                  width: 15
                  color: "color_ink"
                  length: 38%
                  value: 0

        - line:
            x: 272
            y: 26
            points:
            - x: 0
              y: 0
            - x: 0
              y: 220
            line_width: 1
            line_color: "color_ink"

        - line:
            x: 520
            y: 26
            points:
            - x: 0
              y: 0
            - x: 0
              y: 220
            line_width: 1
            line_color: "color_ink"

        - obj:
            x: 272
            y: 26
            width: 248
            height: 220
            pad_all: 0
            border_width: 0
            bg_opa: "TRANSP"
            scrollbar_mode: "OFF"
            widgets:
            - label:
                text: "${i18n.grilldisplay[language].ui_solar_label}"
                text_font: "font_label"
                align: "TOP_MID"
            - obj:
                width: "SIZE_CONTENT"
                height: "SIZE_CONTENT"
                align: "TOP_MID"
                y: 2
                pad_all: 0
                border_width: 0
                bg_opa: "TRANSP"
                layout:
                  type: "flex"
                  flex_flow: "ROW"
                  flex_align_main: "CENTER"
                  flex_align_cross: "END"
                  pad_column: 4
                widgets:
                - label:
                    id: "lbl_solar_value"
                    text: "--"
                    text_font: "font_hero"
                - label:
                    id: "lbl_solar_unit"
                    text: ""
                    text_font: "font_text"
                    pad_bottom: 18
            - line:
                y: 104
                points:
                - x: 10
                  y: 0
                - x: 238
                  y: 0
                line_width: 1
                line_color: "color_ink"
            - label:
                text: "${i18n.grilldisplay[language].ui_outdoor_label}"
                text_font: "font_label"
                align: "TOP_MID"
                y: 110
            - obj:
                width: "SIZE_CONTENT"
                height: "SIZE_CONTENT"
                align: "TOP_MID"
                y: 110
                pad_all: 0
                border_width: 0
                bg_opa: "TRANSP"
                layout:
                  type: "flex"
                  flex_flow: "ROW"
                  flex_align_main: "CENTER"
                  flex_align_cross: "END"
                  pad_column: 4
                widgets:
                - label:
                    id: "lbl_outdoor_value"
                    text: "--"
                    text_font: "font_hero"
                - label:
                    text: "°C"
                    text_font: "font_text"
                    pad_bottom: 18

        - obj:
            x: 537
            y: 26
            width: 220
            height: 220
            pad_all: 0
            border_width: 0
            bg_opa: "TRANSP"
            widgets:
            - meter:
                id: "lvgl_meter_compass"
                x: 20
                y: 20
                width: 180
                height: 180
                pad_all: 0
                bg_opa: "TRANSP"
                border_width: 0
                text_color: "color_ink"
                scales:
                - range_from: 0
                  range_to: 360
                  angle_range: 360
                  rotation: 270
                  ticks:
                    width: 3
                    count: 37
                    length: 6
                    color: "color_ink"
                - range_from: 0 # cardinal ticks
                  range_to: 360
                  angle_range: 360
                  rotation: 270
                  ticks:
                    width: 6
                    count: 5
                    length: 10
                    color: "color_ink"
            # Shaft + chevron in one polyline: tail at the rim, tip toward centre.
            - line:
                id: "line_wind_arrow"
                width: 220
                height: 220
                line_width: 10
                line_color: "color_ink"
                line_rounded: true
                points:
                - x: 110
                  y: 38
                - x: 110
                  y: 58
                - x: 122
                  y: 44
                - x: 110
                  y: 58
                - x: 98
                  y: 44
            - label:
                text: "N"
                text_font: "font_label"
                align: "TOP_MID"
                y: 0
            - label:
                text: "E"
                text_font: "font_label"
                align: "RIGHT_MID"
                x: -3
            - label:
                text: "S"
                text_font: "font_label"
                align: "BOTTOM_MID"
                y: 0
            - label:
                text: "W"
                text_font: "font_label"
                align: "LEFT_MID"
                x: 3
            - label:
                id: "lbl_wind_speed"
                text: "--"
                text_font: "font_wind"
                align: "CENTER"
                y: -19
            - label:
                text: "km/h"
                text_font: "font_label"
                align: "CENTER"
                y: 12
            - label:
                id: "lbl_wind_gust"
                text: "--"
                text_font: "font_label"
                align: "CENTER"
                y: 26

script:
- id: "ui_idle_update"
  mode: "restart"
  then:
  - lambda: |-
      const uint32_t five_minutes = 5 * 60;
      const uint32_t twelve_hours = 12 * 60 * 60;
      auto now = id(base_homeassistant_time).now();
      uint32_t seconds = now.second + 60 * now.minute + 3600 * now.hour;
      seconds = (seconds + five_minutes / 2) / five_minutes * five_minutes;
      id(lvgl_minute_hand)->set_value((seconds % 3600) / 60.0);
      id(lvgl_hour_hand)->set_value((seconds % twelve_hours) / 60.0);
  - if:
      condition:
        lambda: "return std::isnan(id(ha_wind_bearing).state);"
      then:
      - lvgl.widget.hide: "line_wind_arrow"
      else:
      - lambda: |-
          float rad = id(ha_wind_bearing).state * 3.14159265f / 180.0f;
          id(wind_ux) = sinf(rad);
          id(wind_uy) = -cosf(rad);
          id(wind_vx) = cosf(rad);
          id(wind_vy) = sinf(rad);
      - lvgl.widget.show: "line_wind_arrow"
      - lvgl.line.update:
          id: "line_wind_arrow"
          points:
          - x: !lambda "return (int) (110 + id(wind_ux) * 72);"
            y: !lambda "return (int) (110 + id(wind_uy) * 72);"
          - x: !lambda "return (int) (110 + id(wind_ux) * 52);"
            y: !lambda "return (int) (110 + id(wind_uy) * 52);"
          - x: !lambda "return (int) (110 + id(wind_ux) * 66 + id(wind_vx) * 12);"
            y: !lambda "return (int) (110 + id(wind_uy) * 66 + id(wind_vy) * 12);"
          - x: !lambda "return (int) (110 + id(wind_ux) * 52);"
            y: !lambda "return (int) (110 + id(wind_uy) * 52);"
          - x: !lambda "return (int) (110 + id(wind_ux) * 66 - id(wind_vx) * 12);"
            y: !lambda "return (int) (110 + id(wind_uy) * 66 - id(wind_vy) * 12);"
  - lvgl.label.update:
      id: "lbl_solar_value"
      text: !lambda |-
        float w = id(ha_solar_power).state;
        char buf[16];
        if (std::isnan(w)) {
          snprintf(buf, sizeof(buf), "--");
        } else if (w >= 1000.0f) {
          snprintf(buf, sizeof(buf), "%.1f", w / 1000.0f);
        } else {
          snprintf(buf, sizeof(buf), "%.0f", w);
        }
        return std::string(buf);
  - lvgl.label.update:
      id: "lbl_solar_unit"
      text: !lambda |-
        float w = id(ha_solar_power).state;
        if (std::isnan(w)) {
          return std::string("");
        }
        return std::string(w >= 1000.0f ? "kW" : "W");
  - lvgl.label.update:
      id: "lbl_outdoor_value"
      text: !lambda |-
        float t = id(ha_outdoor_temperature).state;
        if (std::isnan(t)) {
          return std::string("--");
        }
        char buf[16];
        snprintf(buf, sizeof(buf), "%.1f", t);
        return std::string(buf);
  - lvgl.label.update:
      id: "lbl_wind_speed"
      text: !lambda |-
        float v = id(ha_wind_speed).state;
        if (std::isnan(v)) {
          return std::string("--");
        }
        char buf[16];
        snprintf(buf, sizeof(buf), "%.0f", v);
        return std::string(buf);
  - lvgl.label.update:
      id: "lbl_wind_gust"
      text: !lambda |-
        float v = id(ha_wind_gust).state;
        char buf[24];
        if (std::isnan(v)) {
          snprintf(buf, sizeof(buf), "${i18n.grilldisplay[language].ui_gust_label} --");
        } else {
          snprintf(buf, sizeof(buf), "${i18n.grilldisplay[language].ui_gust_label} %.0f", v);
        }
        return std::string(buf);
  - if:
      condition:
        lvgl.page.is_showing: "ui_page_idle"
      then:
      - script.execute: "ui_refresh"
