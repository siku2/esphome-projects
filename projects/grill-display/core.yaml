substitutions:
  api_encryption_key: !secret api_encryption_key
  ota_password: !secret ota_password

  name: "grill-display"
  friendly_name: "Grill Display"
  language: "en"
  translation:
    de: !include translations/de.yaml
    en: !include translations/en.yaml

packages:
  base: !include
    file: ../../packages/base.yaml
  crowpanel_5_79in_epaper: !include
    file: ../../packages/crowpanel_5_79in_epaper.yaml

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true
  project:
    name: "siku2.grill-display"
    version: "0.1.0"

dashboard_import:
  package_import_url: "github://siku2/esphome-projects/projects/grill-display/core.yaml@main"
  import_full_config: false

external_components:
- source:
    type: local
    path: ../../components
  components: [ "grill_thermal_model" ]

logger:
  logs:
    max31855: "INFO"
  hardware_uart: "UART0"

api:
  encryption:
    key: "${api_encryption_key}"

ota:
- platform: "esphome"
  password: "${ota_password}"

spi:
  miso_pin: "GPIO18"
  clk_pin: "GPIO19"

sensor:
- &probe_west_temperature_raw
  id: "probe_west_temperature_raw"
  internal: true
  filters:
  - round: 1
  # Don't report error values (they happen fairly often)
  - filter_out: "NaN"
  # Only resort to NaN after 5s of no new value
  - timeout: "5s"
  - delta: 0.5
  # If the value doesn't change still emit a value every 5s
  - timeout:
      timeout: "5s"
      value: "last"
  on_value:
    then:
    - lambda: !lambda |
        id(probe_west_temperature_public)->publish_state(x);
    - lambda: !lambda |
        if (id(grill_active_side).current_option() == "west") {
          id(grill_selected_grill_temperature).publish_state(x);
        }
  platform: "max31855"
  update_interval: "500ms"
  cs_pin: "GPIO20"

- <<: *probe_west_temperature_raw
  id: "probe_east_temperature_raw"
  name: "${translation[language].probe_east_temperature_raw}"
  on_value:
    then:
    - lambda: !lambda |
        id(probe_east_temperature_public)->publish_state(x);
    - lambda: !lambda |
        if (id(grill_active_side).current_option() == "east") {
          id(grill_selected_grill_temperature).publish_state(x);
        }
  cs_pin: "GPIO38"

- <<: *probe_west_temperature_raw
  id: "probe_grey_temperature_raw"
  name: "${translation[language].probe_grey_temperature_raw}"
  on_value:
    then:
    - lambda: !lambda |
        id(probe_grey_temperature_public)->publish_state(x);
  cs_pin: "GPIO21"

# Public temperature sensors exposed to HA

- &probe_west_temperature_public
  id: "probe_west_temperature_public"
  name: "${translation[language].probe_west_temperature_public}"
  unit_of_measurement: "°C"
  device_class: "temperature"
  state_class: "measurement"
  accuracy_decimals: 0
  filters:
  - delta: 0.5
  platform: "template"
  update_interval: "never"

- <<: *probe_west_temperature_public
  id: "probe_east_temperature_public"
  name: "${translation[language].probe_east_temperature_public}"

- <<: *probe_west_temperature_public
  id: "probe_grey_temperature_public"
  name: "${translation[language].probe_grey_temperature_public}"

- platform: "template"
  id: "grill_selected_grill_temperature"
  internal: true
  update_interval: "never"

time:
- id: !extend "base_homeassistant_time"
  on_time_sync:
    then:
    - script.execute: "update_display_time"
  on_time:
  # Every 5 minutes, offset by 2:30
  - seconds: "30"
    minutes: "2/5"
    then:
    - script.execute: "update_display_time"

font:
# gfonts://family[@weight]
- file: "gfonts://Roboto@400"
  id: "roboto_14"
  size: 14
- file: "gfonts://Roboto@400"
  id: "roboto_20"
  size: 30
- file: "gfonts://Roboto@700"
  id: "roboto_24_bold"
  size: 24

switch:
- &heater_east
  id: "heater_east"
  restore_mode: "ALWAYS_OFF"
  platform: "homeassistant"
  entity_id: "switch.on_off_light_31"

- <<: *heater_east
  id: "heater_west"
  entity_id: "switch.terrasse_grill_west"

select:
- platform: "template"
  id: "grill_active_side"
  name: "${translation[language].grill_side_selector}"
  optimistic: true
  restore_value: true
  initial_option: "west"
  options:
  - "east"
  - "west"
  set_action:
  - lambda: !lambda |
      float value;
      if (x == "east") {
        value = id(probe_east_temperature_raw).state;
      } else {
        value = id(probe_west_temperature_raw).state;
      }
      id(grill_selected_grill_temperature).publish_state(value);

number:
- platform: "template"
  id: "grill_target_temperature"
  name: "${translation[language].grill_target_temperature}"
  optimistic: true
  restore_value: true
  initial_value: 93
  min_value: 40
  max_value: 105
  step: 0.5
  mode: "box"

script:
- id: "update_display_time"
  mode: "single"
  then:
  - logger.log:
      level: "DEBUG"
      format: "Updating display time"
  - lambda: !lambda |
      const uint32_t five_minutes_in_seconds = 5 * 60;
      const uint32_t twelve_hours_in_seconds = 12 * 60 * 60;

      auto now = id(base_homeassistant_time).now();
      uint32_t seconds = now.second + 60 * now.minute + 3600 * now.hour;
      // Round to the nearest 5 minutes
      seconds = (seconds + five_minutes_in_seconds / 2) / five_minutes_in_seconds * five_minutes_in_seconds;

      auto meter_widget = id(lvgl_meter_time);

      lv_meter_set_indicator_value(meter_widget, id(lvgl_minute_hand), (seconds % 3600) / 60.0);
      // Only divide by 60 instead of 3600 because the hour hand is still resolved in minute resolution.
      lv_meter_set_indicator_value(meter_widget, id(lvgl_hour_hand), (seconds % twelve_hours_in_seconds) / 60.0);

  - component.update: "cp579epd_display"

color:
- id: "color_white"
  hex: "000000"
- id: "color_black"
  hex: "FFFFFF"

lvgl:
  displays:
  - "cp579epd_display"
  buffer_size: "12%"
  log_level: "info"
  theme:
    label:
      text_color: "color_black"
  bg_color: "color_white"

  pages:
  # ========== IDLE - CLOCK PAGE ==========
  - id: "lvgl_pg_clock"
    on_load:
      then:
      - logger.log:
          level: "DEBUG"
          format: "Clock page loaded"
    widgets:
    - obj:
        # clock container
        height: "SIZE_CONTENT"
        width: 240
        align: "CENTER"
        pad_all: 0
        border_width: 0
        bg_color: "color_white"
        widgets:
        - meter:
            id: "lvgl_meter_time"
            # clock face
            height: 220
            width: 220
            align: "CENTER"
            bg_opa: "TRANSP"
            border_width: 0
            text_color: "color_black"
            scales:
            - range_from: 0 # minutes scale
              range_to: 60
              angle_range: 360
              rotation: 270
              ticks:
                width: 1
                count: 61
                length: 10
                color: "color_black"
              indicators:
              - line:
                  id: "lvgl_minute_hand"
                  width: 3
                  color: "color_black"
                  r_mod: -4
                  value: 0
            - range_from: 1 # hours scale for labels
              range_to: 12
              angle_range: 330
              rotation: 300
              ticks:
                width: 1
                count: 12
                length: 1
                major:
                  stride: 1
                  width: 4
                  length: 10
                  color: "color_black"
                  label_gap: 12
            - range_from: 0 # hi-res hours scale for hand
              range_to: 720
              angle_range: 360
              rotation: 270
              ticks:
                count: 0
              indicators:
              - line:
                  id: "lvgl_hour_hand"
                  width: 5
                  color: "color_black"
                  r_mod: -30
                  value: 0

  # ========== COOKING DETAILS PAGE ==========
  - id: "lvgl_pg_cooking"
    on_load:
      then:
      - logger.log:
          level: "DEBUG"
          format: "Cooking page loaded"
    widgets:
    - obj:
        # Main container with grid layout
        width: 240
        height: 296
        pad_all: 2
        border_width: 0
        bg_color: "color_white"
        layout:
          type: grid
          grid_rows: [ "35px", "35px", "35px", "35px", "35px", "35px", "35px", "35px" ]
          grid_columns: [ "120px", "120px" ]
          pad_row: 2px
          pad_column: 2px
        widgets:
        # --- ROW 1: LEFT/RIGHT GRILL LABELS ---
        - label:
            text: "Left / East"
            text_font: "roboto_14"
            text_align: "CENTER"
            grid_cell_row_pos: 0
            grid_cell_column_pos: 0
            grid_cell_x_align: "CENTER"
        - label:
            text: "Right / West"
            text_font: "roboto_14"
            text_align: "CENTER"
            grid_cell_row_pos: 0
            grid_cell_column_pos: 1
            grid_cell_x_align: "CENTER"

        # --- ROW 2: LEFT/RIGHT GRILL TEMPERATURES ---
        - label:
            id: "lbl_east_temp"
            text: "--°C"
            text_font: "roboto_24_bold"
            text_align: "CENTER"
            grid_cell_row_pos: 1
            grid_cell_column_pos: 0
            grid_cell_x_align: "CENTER"
        - label:
            id: "lbl_west_temp"
            text: "--°C"
            text_font: "roboto_24_bold"
            text_align: "CENTER"
            grid_cell_row_pos: 1
            grid_cell_column_pos: 1
            grid_cell_x_align: "CENTER"

        # --- ROW 3: MEAT AND TARGET LABELS ---
        - label:
            text: "Meat"
            text_font: "roboto_14"
            text_align: "CENTER"
            grid_cell_row_pos: 2
            grid_cell_column_pos: 0
            grid_cell_x_align: "CENTER"
        - label:
            text: "Target"
            text_font: "roboto_14"
            text_align: "CENTER"
            grid_cell_row_pos: 2
            grid_cell_column_pos: 1
            grid_cell_x_align: "CENTER"

        # --- ROW 4: MEAT AND TARGET VALUES ---
        - label:
            id: "lbl_meat_temp"
            text: "--°C"
            text_font: "roboto_24_bold"
            text_align: "CENTER"
            grid_cell_row_pos: 3
            grid_cell_column_pos: 0
            grid_cell_x_align: "CENTER"
        - label:
            id: "lbl_target_temp"
            text: "--°C"
            text_font: "roboto_24_bold"
            text_align: "CENTER"
            grid_cell_row_pos: 3
            grid_cell_column_pos: 1
            grid_cell_x_align: "CENTER"

        # --- ROW 5: ACTIVE ZONE AND PHASE LABELS ---
        - label:
            text: "Zone"
            text_font: "roboto_14"
            text_align: "CENTER"
            grid_cell_row_pos: 4
            grid_cell_column_pos: 0
            grid_cell_x_align: "CENTER"
        - label:
            text: "Phase"
            text_font: "roboto_14"
            text_align: "CENTER"
            grid_cell_row_pos: 4
            grid_cell_column_pos: 1
            grid_cell_x_align: "CENTER"

        # --- ROW 6: ACTIVE ZONE AND PHASE VALUES ---
        - label:
            id: "lbl_active_side"
            text: "---"
            text_font: "roboto_20"
            text_align: "CENTER"
            grid_cell_row_pos: 5
            grid_cell_column_pos: 0
            grid_cell_x_align: "CENTER"
        - label:
            id: "lbl_cook_phase"
            text: "---"
            text_font: "roboto_14"
            text_align: "CENTER"
            long_mode: "WRAP"
            grid_cell_row_pos: 5
            grid_cell_column_pos: 1
            grid_cell_x_align: "CENTER"

        # --- ROW 7: FINISH/PULL LABELS ---
        - label:
            text: "Finish"
            text_font: "roboto_14"
            text_align: "CENTER"
            grid_cell_row_pos: 6
            grid_cell_column_pos: 0
            grid_cell_x_align: "CENTER"
        - label:
            id: "lbl_secondary_label"
            text: "Pull"
            text_font: "roboto_14"
            text_align: "CENTER"
            grid_cell_row_pos: 6
            grid_cell_column_pos: 1
            grid_cell_x_align: "CENTER"

        # --- ROW 8: FINISH/PULL VALUES ---
        - label:
            id: "lbl_finish_time"
            text: "---"
            text_font: "roboto_20"
            text_align: "CENTER"
            grid_cell_row_pos: 7
            grid_cell_column_pos: 0
            grid_cell_x_align: "CENTER"
        - label:
            id: "lbl_secondary_time"
            text: "---"
            text_font: "roboto_20"
            text_align: "CENTER"
            grid_cell_row_pos: 7
            grid_cell_column_pos: 1
            grid_cell_x_align: "CENTER"

output:
- &heater_east_float
  id: "heater_east_float"
  platform: "template"
  type: "float"
  write_action:
  - lambda: !lambda |
      auto sw = id(heater_east);
      if (state > 0.5) {
        sw->turn_on();
      } else {
        sw->turn_off();
      }

- <<: *heater_east_float
  id: heater_west_float
  write_action:
  - lambda: !lambda |
      auto sw = id(heater_west);
      if (state > 0.5) {
        sw->turn_on();
      } else {
        sw->turn_off();
      }

climate:
- &climate_pid_east
  id: "climate_pid_east"
  name: "${translation[language].climate_pid_east}"
  visual:
    min_temperature: 40
    max_temperature: 300
    temperature_step: 5
  platform: "pid"
  sensor: "probe_east_temperature_raw"
  default_target_temperature: 0.0
  heat_output: "heater_east_float"
  control_parameters:
    kp: 0.02829
    ki: 0.00016
    kd: 1.21726

- <<: *climate_pid_east
  id: "climate_pid_west"
  name: "${translation[language].climate_pid_west}"
  sensor: "probe_west_temperature_raw"
  heat_output: "heater_west_float"

grill_thermal_model:
  id: "grill_thermal_model_main"
  time_id: "base_homeassistant_time"
  grill_probe: "grill_selected_grill_temperature"
  meat_probe: "probe_grey_temperature_raw"
  target_number: "grill_target_temperature"
  rest_duration_min: 30
  finish_time:
    id: "grill_finish_time"
    name: "${translation[language].grill_finish_time}"
  pull_time:
    id: "grill_pull_time"
    name: "${translation[language].grill_pull_time}"
  rest_end_time:
    id: "grill_rest_end_time"
    name: "${translation[language].grill_rest_end_time}"
  rest_remaining_min:
    id: "grill_rest_remaining_min"
    name: "${translation[language].grill_rest_remaining_min}"
    accuracy_decimals: 0
  cook_phase:
    id: "grill_cook_phase"
    name: "${translation[language].grill_cook_phase}"
    filters:
    - lambda: !lambda |
        if (x == "IDLE") return std::string("${translation[language].grill_phase_idle}");
        if (x == "LEARNING") return std::string("${translation[language].grill_phase_learning}");
        if (x == "ACTIVE") return std::string("${translation[language].grill_phase_active}");
        if (x == "STALL") return std::string("${translation[language].grill_phase_stall}");
        if (x == "STRETCH") return std::string("${translation[language].grill_phase_stretch}");
        if (x == "PULL") return std::string("${translation[language].grill_phase_pull}");
        if (x == "RESTING") return std::string("${translation[language].grill_phase_resting}");
        if (x == "PAUSE") return std::string("${translation[language].grill_phase_pause}");
        return x;
  thermal_mass_index:
    id: "grill_thermal_mass_index"
    name: "${translation[language].grill_thermal_mass_index}"
    accuracy_decimals: 2
    on_value:
    - if:
        condition:
          lambda: return x != 0.0; # Any value means not idle
        then:
        # Page switch will be handled by interval automation
        - logger.log:
            level: "DEBUG"
            format: "Thermal mass: %.2f"
            args: [ "x" ]

interval:
# Update cooking display every 1.5 seconds when grill is running
- interval: 1.5s
  then:
  - if:
      condition:
        lambda: return id(grill_cook_phase).state == "${translation[language].grill_phase_idle}";
      then:
      - lvgl.page.show: "lvgl_pg_clock"
      else:
      - lvgl.page.show: "lvgl_pg_cooking"
      - lvgl.label.update:
          id: "lbl_east_temp"
          text:
            format: "%.0f°C"
            args: [ "id(probe_east_temperature_public).state" ]
      - lvgl.label.update:
          id: "lbl_west_temp"
          text:
            format: "%.0f°C"
            args: [ "id(probe_west_temperature_public).state" ]
      - lvgl.label.update:
          id: "lbl_meat_temp"
          text:
            format: "%.0f°C"
            args: [ "id(probe_grey_temperature_public).state" ]
      - lvgl.label.update:
          id: "lbl_target_temp"
          text:
            format: "%.1f°C"
            args: [ "id(grill_target_temperature).state" ]
      - lvgl.label.update:
          id: "lbl_active_side"
          text: !lambda |-
            return id(grill_active_side).current_option() == "east" ? std::string("Left") : std::string("Right");
      - lvgl.label.update:
          id: "lbl_cook_phase"
          text: !lambda return id(grill_cook_phase).state;
      - lvgl.label.update:
          id: "lbl_finish_time"
          text: !lambda return id(grill_finish_time).state;
      - if:
          condition:
            lambda: return id(grill_cook_phase).state == "${translation[language].grill_phase_resting}";
          then:
          - lvgl.label.update:
              id: "lbl_secondary_label"
              text: "Rest"
          - lvgl.label.update:
              id: "lbl_secondary_time"
              text:
                format: "%.0f min"
                args: [ "id(grill_rest_remaining_min).state" ]
          else:
          - lvgl.label.update:
              id: "lbl_secondary_label"
              text: "Pull"
          - lvgl.label.update:
              id: "lbl_secondary_time"
              text: !lambda return id(grill_pull_time).state;
