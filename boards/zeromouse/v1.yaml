# ZeroMOUSE V1
#
# See `common.yaml` for the shared hardware.
#
# ## Variables
#
# ## Namespace
#
# `zm`
#
# ## Components
#
# ### Binary Sensor
#
# - `zm_pir`: PIR motion sensor (AS312).
#
# ### ZeroMOUSE Air
#
# - `zm_air`: IR proximity sensor (PT2046B).

substitutions:
  i18n:
    zm:
      de:
        motion: "Bewegung"

      en:
        motion: "Motion"

packages:
  zeromouse: !include common.yaml

external_components:
- source: "${components_source}"
  components: ["zeromouse_air"]

zeromouse_air:
  id: "zm_air"
  type: "pt2046b"
  adc_pin: "GPIO2"
  led_pin:
    number: "GPIO45"
    ignore_strapping_warning: true

binary_sensor:
- id: "zm_pir"
  name: "${i18n.zm[language].motion}"
  platform: "gpio"
  pin: "GPIO40"
  device_class: "motion"
