name: "Firmware"

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: "firmware-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  devices:
    name: "List devices"
    runs-on: "ubuntu-26.04"
    permissions:
      contents: "read"
    outputs:
      devices: "${{ steps.list.outputs.devices }}"
    steps:
    - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      with:
        persist-credentials: false
    - id: "list"
      run: |
        devices="$(find devices -maxdepth 1 -name '*.yaml' ! -name 'secrets.yaml' -printf '%f\n' \
          | sed 's/\.yaml$//' | sort | jq --raw-input --slurp --compact-output 'split("\n") | map(select(. != ""))')"
        echo "devices=${devices}" >> "${GITHUB_OUTPUT}"

  build:
    name: "Build ${{ matrix.device }}"
    needs: "devices"
    runs-on: "ubuntu-26.04"
    permissions:
      contents: "read"
    strategy:
      fail-fast: false
      matrix:
        device: "${{ fromJSON(needs.devices.outputs.devices) }}"
    env:
      DEVICE: "${{ matrix.device }}"
    steps:
    - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      with:
        persist-credentials: false
    - uses: "cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b" # 31.11.3
    # The ESPHome FHS environment runs in bubblewrap, which needs unprivileged user namespaces
    - run: "sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0"
    - uses: "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
      with:
        path: "~/.platformio"
        key: "platformio-${{ runner.os }}-${{ hashFiles('flake.lock') }}"
    - uses: "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
      with:
        path: "devices/.esphome"
        key: "esphome-${{ matrix.device }}-${{ hashFiles('flake.lock') }}-${{ github.sha }}"
        restore-keys: "esphome-${{ matrix.device }}-${{ hashFiles('flake.lock') }}-"
    - id: "version"
      run: |
        version="$(nix shell .#esphome --command .github/scripts/firmware-version.sh "${DEVICE}")"
        echo "version=${version}" >> "${GITHUB_OUTPUT}"
    - env:
        VERSION: "${{ steps.version.outputs.version }}"
      run: |
        nix shell .#esphome --command esphome -s firmware_version "${VERSION}" compile "devices/${DEVICE}.yaml"
        .github/scripts/package-firmware.sh "${DEVICE}" "${VERSION}" public
    - uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
      with:
        name: "firmware-${{ matrix.device }}"
        path: "public"
        if-no-files-found: "error"
        retention-days: 7

  deploy:
    name: "Publish to GitHub Pages"
    if: "github.event_name != 'pull_request' && github.ref == 'refs/heads/main'"
    needs: "build"
    runs-on: "ubuntu-26.04"
    # deploy-pages publishes the site and proves the run's identity with an OIDC token
    permissions:
      pages: "write"
      id-token: "write"
    environment:
      name: "github-pages"
      url: "${{ steps.deploy.outputs.page_url }}"
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
    - uses: "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
      with:
        pattern: "firmware-*"
        merge-multiple: true
        path: "public"
    - uses: "actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9" # v5.0.0
      with:
        path: "public"
    - id: "deploy"
      uses: "actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346" # v5.0.1
