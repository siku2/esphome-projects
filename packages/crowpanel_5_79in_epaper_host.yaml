display:
- id: "cp579epd_display"
  platform: "sdl"
  dimensions:
    width: 792
    height: 272

binary_sensor:
- &cp579epd_rotary_up
  id: "cp579epd_rotary_up"
  internal: true
  platform: "sdl"
  sdl_id: "cp579epd_display"
  key: "SDLK_UP"

- <<: *cp579epd_rotary_up
  id: "cp579epd_rotary_down"
  key: "SDLK_DOWN"

- <<: *cp579epd_rotary_up
  id: "cp579epd_rotary_press"
  key: "SDLK_RETURN"

- <<: *cp579epd_rotary_up
  id: "cp579epd_menu"
  key: "SDLK_TAB"

- <<: *cp579epd_rotary_up
  id: "cp579epd_exit"
  key: "SDLK_ESCAPE"

api:
  actions:
  - action: "press"
    variables:
      input: "string"
      hold_ms: "int"
    then:
    - lambda: |-
        id(cp579epd_pressed) = nullptr;
        if (input == "rotary_up") id(cp579epd_pressed) = id(cp579epd_rotary_up);
        if (input == "rotary_down") id(cp579epd_pressed) = id(cp579epd_rotary_down);
        if (input == "rotary_press") id(cp579epd_pressed) = id(cp579epd_rotary_press);
        if (input == "menu") id(cp579epd_pressed) = id(cp579epd_menu);
        if (input == "exit") id(cp579epd_pressed) = id(cp579epd_exit);
        if (id(cp579epd_pressed) != nullptr) id(cp579epd_pressed)->publish_state(true);
    - delay: !lambda "return hold_ms;"
    - lambda: |-
        if (id(cp579epd_pressed) != nullptr) id(cp579epd_pressed)->publish_state(false);

globals:
- id: "cp579epd_pressed"
  type: "binary_sensor::BinarySensor *"
  initial_value: "nullptr"
