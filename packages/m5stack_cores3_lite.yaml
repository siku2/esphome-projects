# M5Stack Cores3 Lite
#
# See: <https://docs.m5stack.com/en/core/CoreS3-Lite>
#
# ## Variables
#
# ## Namespace
#
# `m5s3l`
#
# ## Components
#
# ### AW9523
#
# - `m5s3l_aw9523`: The AW9523 I/O expander.
#
# ### Binary Sensor
#
# The following binary sensors are internal only:
#
# - `m5s3l_es_int`: AW9523 ES interrupt.
# - `m5s3l_tf_sw`: MicroSD card detection switch.
# - `m5s3l_lcd_touch_int`: LCD touch interrupt.
# - `m5s3l_aw_int`: AW9523 interrupt.
#
# ### Display
#
# - `m5s3l_lcd`: The built-in LCD display.
#
# ### I2C
#
# - `m5s3l_i2c`: The I2C bus.
#
# ### I2S Audio
#
# - `m5s3l_i2s_audio`: The I2S audio bus.
#
# ### Light
#
# - `m5s3l_lcd_backlight`: The LCD backlight control.
#
# ### Speaker
#
# - `m5s3l_speaker`: The built-in speaker.
#
# ### SPI
#
# - `m5s3l_spi`: The SPI bus.
#
# ### Switch
#
# - `m5s3l_lcd_backlight`: The LCD backlight control.
#
# ### Touchscreen
#
# - `m5s3l_touchscreen`: The built-in touchscreen.

packages:
  axp2101: !include axp2101.yaml

external_components:
- source: "github://siku2/esphome-projects@581beaecbea589caa5c336f5e7e3803f39e4303c"
  components: [ "aw9523" ]

esp32:
  board: "esp32-s3-devkitc-1"
  flash_size: "16MB"
  cpu_frequency: "240MHz"
  framework:
    type: "esp-idf"

psram:
  mode: "octal"
  speed: "80MHz"

aw9523:
- id: "m5s3l_aw9523"
  latch_inputs: true
  p0_push_pull: true

i2c:
- id: "m5s3l_i2c"
  sda: "GPIO12"
  scl: "GPIO11"
  scan: false
  frequency: "100kHz"

spi:
- id: "m5s3l_spi"
  clk_pin: "GPIO36"
  interface: "hardware"
  mosi_pin: "GPIO37"
  miso_pin:
    number: "GPIO35"
    allow_other_uses: true

binary_sensor:
- &m5s3l_es_int
  id: "m5s3l_es_int"
  internal: true
  name: "AW9523: ES Interrupt"
  entity_category: "DIAGNOSTIC"
  platform: "gpio"
  pin:
    aw9523: "m5s3l_aw9523"
    number: 3
    inverted: true # External pull-up

- <<: *m5s3l_es_int
  id: "m5s3l_tf_sw"
  internal: true
  name: "MicroSD Detected"
  pin:
    aw9523: "m5s3l_aw9523"
    number: 4
    inverted: true # External pull-up

- <<: *m5s3l_es_int
  id: "m5s3l_lcd_touch_int"
  internal: true
  name: "LCD Touch Interrupt"
  pin:
    aw9523: "m5s3l_aw9523"
    number: 10
    inverted: true # External pull-up
    # Forward the interrupt to GPIO21 so the touch screen works.
    forward_interrupt: true

- <<: *m5s3l_es_int
  id: "m5s3l_aw_int"
  internal: true
  name: "AW9523: AW Interrupt"
  pin:
    aw9523: "m5s3l_aw9523"
    number: 11
    inverted: true # External pull-up

