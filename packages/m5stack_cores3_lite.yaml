output:
# Actual responsive range of backlight is 60% to 100%
- id: !extend axp2101_dldo1
  min_power: "60%"
  zero_means_zero: true

light:
- id: "m5s3l_lcd_backlight"
  name: "LCD Backlight"
  default_transition_length: "0.25s"
  restore_mode: "RESTORE_DEFAULT_ON"
  entity_category: "CONFIG"
  platform: "monochromatic"
  output: "axp2101_dldo1"

i2s_audio:
- id: "m5s3l_i2s_audio"
  i2s_lrclk_pin: "GPIO33"
  i2s_bclk_pin: "GPIO34"

speaker:
- id: "m5s3l_speaker"
  platform: "i2s_audio"
  dac_type: "external"
  i2s_dout_pin: "GPIO14"
  i2s_audio_id: "m5s3l_i2s_audio"

display:
- id: "m5s3l_lcd"
  update_interval: "never"
  auto_clear_enabled: false
  platform: "mipi_spi"
  model: "ILI9341"
  dc_pin:
    number: "GPIO35"
    allow_other_uses: true
  reset_pin:
    aw9523: "m5s3l_aw9523"
    number: 9
  cs_pin:
    number: "GPIO3"
    ignore_strapping_warning: true
  dimensions: "320x240"
  invert_colors: true
  transform:
    swap_xy: false
    mirror_x: true
    mirror_y: true

touchscreen:
- id: "m5s3l_touchscreen"
  display: "m5s3l_lcd"
  transform:
    mirror_x: true
    mirror_y: true
    swap_xy: false
  update_interval: never
  platform: "ft63x6"
  reset_pin:
    aw9523: "m5s3l_aw9523"
    number: 0
  interrupt_pin:
    number: "GPIO21"
    mode: "INPUT_PULLUP"
