# M5Stack Cores3 Lite
#
# See: <https://docs.m5stack.com/en/core/CoreS3-Lite>
#
# ## Variables
#
# ## Namespace
#
# `m5s3l`
#
# ## Components
#
# ### Display
#
# - `m5s3l_lcd`: The built-in LCD display.
#
# ### Switch
#
# - `m5s3l_lcd_backlight`: The LCD backlight control.

packages:
  axp2101: !include axp2101.yaml


external_components:
- source: "github://jenscski/esphome-components@efb4437416376488b0ce841309b21583acd61fa7"
  components: [ "aw9523" ]

esp32:
  board: "esp32-s3-devkitc-1"
  flash_size: "16MB"
  cpu_frequency: "240MHz"
  framework:
    type: "esp-idf"

psram:
  mode: "octal"
  speed: "80MHz"

aw9523:
  id: "m5s3l_aw9523"

i2c:
  sda: "GPIO12"
  scl: "GPIO11"
  scan: false
  frequency: "100kHz"

spi:
  clk_pin: "GPIO36"
  interface: "hardware"
  mosi_pin: "GPIO37"
  miso_pin:
    number: "GPIO35"
    allow_other_uses: true

display:
- id: "m5s3l_lcd"
  update_interval: "1s"
  show_test_card: true
  platform: "mipi_spi"
  model: "ILI9341"
  dc_pin:
    number: "GPIO35"
    allow_other_uses: true
  reset_pin:
    aw9523:
      number: 9
  cs_pin:
    number: "GPIO3"
    ignore_strapping_warning: true
  dimensions: "320x240"
  invert_colors: true

# touchscreen:
# - display: "m5s3l_lcd"
#   platform: "ft63x6"
#   # TODO: we technically have an interrupt pin, but it goes through the io expander.
#   interrupt_pin: "GPIO21"

switch:
- id: "m5s3l_lcd_backlight"
  name: "LCD Backlight"
  restore_mode: "RESTORE_DEFAULT_ON"
  entity_category: "CONFIG"
  device_class: "switch"
  platform: "output"
  output: "axp2101_dldo1"
