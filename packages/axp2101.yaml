# AXP2101 Power Management IC
#
# See: <https://github.com/protoconcept/axp2101>
#
# ## Variables
#
# - `address`: I2C address of the motor driver. Default is `0x34`.
#
# ## Namespace
#
# `axp2101`
#
# ## Components
#
# ### Binary Sensor
#
# - `axp2101_current_limit_state`: Current limit state indicator.
# - `axp2101_vbus_good_indication`: VBUS bad indicator.
#
# ### I2C Device
#
# - `axp2101_i2cdev`: The I2C device.
#
# ### Output
#
# - `axp2101_dldo1`: DLDO1 power output control.

defaults:
  address: 0x34

i2c_device:
- id: "axp2101_i2cdev"
  address: "${address}"

output:
- id: "axp2101_dldo1"
  platform: "template"
  type: "binary"
  write_action:
  - lambda: !lambda |
      uint8_t bit = 7; // dldo1 enable
      uint8_t addr = 0x90; // LDOS ON/OFF control 0
      uint8_t value;
      auto err = id(axp2101_i2cdev)->read_register(addr, &value, sizeof value);
      if (err != ERROR_OK) {
        ESP_LOGE("axp2101", "Failed to read LDOS ON/OFF control 0");
        return;
      }
      if (state) {
        value |= (1 << bit);
      } else {
        value &= ~(1 << bit);
      }
      err = id(axp2101_i2cdev)->write_register(addr, &value, sizeof value);
      if (err != ERROR_OK) {
        ESP_LOGE("axp2101", "Failed to write LDOS ON/OFF control 0");
        return;
      }

script:
- id: "axp2101_read_pmu_status1"
  mode: "restart"
  then:
  - lambda: !lambda |
      uint8_t addr = 0x00; // PMU status1
      uint8_t value;
      auto err = id(axp2101_i2cdev)->read_register(addr, &value, sizeof value);
      if (err != ERROR_OK) {
        ESP_LOGE("axp2101", "Failed to read PMU status 1");
        return;
      }
      // Bit 0: Current Limit State (1 = in current limit)
      id(axp2101_current_limit_state)->publish_state((value & 0x01) != 0);
      // Bit 5: VBUS good indication (1 = good)
      id(axp2101_vbus_good_indication)->publish_state((value & 0x20) == 0);

binary_sensor:
- &axp2101_current_limit_state
  id: "axp2101_current_limit_state"
  name: "Current Limit State"
  device_class: "problem"
  entity_category: "diagnostic"
  platform: "template"

- <<: *axp2101_current_limit_state
  id: "axp2101_vbus_good_indication"
  name: "VBUS Good Indication"

interval:
- interval: "30s"
  then:
  - script.execute: "axp2101_read_pmu_status1"
