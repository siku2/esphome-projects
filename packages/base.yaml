packages:
  common: !include base_common.yaml

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: !secret wifi_domain
  fast_connect: true

sensor:
- id: "base_wifi_signal"
  name: "${i18n.base[language].wifi_signal}"
  entity_category: "DIAGNOSTIC"
  filters:
  - round: 1
  # Only send significant changes or every 24h
  - or:
    - throttle: "24h"
    - delta: 5.0
  platform: "wifi_signal"
  update_interval: "5min"

- id: "base_cpu_temperature"
  name: "${i18n.base[language].cpu_temperature}"
  entity_category: "DIAGNOSTIC"
  platform: "internal_temperature"
  update_interval: "5min"
  filters:
  - round: 1
  # Only send significant changes or every 24h
  - or:
    - throttle: "24h"
    - delta: 5.0
