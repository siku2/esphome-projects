substitutions:
  name: "test-water-tank"
  friendly_name: "Test Water Tank"
  language: "de"
  api_encryption_key: "cMNhlkc/B+MweuxUD90PfqrTs3fE/RoiOMW3J2YwuRU="

packages:
  base: !include ../base/device.yaml
  tank: !include
    file: "../projects/water-tank/tank.yaml"
    vars:
      tank_id: "tank"
      device_id: "tank_device"
      adc_pin: "GPIO35"
      attenuation: "12db"
      samples: 16
      sample_interval: "33ms"
      average_interval: "60s"
      window_size: 5
      voltage_max: 4.0
      fill_level_internal: true
      initial_voltage_empty: 0.5
      initial_voltage_full: 1.5
      initial_volume_full: 1000
  tank_level: !include
    file: "../projects/water-tank/level.yaml"
    vars:
      tank_id: "tank"
      device_id: "tank_device"
      full_pin: "GPIO23"
      full_supply_pin: "GPIO22"
      empty_entity_id: "binary_sensor.test_tank_empty"
  tank_2: !include
    file: "../projects/water-tank/tank.yaml"
    vars:
      tank_id: "tank_2"
      device_id: "tank_2_device"
      adc_pin: "GPIO34"
      attenuation: "6db"
      samples: 10
      sample_interval: "1s"
      average_interval: "30s"
      window_size: 2
      voltage_max: 1.8
      fill_level_internal: true
      initial_voltage_empty: 0.1
      initial_voltage_full: 1.0
      initial_volume_full: 500
  tank_2_link: !include
    file: "../projects/water-tank/linked.yaml"
    vars:
      tank_id: "tank_2"
      device_id: "tank_2_device"
      system_device_id: "system_device"
      linked_full_entity_id: "binary_sensor.test_tank_full"
      linked_volume_entity_id: "sensor.test_tank_fill_volume"
      linked_volume_full_entity_id: "number.test_tank_volume_full"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  devices:
  - id: "tank_device"
    name: "Tank"
  - id: "tank_2_device"
    name: "Tank 2"
  - id: "system_device"
    name: "System"

esp32:
  board: "esp32dev"
  framework:
    type: "esp-idf"
