substitutions:
  name: "test-water-tank"
  friendly_name: "Test Water Tank"
  language: "de"
  api_encryption_key: "cMNhlkc/B+MweuxUD90PfqrTs3fE/RoiOMW3J2YwuRU="

packages:
  base: !include ../packages/base/device.yaml
  tank: !include
    file: "../projects/water-tank/tank.yaml"
    vars:
      tank_id: "tank"
      tank_name: "Tank"
      adc_pin: "GPIO35"
      attenuation: "12db"
      samples: 255
      sample_interval: "5s"
      window_size: 60
      send_every: 12
      voltage_max: 4.0
      initial_voltage_empty: 0.5
      initial_voltage_full: 1.5
      initial_volume_full: 1000
      name_voltage: "Tank Voltage"
      name_percentage: "Tank Fill Percentage"
      name_volume: "Tank Fill Volume"
      name_volume_full: "Tank Volume Full"
  tank_level: !include
    file: "../projects/water-tank/level.yaml"
    vars:
      tank_id: "tank"
      tank_name: "Tank"
      full_pin: "GPIO23"
      full_supply_pin: "GPIO22"
      empty_entity_id: "binary_sensor.test_tank_empty"
  tank_2: !include
    file: "../projects/water-tank/voltage.yaml"
    vars:
      tank_id: "tank_2"
      adc_pin: "GPIO34"
      attenuation: "6db"
      samples: 10
      sample_interval: "1s"
      window_size: 60
      send_every: 30
      name_voltage: "Tank 2 Voltage"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"

esp32:
  board: "esp32dev"
  framework:
    type: "esp-idf"
