substitutions:
  name: "test-coolix-ac"
  friendly_name: "Test Coolix AC"
  language: "de"

packages:
  base: !include ../base/device.yaml
  ac: !include
    file: "../projects/coolix-ac/ac.yaml"
    vars:
      transmitter_pin: 14
      device_id: "ac_device"
      power_switch_entity_id: "switch.test_air_conditioner"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  devices:
  - id: "ac_device"
    name: "Test Air Conditioner"

esp32:
  board: "esp32dev"
  framework:
    type: "esp-idf"
