[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zeromouse-provision"
version = "0.1.0"
description = "Replace the stock ZeroMOUSE firmware with ESPHome and provision the device"
requires-python = ">=3.13"
dependencies = ["aioesphomeapi", "cryptography", "pyserial", "PyYAML"]

[project.scripts]
zeromouse-provision = "zeromouse_provision.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zeromouse_provision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
