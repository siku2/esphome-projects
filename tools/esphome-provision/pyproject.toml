[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "esphome-provision"
version = "0.1.0"
description = "Install ESPHome firmware on ESP32 devices with a verified backup and provision them"
requires-python = ">=3.13"
dependencies = ["aiohttp", "aioesphomeapi", "cryptography", "pyserial", "PyYAML"]

[project.scripts]
esphome-provision = "esphome_provision.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/esphome_provision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
