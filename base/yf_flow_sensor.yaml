sensor:
- platform: "pulse_meter"
  id: "${prefix}_rate"
  name: "${rate_name}"
  device_id: "${device_id}"
  pin:
    number: "${pin}"
    mode:
      input: true
      pullup: true
  unit_of_measurement: "L/min"
  device_class: "volume_flow_rate"
  state_class: "measurement"
  accuracy_decimals: 2
  internal_filter: "100us"
  timeout: "2s"
  filters:
  # Datasheet: F[Hz] = K * Q[L/min] - 3. Input is pulses per minute.
  - lambda: !lambda |-
      return x > 0 ? (x / 60.0f + 3.0f) / (float) ${k} : 0.0f;
  - throttle_with_priority:
      timeout: "5s"
      value: 0.0
  total:
    id: "${prefix}_total"
    name: "${total_name}"
    device_id: "${device_id}"
    unit_of_measurement: "L"
    device_class: "water"
    state_class: "total_increasing"
    accuracy_decimals: 1
    filters:
    # Each pulse is (1 + 3 * T) / (60 * K) L, with T the pulse period in seconds.
    - lambda: !lambda |-
        static double liters = 0;
        static float last_count = 0;
        static uint32_t last_ms = 0;
        uint32_t now = millis();
        uint32_t dt = now - last_ms;
        if (dt > 2000 || x == last_count) dt = 0;
        liters += ((x - last_count) + 3.0 * dt / 1000.0) / (60.0 * ${k});
        last_count = x;
        last_ms = now;
        return liters;
    - or:
      - throttle: "10s"
      - debounce: "1s"
