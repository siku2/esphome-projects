substitutions:
  # CI sets this to a hash of the build inputs, so the update entity only offers changed firmware
  firmware_version: "dev"
  language: "en"
  timezone: "Europe/Zurich"
  i18n:
    base:
      de:
        restart: "Neustarten"
        firmware: "Firmware"
        log_level: "Log-Stufe"
        last_restart: "Letzter Neustart"
        wifi_signal: "WLAN-Signal"
        restart_reason: "Neustart Grund"
        cpu_temperature: "CPU Temperatur"
        nvs_usage: "NVS Belegung"

      en:
        restart: "Restart"
        firmware: "Firmware"
        log_level: "Log Level"
        last_restart: "Last Restart"
        wifi_signal: "WiFi Signal"
        restart_reason: "Restart Reason"
        cpu_temperature: "CPU Temperature"
        nvs_usage: "NVS Usage"

esphome:
  project:
    name: "siku2.esphome-projects"
    version: "${firmware_version}"

api:
  encryption: {}

debug:
  update_interval: "never"

logger:
  level: "DEBUG"
  initial_level: "INFO"

button:
- id: "base_restart"
  platform: "restart"
  name: "${i18n.base[language].restart}"

select:
- id: "base_log_level"
  platform: "logger"
  name: "${i18n.base[language].log_level}"

sensor:
- id: "base_last_restart"
  entity_category: "DIAGNOSTIC"
  platform: "uptime"
  type: "timestamp"
  name: "${i18n.base[language].last_restart}"

text_sensor:
- platform: "debug"
  reset_reason:
    name: "${i18n.base[language].restart_reason}"

time:
- id: "base_homeassistant_time"
  timezone: "${timezone}"
  platform: "homeassistant"
