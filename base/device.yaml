packages:
  common: !include common.yaml
  wifi_migration: !include wifi_migration.yaml
  api_key_migration: !include api_key_migration.yaml

esphome:
  includes:
  - "<nvs.h>"

ota:
- id: "base_ota"
  platform: "esphome"
  encryption: {}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: !secret wifi_domain
  fast_connect: true

sensor:
- id: "base_wifi_signal"
  name: "${i18n.base[language].wifi_signal}"
  entity_category: "DIAGNOSTIC"
  filters:
  - round: 1
  # Only send significant changes or every 24h
  - or:
    - throttle: "24h"
    - delta: 5.0
  platform: "wifi_signal"
  update_interval: "5min"

- id: "base_cpu_temperature"
  name: "${i18n.base[language].cpu_temperature}"
  entity_category: "DIAGNOSTIC"
  platform: "internal_temperature"
  update_interval: "5min"
  filters:
  - round: 1
  # Only send significant changes or every 24h
  - or:
    - throttle: "24h"
    - delta: 5.0

- id: "base_nvs_usage"
  name: "${i18n.base[language].nvs_usage}"
  entity_category: "DIAGNOSTIC"
  unit_of_measurement: "%"
  state_class: "measurement"
  icon: "mdi:database"
  accuracy_decimals: 0
  platform: "template"
  update_interval: "1h"
  lambda: !lambda |-
    nvs_stats_t stats;
    if (nvs_get_stats(nullptr, &stats) != ESP_OK || stats.total_entries == 0)
      return NAN;
    return 100.0f * stats.used_entries / stats.total_entries;
