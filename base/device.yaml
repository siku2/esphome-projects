packages:
  common: !include common.yaml

esphome:
  includes:
  - "<nvs.h>"
  on_boot:
  - priority: -100
    then:
    - script.execute: "base_update_ota_password"

ota:
- id: "base_ota"
  platform: "esphome"
  password: ""
- platform: "http_request"

http_request:

update:
- id: "base_firmware_update"
  name: "${i18n.base[language].firmware}"
  platform: "http_request"
  source: "https://siku2.io/esphome-projects/${name}/manifest.json"

wifi:
  fast_connect: true

improv_serial:

provisioning:
  timeout: "1h"
  on_timeout:
  - script.execute: "base_update_ota_password"

api:
  on_client_connected:
  - script.execute: "base_update_ota_password"

script:
# Plaintext uploads need the API key as password. Without a key they are open like the API, until the
# provisioning window closes.
- id: "base_update_ota_password"
  then:
  - lambda: !lambda |-
      noise::psk_t psk;
      if (api::load_saved_noise_psk(psk)) {
        id(base_ota).set_auth_password(format_hex(psk.data(), psk.size()));
        ESP_LOGI("ota", "Plaintext uploads need the API key");
      } else if (provisioning::global_provisioning_manager->closed()) {
        char random[33];
        snprintf(random, sizeof(random), "%08" PRIx32 "%08" PRIx32 "%08" PRIx32 "%08" PRIx32, random_uint32(),
                 random_uint32(), random_uint32(), random_uint32());
        id(base_ota).set_auth_password(random);
        ESP_LOGI("ota", "Plaintext uploads are blocked until the next boot");
      } else {
        id(base_ota).set_auth_password("");
        ESP_LOGI("ota", "Plaintext uploads are open until the device has an API key");
      }

sensor:
- id: "base_wifi_signal"
  name: "${i18n.base[language].wifi_signal}"
  entity_category: "DIAGNOSTIC"
  filters:
  - round: 1
  # Only send significant changes or every 24h
  - or:
    - throttle: "24h"
    - delta: 5.0
  platform: "wifi_signal"
  update_interval: "5min"

- id: "base_cpu_temperature"
  name: "${i18n.base[language].cpu_temperature}"
  entity_category: "DIAGNOSTIC"
  platform: "internal_temperature"
  update_interval: "5min"
  filters:
  - round: 1
  # Only send significant changes or every 24h
  - or:
    - throttle: "24h"
    - delta: 5.0

- id: "base_nvs_usage"
  name: "${i18n.base[language].nvs_usage}"
  entity_category: "DIAGNOSTIC"
  unit_of_measurement: "%"
  state_class: "measurement"
  icon: "mdi:database"
  accuracy_decimals: 0
  filters:
  # Only send significant changes or every 24h
  - or:
    - throttle: "24h"
    - delta: 5.0
  platform: "template"
  update_interval: "1h"
  lambda: !lambda |-
    nvs_stats_t stats;
    if (nvs_get_stats(nullptr, &stats) != ESP_OK || stats.total_entries == 0)
      return NAN;
    return 100.0f * stats.used_entries / stats.total_entries;
