# Saves the compiled credentials where a build without them looks for saved ones.
wifi:
  on_connect:
  - lambda: !lambda |-
      static auto pref = global_preferences->make_preference<wifi::SavedWifiSettings>(88491487UL, true);
      auto sta = wifi::global_wifi_component->get_sta();
      if (sta.get_ssid().empty())
        return;
      wifi::SavedWifiSettings saved{};
      if (pref.load(&saved) && strcmp(saved.ssid, sta.get_ssid().c_str()) == 0 &&
          strcmp(saved.password, sta.get_password().c_str()) == 0) {
        ESP_LOGI("wifi_migration", "Credentials for %s are already saved", saved.ssid);
        return;
      }
      wifi::SavedWifiSettings save{};
      strncpy(save.ssid, sta.get_ssid().c_str(), sizeof(save.ssid) - 1);
      strncpy(save.password, sta.get_password().c_str(), sizeof(save.password) - 1);
      if (pref.save(&save) && global_preferences->sync()) {
        ESP_LOGI("wifi_migration", "Saved credentials for %s", save.ssid);
      } else {
        ESP_LOGE("wifi_migration", "Failed to save credentials for %s", save.ssid);
      }
