# Saves the compiled API key where a build without one looks for a provisioned key.
esphome:
  on_boot:
  - priority: -100
    then:
    - lambda: !lambda |-
        #ifndef USE_API_NOISE_PSK_FROM_YAML
        id(base_api_key_migration).publish_state("no compiled key");
        #else
        api::SavedNoisePsk compiled{};
        api::global_api_server->get_noise_ctx().load_psk(compiled.psk);
        auto pref = global_preferences->make_preference<api::SavedNoisePsk>(88491486UL, true);
        api::SavedNoisePsk saved{};
        if (pref.load(&saved) && saved.psk == compiled.psk) {
          ESP_LOGI("api_key_migration", "API key is already saved");
          id(base_api_key_migration).publish_state("saved");
          return;
        }
        if (pref.save(&compiled) && global_preferences->sync()) {
          ESP_LOGI("api_key_migration", "Saved API key");
          id(base_api_key_migration).publish_state("saved");
        } else {
          ESP_LOGE("api_key_migration", "Failed to save API key");
          id(base_api_key_migration).publish_state("failed");
        }
        #endif

text_sensor:
- id: "base_api_key_migration"
  name: "${i18n.base[language].api_key_migration}"
  entity_category: "DIAGNOSTIC"
  icon: "mdi:key-arrow-right"
  platform: "template"
